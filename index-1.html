  return `${!mv.what ? `<div class="pn tint"><div class="row between gap12"><div><b>Define o que é a Mova</b><div class="tx2" style="font-size:13px;margin-top:2px">Não encontrei informação sobre a Mova no teu Notion nem nesta conversa, por isso não inventei nada. Preenche o perfil (o que vende, a quem, fase) e as metas: os alertas e o dashboard adaptam-se.</div></div><a class="btn pri" href="#mova.perfil">Preencher perfil</a></div></div>` : ''}
  <div class="kpis">${UI.kpi('Receita do mês', U.eur(m.rev), tgt ? U.pct(m.rev / tgt) + ' da meta de ' + U.eur(tgt, { dec: 0 }) : UI.trend(m.rev, pm.rev) + ' vs mês anterior')}${UI.kpi('Custos', U.eur(m.cogs + m.opex), 'produto ' + U.eurK(m.cogs) + ' · operação ' + U.eurK(m.opex))}${UI.kpi('Lucro', U.eur(m.profit), m.rev ? 'margem ' + U.pct(m.margin) : '', { tone: m.profit >= 0 ? 'pos' : 'neg' })}${UI.kpi('Clientes ativos', act.length, cl.filter(c => c.status === 'Lead' || c.status === 'Proposta').length + ' em pipeline')}${UI.kpi('Ticket médio', m.n ? U.eur(m.ticket) : '—', m.n + ' vendas')}${UI.kpi('CAC', m.cac != null ? U.eur(m.cac) : '—', 'marketing ÷ novos clientes')}${UI.kpi('A receber', U.eur(m.pending), '', { tone: m.pending ? 'warn' : '' })}</div>
  ${tgt ? `<div class="pn"><div class="row between" style="margin-bottom:8px;font-size:13px"><span>Meta de receita de ${U.fmtYML(ym)}</span><span class="mono">${U.eur(m.rev, { dec: 0 })} / ${U.eur(tgt, { dec: 0 })}</span></div>${UI.bar(m.rev / tgt, m.rev >= tgt ? 'pos' : '', day / U.dim(ym))}</div>` : ''}
  <div class="g g-main"><div class="pn"><div class="pn-h"><h3>Receita e custos · 12 meses</h3></div>${C.mount({ type: 'bar', labels: months.map(U.fmtYM), series: [{ name: 'Receita', data: md.map(x => x.rev), color: 'var(--pos)' }, { name: 'Custos', data: md.map(x => x.cogs + x.opex), color: 'var(--c4)' }], fmt: U.eurK, empty: 'Regista vendas e despesas da Mova.' }, 220)}</div>
  <div class="pn"><div class="pn-h"><h3>Lucro mensal</h3></div>${C.mount({ type: 'bar', labels: months.map(U.fmtYM), series: [{ name: 'Lucro', data: md.map(x => x.rev || x.opex ? x.profit : null), color: v => v >= 0 ? 'var(--pos)' : 'var(--neg)' }], fmt: U.eurK }, 220)}</div></div>
  <div class="g g3"><div class="pn"><div class="pn-h"><h3>Produtos (3 meses)</h3></div>${C.mount({ type: 'donut', data: byProd, max: 5 }, 170)}</div>
  <div class="pn"><div class="pn-h"><h3>Melhores clientes</h3></div>${byCl.length ? byCl.map(x => `<div class="li" data-edit="mvclients:${x.c.id}" style="cursor:pointer"><div class="li-t"><b>${esc(x.c.name)}</b><small>${x.n} compra(s)</small></div><span class="mono">${U.eur(x.v, { dec: 0 })}</span></div>`).join('') : UI.empty('Sem vendas com cliente.')}</div>
  <div class="pn"><div class="pn-h"><h3>Operações</h3><a class="more" href="#mova.operacoes">${UI.ic('right')}</a></div>${tasks.slice(0, 5).map(x => OS.taskRow(x, { focus: false })).join('') || UI.empty('Sem tarefas @Mova.')}</div></div>
  ${m.profit > 0 ? `<div class="row gap8"><button class="btn sm" data-new="transactions" data-defs='${esc(JSON.stringify({ type: 'Receita', cat: 'Mova', sub: 'Distribuição de lucro', desc: 'Mova · distribuição ' + U.fmtYML(ym) }))}'>${UI.ic('wallet')}Distribuir lucro para as finanças pessoais</button><span class="mut" style="font-size:12.5px">Mantém separadas as contas da empresa e as pessoais: só o que distribuis entra no teu orçamento.</span></div>` : ''}`;
};
MV.vendas = () => { const S = U.sortBy(OS.all('mvsales'), s => s.date, -1); return UI.table({ key: 'mvs', coll: 'mvsales', rows: S, limit: 50, empty: 'Sem vendas.', emptyAct: UI.addBtn('mvsales', 'Registar venda', null, ''), cols: [{ l: 'Data', v: s => `<span class="mono">${U.fmtD(s.date)}</span>`, s: s => s.date }, { l: 'Cliente', v: s => esc((OS.get('mvclients', s.client) || {}).name || '—') }, { l: 'Produto', v: s => esc((OS.get('mvproducts', s.product) || {}).name || s.desc || '—'), cls: 'wrap' }, { l: 'Qtd.', cls: 'r', v: s => s.qty || 1 }, { l: 'Receita', cls: 'r', v: s => `<span class="mono">${U.eur(Mv.rev(s))}</span>`, s: Mv.rev }, { l: 'Margem', cls: 'r', v: s => { const r = Mv.rev(s); return r ? `<span class="mono">${U.pct((r - Mv.cost(s)) / r)}</span>` : '—'; } }, { l: 'Pagamento', v: s => UI.badge(s.status, s.status === 'Pago' ? 'pos' : s.status === 'Pendente' ? (s.dueDate && s.dueDate < U.today() ? 'neg' : 'warn') : '') }] }); };
MV.despesas = () => UI.table({ key: 'mve', coll: 'mvexp', rows: U.sortBy(OS.all('mvexp'), e => e.date, -1), limit: 50, empty: 'Sem despesas.', emptyAct: UI.addBtn('mvexp', 'Registar despesa', null, ''), cols: [{ l: 'Data', v: e => `<span class="mono">${U.fmtD(e.date)}</span>`, s: e => e.date }, { l: 'Descrição', v: e => esc(e.desc || '—'), cls: 'wrap' }, { l: 'Categoria', v: e => esc(e.cat) }, { l: 'Recorrente', v: e => e.recurring ? UI.badge('sim', 'out') : '' }, { l: 'Valor', cls: 'r', v: e => `<span class="mono">${U.eur(e.amount)}</span>`, s: e => U.num(e.amount) }] });
MV.clientes = () => { const CL = OS.all('mvclients'); const ST = ['Lead', 'Proposta', 'Ativo', 'Inativo', 'Perdido']; return `<div class="row gap8">${UI.addBtn('mvclients', 'Novo cliente')}</div><div class="kan">${ST.map(s => { const it = CL.filter(c => (c.status || 'Lead') === s); return `<div class="kcol"><h4>${s}<span class="mono">${it.length}</span></h4>${it.map(c => { const tot = U.sum(OS.all('mvsales').filter(x => x.client === c.id && x.status !== 'Cancelado'), Mv.rev); return `<div class="kcard" data-edit="mvclients:${c.id}"><b>${esc(c.name)}</b><div class="meta">${c.source ? `<span>${esc(c.source)}</span>` : ''}${tot ? `<span class="mono">${U.eur(tot, { dec: 0 })}</span>` : ''}${c.next ? UI.badge('contactar ' + U.fmtDS(c.next), c.next <= U.today() ? 'warn' : '') : ''}</div></div>`; }).join('')}</div>`; }).join('')}</div>`; };
MV.produtos = () => UI.table({ key: 'mvp', coll: 'mvproducts', rows: OS.all('mvproducts'), empty: 'Sem produtos ou serviços.', emptyAct: UI.addBtn('mvproducts', 'Adicionar produto', null, ''), cols: [{ l: 'Produto / serviço', v: p => `<b style="font-weight:520">${esc(p.name)}</b>${p.active === false ? ' ' + UI.badge('inativo') : ''}`, s: p => p.name }, { l: 'Preço', cls: 'r', v: p => `<span class="mono">${U.eur(p.price)}</span>` }, { l: 'Custo', cls: 'r', v: p => `<span class="mono">${U.eur(p.cost)}</span>` }, { l: 'Margem', cls: 'r', v: p => U.num(p.price) ? `<span class="mono">${U.pct((U.num(p.price) - U.num(p.cost)) / U.num(p.price))}</span>` : '—' }, { l: 'Vendido (total)', cls: 'r', v: p => `<span class="mono">${U.eur(U.sum(OS.all('mvsales').filter(s => s.product === p.id), Mv.rev), { dec: 0 })}</span>` }] });
MV.marketing = () => { const M = OS.all('mvmkt'); const by = Object.entries(U.groupBy(M, m => m.channel || 'Outro')).map(([l, a]) => ({ l, cost: U.sum(a, x => x.cost), leads: U.sum(a, x => x.leads), conv: U.sum(a, x => x.conv) })); return `<div class="row gap8">${UI.addBtn('mvmkt', 'Nova ação')}</div>${by.length ? `<div class="pn"><div class="pn-h"><h3>Desempenho por canal</h3></div><table class="cmp"><thead><tr><th>Canal</th><th>Custo</th><th>Leads</th><th>Conversões</th><th>Conversão</th><th>Custo por cliente</th></tr></thead><tbody>${by.map(b => `<tr><td>${esc(b.l)}</td><td class="mono">${U.eur(b.cost)}</td><td class="mono">${b.leads}</td><td class="mono">${b.conv}</td><td class="mono">${b.leads ? U.pct(b.conv / b.leads) : '—'}</td><td class="mono">${b.conv ? U.eur(b.cost / b.conv) : '—'}</td></tr>`).join('')}</tbody></table></div>` : ''}${UI.table({ key: 'mvm', coll: 'mvmkt', rows: U.sortBy(M, m => m.date, -1), empty: 'Sem ações de marketing.', cols: [{ l: 'Data', v: m => U.fmtD(m.date), s: m => m.date }, { l: 'Canal', v: m => esc(m.channel || '') }, { l: 'Ação', v: m => esc(m.action), cls: 'wrap' }, { l: 'Custo', cls: 'r', v: m => U.eur(m.cost) }, { l: 'Leads', cls: 'r', v: m => m.leads || 0 }, { l: 'Conversões', cls: 'r', v: m => m.conv || 0 }] })}`; };
MV.operacoes = () => { const T = OS.all('tasks').filter(x => (x.ctx || []).includes('@Mova') || x.area === 'Mova'), P = OS.all('projects').filter(p => p.type === 'Empresarial'); return `<div class="row gap8">${UI.addBtn('tasks', 'Tarefa', { ctx: ['@Mova'], area: 'Mova', status: 'Próxima' })}${UI.addBtn('projects', 'Projeto empresarial', { type: 'Empresarial' }, '')}</div><div class="g g2"><div class="pn"><div class="pn-h"><h3>Tarefas</h3></div>${T.filter(x => x.status !== 'Feita').map(x => OS.taskRow(x)).join('') || UI.empty('Sem tarefas abertas.')}</div><div class="pn"><div class="pn-h"><h3>Projetos empresariais</h3></div>${P.map(p => { const i = OS.Proj.info(p); return `<div class="li" data-edit="projects:${p.id}" style="cursor:pointer"><div class="li-t"><b>${esc(p.name)}</b><small>${p.status} · ${i.done.length}/${i.tasks.length} tarefas</small></div><span class="mono">${Math.round(i.prog * 100)}%</span></div>`; }).join('') || UI.empty('Sem projetos.')}</div></div>`; };
MV.perfil = () => { const mv = OS.one('mova'); const F = [['name', 'Nome', 'text'], ['stage', 'Fase', 'sel', ['Ideia', 'Validação', 'Primeiros clientes', 'Operação', 'Crescimento']], ['what', 'O que é', 'area'], ['offer', 'O que vende', 'area'], ['customer', 'Cliente ideal', 'area'], ['founded', 'Início de atividade', 'date'], ['revenueTarget', 'Meta de receita mensal (€)', 'num'], ['clientsTarget', 'Meta de clientes ativos', 'num'], ['marginTarget', 'Margem alvo (%)', 'num'], ['notes', 'Notas estratégicas', 'area']];
  return `<div class="pn"><div class="fgrid">${F.map(([k, l, t, o]) => `<div class="fld ${t === 'area' ? 'wide' : ''}"><label for="mv_${k}">${l}</label>${t === 'area' ? `<textarea id="mv_${k}" rows="3" data-bind="mova.${k}" data-fk="mv${k}">${esc(mv[k])}</textarea>` : t === 'sel' ? `<select id="mv_${k}" data-bind="mova.${k}">${o.map(x => `<option${mv[k] === x ? ' selected' : ''}>${x}</option>`).join('')}</select>` : `<input id="mv_${k}" type="${t === 'num' ? 'number' : t}" value="${esc(mv[k])}" data-bind="mova.${k}" data-fk="mv${k}">`}</div>`).join('')}</div></div>
  <div class="note">Contexto do teu Notion: tinhas a meta "Abrir minha Empresa" (Crumbel Royal Co.) e, no Dominus, marcos para estruturar e lançar a Crumbel Royal. Se a Mova for essa empresa ou outra, escreve-o aqui.</div>`; };
})();

</script>
<script>
/* OCEANUM — Direção: North Star, Roadmap, Long Term, Decision Center, Revisões, Minha Evolução, Definições. */
(() => {
'use strict';
const U = OS.U, UI = OS.UI, C = OS.C, V = OS.views, L = OS.L, esc = U.esc, A = OS.act, I = OS.Intel, Goal = OS.Goal, Fin = OS.Fin;

/* ================= NORTH STAR ================= */
V.northstar = () => {
  const ns = OS.one('northstar'), t = U.today(), from = U.addDays(t, -29);
  const H = [['h3m', '3 meses', '3 meses'], ['h1y', '1 ano', '1 ano'], ['h3y', '3 anos', '3 anos'], ['h5y', '5 anos', '5 anos'], ['hlong', 'Longo prazo', 'Longo prazo']];
  const done = OS.all('tasks').filter(x => x.doneAt && x.doneAt >= from);
  const linked = done.filter(x => x.goal || x.project);
  const byH = {}; L.HORIZON.forEach(h => byH[h] = 0);
  done.forEach(x => { const g = OS.get('goals', x.goal) || OS.get('goals', (OS.get('projects', x.project) || {}).goal); if (g) byH[g.horizon] = (byH[g.horizon] || 0) + 1; });
  const mins = { 'Universidade': U.sum(OS.all('sessions').filter(s => s.date >= from && s.subject), s => s.minutes) / 60, 'Aprendizagem': U.sum(OS.all('sessions').filter(s => s.date >= from && s.skill), s => s.minutes) / 60, 'Treino': U.sum(OS.all('workouts').filter(w => w.date >= from), w => U.num(w.dur) || 60) / 60, 'Corrida': U.sum(OS.all('runs').filter(r => r.date >= from), r => U.parseDur(r.time)) / 3600, 'Trabalho': U.sum(OS.all('shifts').filter(s => s.date >= from), OS.Car.shiftHours) };
  return UI.head('North Star', 'A tua direção. Tudo o que fazes deve empurrar pelo menos um destes horizontes. Em baixo, o sistema mostra se os últimos 30 dias estão alinhados.', '', 'Direção') +
  `<div class="g g-main"><div class="col gap16">${H.map(([k, l, h]) => { const gs = OS.all('goals').filter(g => g.horizon === h && g.status === 'Ativa'); return `<div class="pn"><div class="pn-h"><h3>${l}</h3>${UI.addBtn('goals', 'Meta', { horizon: h }, 'ghost sm')}</div><div class="qa"><textarea aria-label="Visão a ${l}" data-bind="northstar.${k}" data-fk="ns${k}" placeholder="Onde queres estar daqui a ${l.toLowerCase()}?">${esc(ns[k])}</textarea></div>${gs.length ? `<div style="margin-top:10px">${gs.map(g => { const i = Goal.info(g); return `<div class="bar-row" style="grid-template-columns:minmax(120px,1fr) 140px 60px;cursor:pointer" data-edit="goals:${g.id}"><span class="l">${esc(g.title)}</span>${UI.bar(i.p, i.p >= 1 ? 'pos' : i.behind ? 'warn' : '', i.exp)}<span class="v">${Math.round(i.p * 100)}%</span></div>`; }).join('')}</div>` : ''}</div>`; }).join('')}</div>
  <div class="col gap16"><div class="pn"><div class="pn-h"><h3>${UI.ic('compass')}Alinhamento · 30 dias</h3></div>
    <div class="big-num">${done.length ? U.pct(linked.length / done.length) : '—'}</div><div class="mut" style="font-size:12.5px;margin-bottom:12px">das ${done.length} tarefas concluídas estavam ligadas a uma meta ou projeto</div>
    ${L.HORIZON.map(h => `<div class="bar-row" style="grid-template-columns:90px 1fr 30px"><span class="l">${h}</span>${UI.bar(done.length ? byH[h] / done.length : 0, 'vio')}<span class="v">${byH[h]}</span></div>`).join('')}
    <div class="divider"></div><div class="eyebrow" style="margin-bottom:6px">Onde foi o teu tempo (horas)</div>${Object.entries(mins).map(([k, v]) => `<div class="bar-row" style="grid-template-columns:100px 1fr 44px"><span class="l">${k}</span>${UI.bar(v / Math.max(1, ...Object.values(mins)), '')}<span class="v">${U.nf(v, 0)}</span></div>`).join('')}
    ${done.length && linked.length / done.length < .4 ? `<div class="note" style="margin-top:10px">Menos de 40% do que fizeste estava ligado a uma meta. Liga tarefas às metas ou pergunta se elas merecem o teu tempo.</div>` : ''}</div>
  <div class="pn"><div class="pn-h"><h3>Identidade</h3></div>${[['identity', 'Quem eu sou'], ['values', 'Os meus valores'], ['notAccept', 'O que não aceito mais em mim']].map(([k, l]) => `<div class="qa" style="margin-bottom:10px"><label for="ns_${k}">${l}</label><textarea id="ns_${k}" data-bind="northstar.${k}" data-fk="ns_${k}">${esc(ns[k])}</textarea></div>`).join('')}</div>
  <div class="pn"><div class="pn-h"><h3>${UI.ic('crown')}Do teu Codex</h3><a class="more" href="#dominus.codex">Dominus ${UI.ic('right')}</a></div><div class="mut" style="font-size:12.5px;margin-bottom:8px">Próximo marco de legado em cada pilar (dos teus 100 marcos no Notion)</div>${(OS.Dom ? OS.Dom.nextLegacy() : []).map(x => `<div class="li"><div class="li-t"><b>${esc(x.t)}</b><small>${x.pillar} · marco ${x.n}</small></div></div>`).join('')}</div></div></div>`;
};

/* ================= ROADMAP ================= */
V.roadmap = () => {
  const t = U.today(), hz = OS.ui.rmH || 'medio', end = hz === 'curto' ? U.addDays(t, 92) : hz === 'medio' ? U.addDays(t, 366) : U.addDays(t, 365 * 5);
  const start = U.addDays(t, -30), span = U.diff(end, start);
  const X = d => U.clamp(U.diff(d, start) / span, 0, 1) * 100;
  const goals = OS.all('goals').filter(g => g.status !== 'Abandonada' && (g.due || g.start) && (g.due || '9') >= start && (g.start || g.due) <= end);
  const projs = OS.all('projects').filter(p => !['Cancelado'].includes(p.status) && (p.due || p.start) && (p.due || '9') >= start && (p.start || p.due) <= end);
  const ms = OS.all('milestones').filter(m => m.date >= start && m.date <= end);
  const lanes = [...new Set([...goals.map(g => g.cat), ...projs.map(p => 'Projetos · ' + p.type), ...ms.map(m => 'Marcos')])];
  const ticks = []; let d = U.ym(start) + '-01'; const step = hz === 'longo' ? 6 : hz === 'medio' ? 1 : 1; while (d <= end) { ticks.push(d); d = U.addMonths(U.ym(d), step) + '-01'; }
  const bar = (title, s, e, color, edit, kind) => { const a = X(s || e), b = X(e || s); return `<div class="road-it" data-edit="${edit}" title="${esc(title)}" style="left:${a}%;width:max(${Math.max(b - a, 1.5)}%,90px);border-color:${color};background:color-mix(in srgb,${color} 18%,var(--pn))">${esc(title)}</div>`; };
  const tree = OS.all('goals').filter(g => g.status === 'Ativa').map(g => { const i = Goal.info(g); const ps = OS.all('projects').filter(p => p.goal === g.id); const ts = OS.all('tasks').filter(x => x.goal === g.id && !x.project);
    return `<div class="pn"><div class="tree"><div class="tree-it"><span class="k">Objetivo</span><b class="click" data-edit="goals:${g.id}" style="cursor:pointer">${esc(g.title)}</b>${UI.badge(i.st[0], i.st[1])}<span class="mono mut" style="font-size:12px">${Math.round(i.p * 100)}%</span></div><div class="tree-n">
      ${ps.map(p => { const pi = OS.Proj.info(p); return `<div class="tree-it"><span class="k">Projeto</span><span class="click" data-edit="projects:${p.id}" style="cursor:pointer">${esc(p.name)}</span><span class="mono mut" style="font-size:12px">${Math.round(pi.prog * 100)}%</span></div><div class="tree-n">${pi.tasks.slice(0, 6).map(x => `<div class="tree-it"><span class="k">Tarefa</span><span class="${x.status === 'Feita' ? 'mut' : ''}" style="${x.status === 'Feita' ? 'text-decoration:line-through' : ''}">${esc(x.title)}</span></div>`).join('')}${pi.kpis.map(k => `<div class="tree-it"><span class="k">Indicador</span>${esc(k.l)}: <span class="mono">${k.cur}/${k.tgt}</span></div>`).join('')}${p.expected ? `<div class="tree-it"><span class="k">Resultado</span>${esc(p.expected)}</div>` : ''}</div>`; }).join('')}
      ${(g.steps || []).map(s => `<div class="tree-it"><span class="k">Etapa</span><span style="${s.done ? 'text-decoration:line-through;color:var(--mut)' : ''}">${esc(s.t)}</span></div>`).join('')}
      ${ts.slice(0, 5).map(x => `<div class="tree-it"><span class="k">Tarefa</span>${esc(x.title)}</div>`).join('')}
      <div class="tree-it"><span class="k">Indicador</span>${Goal.fmt(g, i.cur)} de ${Goal.fmt(g, i.tgt)}</div></div></div></div>`; }).join('');
  return UI.head('Roadmap da vida', 'Os teus objetivos, projetos e marcos no tempo. Tudo editável: clica em qualquer elemento.', `${UI.addBtn('milestones', 'Marco')}${UI.addBtn('goals', 'Objetivo', null, '')}`, 'Direção') +
  `<div class="row between gap8">${UI.seg('rmH', [['curto', 'Curto prazo · 3 meses'], ['medio', 'Médio · 1 ano'], ['longo', 'Longo · 5 anos']], hz)}<div class="legend" style="margin:0"><span><i style="background:var(--c8)"></i>Metas</span><span><i style="background:var(--c2)"></i>Projetos</span><span><i style="background:var(--warn)"></i>Marcos</span></div></div>
  ${lanes.length ? `<div class="road"><div class="road-in"><div class="road-lane" style="min-height:0"><div class="lname"></div><div class="road-axis" style="position:relative">${ticks.map(tk => `<div style="position:absolute;left:${X(tk)}%;border-left:1px solid var(--line);padding:6px 6px;font:11px var(--mono);color:var(--mut)">${U.fmtYM(U.ym(tk))}</div>`).join('')}<div style="height:28px"></div></div></div>
    ${lanes.map(l => `<div class="road-lane"><div class="lname">${esc(l)}</div><div class="ltrack" style="min-height:${Math.max(52, 40 * (goals.filter(g => g.cat === l).length + projs.filter(p => 'Projetos · ' + p.type === l).length + (l === 'Marcos' ? 1 : 0)) + 12)}px"><div class="road-today" style="left:${X(t)}%"></div>
      ${[...goals.filter(g => g.cat === l).map(g => ['g', g]), ...projs.filter(p => 'Projetos · ' + p.type === l).map(p => ['p', p])].map(([k, o], i) => `<div style="position:absolute;left:0;right:0;top:${i * 40}px;height:40px">${k === 'g' ? bar(o.title, o.start, o.due, 'var(--c8)', 'goals:' + o.id) : bar(o.name, o.start, o.due, 'var(--c2)', 'projects:' + o.id)}</div>`).join('')}
      ${l === 'Marcos' ? ms.map(m => `<div class="road-it ms" data-edit="milestones:${m.id}" style="left:${X(m.date)}%;${m.done ? 'opacity:.55' : ''}">◆ ${esc(m.title)}</div>`).join('') : ''}</div></div>`).join('')}</div></div>` : UI.empty('Define prazos nas metas e projetos, ou cria marcos, para os veres na linha do tempo.')}
  <section><div class="sech"><h2>Objetivo → Projeto → Etapas → Tarefas → Indicadores → Resultado</h2></div>${tree || UI.empty('Sem metas ativas.')}</section>`;
};

/* ================= LONG TERM ================= */
V.longterm = () => {
  const t = U.today(), p = OS.one('profile'), pr = I.finProjection(), nw = Fin.netWorth();
  const lt = OS.all('goals').filter(g => ['3 anos', '5 anos', 'Longo prazo'].includes(g.horizon) && g.status !== 'Abandonada');
  const r = .05 / 12, mn = pr.monthlyNet; const proj = [0, 1, 2, 3, 5, 10].map(y => { let v = nw; for (let m = 0; m < y * 12; m++) v = v * (1 + r) + Math.max(0, mn); return v; });
  const ects = OS.St.ectsDone(), tot = U.num(p.ectsTotal) || 180;
  const semsLeft = Math.ceil((tot - ects) / 30);

A.exportData = async () => { let dl = null; try { dl = window.claude && await window.claude.use('downloads'); } catch (e) { } if (!dl) { try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(OS.exportAll())], { type: 'application/json' })); a.download = 'oceanum-' + U.today() + '.json'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); UI.toast('Cópia exportada', 'pos'); } catch (e) { UI.toast('Exportação indisponível nesta vista', 'warn'); } return; } try { await dl.save({ filename: 'oceanum-' + U.today() + '.json', data: JSON.stringify(OS.exportAll()) }); UI.toast('Cópia exportada', 'pos'); } catch (e) { UI.toast('Exportação cancelada'); } };

<script>
/* OCEANUM — Dieta: refeições, calorias, macros, água, biblioteca de alimentos e metas.
   Registar a dieta e bater a proteína alimenta o pilar Corpo no DOMINUS. */
(() => {
'use strict';
const U = OS.U, UI = OS.UI, esc = U.esc, V = OS.views, A = OS.act, S = OS.S, C = OS.C;
const F = (k, l, t = 'text', x = {}) => Object.assign({ k, l, t }, x);
const MEALS = ['Pequeno-almoço', 'Almoço', 'Lanche', 'Jantar', 'Ceia', 'Snack'];
const ACT = [['1.2', 'Sedentário'], ['1.375', 'Leve (1–3 treinos/sem.)'], ['1.55', 'Moderado (3–5)'], ['1.725', 'Intenso (6–7)'], ['1.9', 'Muito intenso']];
const GOALS = [['cut', 'Perder gordura'], ['keep', 'Manter'], ['bulk', 'Ganhar massa']];

OS.ONE_DEF.diet = { kcal: 2400, p: 150, c: 280, f: 70, water: 3000, waterLog: {}, h: '', age: '', sex: 'M', act: '1.55', goal: 'keep' };
OS.SHARD.meals = 200;
S.foods = { label: 'Alimento', title: r => r.name, fields: [
  F('name', 'Alimento', 'text', { req: 1, wide: 1 }), F('portion', 'Porção', 'text', { ph: '100 g · 1 unidade · 1 prato' }),
  F('kcal', 'Calorias', 'num', { unit: 'kcal', req: 1 }), F('p', 'Proteína', 'num', { unit: 'g' }), F('c', 'Hidratos', 'num', { unit: 'g' }), F('f', 'Gordura', 'num', { unit: 'g' })
], defaults: () => ({ portion: '1 porção' }) };
const nowMeal = () => { const h = new Date().getHours(); return h < 11 ? 'Pequeno-almoço' : h < 15 ? 'Almoço' : h < 18.5 ? 'Lanche' : h < 22 ? 'Jantar' : 'Ceia'; };
S.meals = { label: 'Refeição', title: r => r.food || r.meal, fields: [
  F('date', 'Data', 'date', { req: 1 }), F('meal', 'Refeição', 'sel', { o: MEALS, req: 1 }),
  F('food', 'O que comeste', 'text', { req: 1, wide: 1, list: () => OS.all('foods').map(f => f.name) }), F('qty', 'Quantidade', 'num', { unit: 'porções', h: '1 = uma porção do alimento guardado' }),
  F('kcal', 'Calorias', 'num', { unit: 'kcal', h: 'Vazio = usa o alimento guardado' }), F('p', 'Proteína', 'num', { unit: 'g' }), F('c', 'Hidratos', 'num', { unit: 'g' }), F('f', 'Gordura', 'num', { unit: 'g' }),
  F('notes', 'Notas', 'area', { rows: 2 })
], defaults: () => ({ date: OS.ui.dietDay || U.today(), meal: nowMeal(), qty: 1 }),
  after: (r) => Diet.fill(r) };

/* ================= domínio ================= */
const Diet = OS.Diet = {};
const n = v => U.num(v) || 0;
Diet.food = name => OS.all('foods').find(f => f.name.trim().toLowerCase() === String(name || '').trim().toLowerCase());
// completa macros a partir da biblioteca e aprende alimentos novos
Diet.fill = r => { const fd = Diet.food(r.food), q = n(r.qty) || 1;
  if (fd && r.kcal === '' || fd && r.kcal == null) { OS.upd('meals', r.id, { kcal: Math.round(n(fd.kcal) * q), p: U.r1(n(fd.p) * q), c: U.r1(n(fd.c) * q), f: U.r1(n(fd.f) * q) }, { silent: true }); }
  else if (!fd && n(r.kcal)) OS.add('foods', { name: r.food.trim(), portion: '1 porção', kcal: Math.round(n(r.kcal) / q), p: U.r1(n(r.p) / q), c: U.r1(n(r.c) / q), f: U.r1(n(r.f) / q) }, { silent: true }); };
Diet.day = d => { const m = OS.all('meals').filter(x => x.date === d), o = OS.one('diet');
  return { m, n: m.length, kcal: U.sum(m, x => n(x.kcal)), p: U.sum(m, x => n(x.p)), c: U.sum(m, x => n(x.c)), f: U.sum(m, x => n(x.f)), water: n((o.waterLog || {})[d]) }; };
Diet.protOk = d => { const t = n(OS.one('diet').p); return t > 0 && Diet.day(d).p >= t * .9; };
Diet.kcalOk = d => { const t = n(OS.one('diet').kcal), k = Diet.day(d).kcal; return t > 0 && k >= t * .9 && k <= t * 1.1; };
Diet.streak = () => { let s = 0, d = U.today(); if (!Diet.day(d).n) d = U.addDays(d, -1); while (Diet.day(d).n && s < 999) { s++; d = U.addDays(d, -1); } return s; };
Diet.top = () => { const c = {}; OS.all('meals').slice(-300).forEach(m => { const k = (m.food || '').trim(); if (k) c[k] = (c[k] || 0) + 1; }); return Object.entries(c).sort((a, b) => b[1] - a[1]).map(x => x[0]); };
Diet.bmr = () => { const o = OS.one('diet'), w = n((U.sortBy(OS.all('body'), b => b.date).slice(-1)[0] || {}).weight), h = n(o.h), a = n(o.age); if (!w || !h || !a) return 0; return 10 * w + 6.25 * h - 5 * a + (o.sex === 'F' ? -161 : 5); };
Diet.suggest = () => { const o = OS.one('diet'), b = Diet.bmr(); if (!b) return null; const w = n((U.sortBy(OS.all('body'), x => x.date).slice(-1)[0] || {}).weight);
  const kcal = Math.round(b * n(o.act || 1.55) * ({ cut: .82, keep: 1, bulk: 1.1 })[o.goal || 'keep'] / 10) * 10, p = Math.round(w * (o.goal === 'cut' ? 2.2 : 2)), f = Math.round(w * .9), c = Math.max(0, Math.round((kcal - p * 4 - f * 9) / 4));
  return { kcal, p, c, f, w }; };

/* ================= vista ================= */
const day = () => OS.ui.dietDay && OS.ui.dietDay <= U.today() ? OS.ui.dietDay : U.today();
const mbar = (l, v, t, col, u = 'g') => `<div class="dt-m"><div class="dt-mh"><span>${l}</span><b class="mono">${U.nf(v, 0)}<small> / ${U.nf(t, 0)} ${u}</small></b></div><div class="pbar"><i style="width:${t ? Math.min(100, v / t * 100) : 0}%;background:${v > t * 1.1 && u === 'kcal' ? 'var(--neg,#F26D6D)' : col}"></i></div></div>`;
const T = {};
T.hoje = () => { const d = day(), x = Diet.day(d), o = OS.one('diet'), left = n(o.kcal) - x.kcal, cups = Math.ceil(n(o.water) / 250), got = Math.round(x.water / 250), top = Diet.top().slice(0, 8), meal = d === U.today() ? nowMeal() : 'Almoço';
  return `<div class="dt-day"><button class="icon-btn" data-act="dietDay" data-d="-1" aria-label="Dia anterior">${UI.ic('left')}</button><b>${d === U.today() ? 'Hoje' : d === U.addDays(U.today(), -1) ? 'Ontem' : U.fmtD(d)}</b><button class="icon-btn" data-act="dietDay" data-d="1" aria-label="Dia seguinte" ${d >= U.today() ? 'disabled' : ''}>${UI.ic('right')}</button></div>
  <section class="dt-sum"><div class="dt-k"><span class="mut">${left >= 0 ? 'Faltam' : 'Passaste'}</span><b class="mono">${U.nf(Math.abs(left), 0)}</b><span class="mut">kcal · ${U.nf(x.kcal, 0)} de ${U.nf(n(o.kcal), 0)}</span></div>
    <div class="dt-ms">${mbar('Calorias', x.kcal, n(o.kcal), 'var(--accent)', 'kcal')}${mbar('Proteína', x.p, n(o.p), '#5FB3E8')}${mbar('Hidratos', x.c, n(o.c), '#E8B75F')}${mbar('Gordura', x.f, n(o.f), '#C98AE0')}</div></section>
  <section class="dt-water"><div><b>${UI.ic('drop')}Água</b><span class="mut mono">${U.nf(x.water / 1000, 2)} / ${U.nf(n(o.water) / 1000, 1)} L</span></div><div class="dt-cups">${Array.from({ length: cups }, (_, i) => `<i class="${i < got ? 'on' : ''}"></i>`).join('')}</div><div class="dt-wb"><button class="btn ghost sm" data-act="dietWater" data-v="-250">−</button><button class="btn sm" data-act="dietWater" data-v="250">+ 250 ml</button><button class="btn ghost sm" data-act="dietWater" data-v="500">+ 500 ml</button></div></section>
  <section class="pn"><form class="dt-add" data-form="dietQuick" autocomplete="off"><select class="field" name="meal" aria-label="Refeição">${MEALS.map(m => `<option${m === meal ? ' selected' : ''}>${m}</option>`).join('')}</select><input class="field" name="food" list="dl_dfood" placeholder="O que comeste? (ex.: 3 ovos)" aria-label="Alimento" required><datalist id="dl_dfood">${OS.all('foods').map(f => `<option value="${esc(f.name)}">`).join('')}</datalist><input class="field" name="qty" type="number" step="any" inputmode="decimal" placeholder="porções" aria-label="Porções" value="1"><input class="field" name="kcal" type="number" step="any" inputmode="decimal" placeholder="kcal" aria-label="Calorias"><input class="field" name="p" type="number" step="any" inputmode="decimal" placeholder="prot g" aria-label="Proteína"><button class="btn pri">${UI.ic('plus')}<span>Registar</span></button></form>
    <small class="mut">Se o alimento já estiver guardado, as calorias e macros preenchem-se sozinhas. Se for novo, fica guardado para a próxima.</small>
    ${top.length ? `<div class="dt-quick">${top.map(t => `<button data-act="dietAgain" data-f="${esc(t)}" data-m="${meal}">+ ${esc(t)}</button>`).join('')}</div>` : ''}</section>
  ${MEALS.map(m => { const it = x.m.filter(r => r.meal === m); if (!it.length) return ''; return `<section class="dt-meal"><div class="dt-mt"><b>${m}</b><span class="mut mono">${U.nf(U.sum(it, r => n(r.kcal)), 0)} kcal · ${U.nf(U.sum(it, r => n(r.p)), 0)} g prot</span></div>${it.map(r => `<div class="li" data-edit="meals:${r.id}" style="cursor:pointer"><div class="li-t"><b>${esc(r.food)}${n(r.qty) && n(r.qty) !== 1 ? ` <span class="mut">× ${U.nf(r.qty, 1)}</span>` : ''}</b><small class="mono">P ${U.nf(n(r.p), 0)} · H ${U.nf(n(r.c), 0)} · G ${U.nf(n(r.f), 0)}</small></div><span class="mono">${U.nf(n(r.kcal), 0)}</span><button class="icon-btn" data-act="dietDel" data-id="${r.id}" aria-label="Apagar">${UI.ic('x')}</button></div>`).join('')}</section>`; }).join('') || UI.empty('Ainda nada registado neste dia.')}`; };
T.semana = () => { const days = U.lastN(14), o = OS.one('diet'), X = days.map(Diet.day), w7 = X.slice(-7), reg = w7.filter(x => x.n);
  const avg = k => reg.length ? U.sum(reg, x => x[k]) / reg.length : 0;
  return `<div class="kpis">${UI.kpi('Média kcal (7 dias)', reg.length ? U.nf(avg('kcal'), 0) : '—', 'meta ' + U.nf(n(o.kcal), 0))}${UI.kpi('Proteína média', reg.length ? U.nf(avg('p'), 0) + ' g' : '—', 'meta ' + n(o.p) + ' g')}${UI.kpi('Dias na meta de kcal', days.slice(-7).filter(Diet.kcalOk).length + '/7')}${UI.kpi('Dias com proteína', days.slice(-7).filter(Diet.protOk).length + '/7')}${UI.kpi('Sequência de registo', Diet.streak() + ' dias')}</div>
  <div class="pn"><div class="pn-h"><h3>Calorias por dia</h3></div>${C.mount({ type: 'bar', labels: days.map(d => U.fmtDS(d)), series: [{ name: 'kcal', data: X.map(x => x.kcal), color: 'var(--accent)' }], target: n(o.kcal) || null, targetLabel: 'meta', fmt: v => U.nf(v, 0), empty: 'Regista refeições para ver o gráfico.' }, 220)}</div>
  <div class="pn"><div class="pn-h"><h3>Proteína por dia (g)</h3></div>${C.mount({ type: 'bar', labels: days.map(d => U.fmtDS(d)), series: [{ name: 'g', data: X.map(x => Math.round(x.p)), color: '#5FB3E8' }], target: n(o.p) || null, targetLabel: 'meta', fmt: v => U.nf(v, 0), empty: 'Sem dados.' }, 200)}</div>`; };
T.alimentos = () => UI.table({ key: 'foods', coll: 'foods', rows: U.sortBy(OS.all('foods'), f => f.name.toLowerCase()), limit: 200, empty: 'Sem alimentos guardados. Ficam aqui sozinhos quando registas algo novo com calorias.', emptyAct: UI.addBtn('foods', 'Novo alimento', null, ''), cols: [
  { l: 'Alimento', v: f => `<b>${esc(f.name)}</b>`, s: f => f.name }, { l: 'Porção', v: f => esc(f.portion || '') }, { l: 'kcal', cls: 'r', v: f => `<span class="mono">${U.nf(n(f.kcal), 0)}</span>`, s: f => n(f.kcal) },
  { l: 'P', cls: 'r', v: f => `<span class="mono">${U.nf(n(f.p), 1)}</span>` }, { l: 'H', cls: 'r', v: f => `<span class="mono">${U.nf(n(f.c), 1)}</span>` }, { l: 'G', cls: 'r', v: f => `<span class="mono">${U.nf(n(f.f), 1)}</span>` }] });
T.metas = () => { const o = OS.one('diet'), sg = Diet.suggest(), num = (k, l, u) => `<div class="fld"><label for="dg_${k}">${l}</label><div class="inp-wrap"><input id="dg_${k}" type="number" step="any" inputmode="decimal" data-bind="diet.${k}" value="${esc(o[k] ?? '')}"><span>${u}</span></div></div>`;
  const sel = (k, l, opts) => `<div class="fld"><label for="dg_${k}">${l}</label><select id="dg_${k}" data-bind="diet.${k}">${opts.map(([v, t]) => `<option value="${v}"${String(o[k]) === v ? ' selected' : ''}>${t}</option>`).join('')}</select></div>`;
  return `<div class="g g2"><div class="pn"><div class="pn-h"><h3>Metas diárias</h3></div><div class="form-grid">${num('kcal', 'Calorias', 'kcal')}${num('p', 'Proteína', 'g')}${num('c', 'Hidratos', 'g')}${num('f', 'Gordura', 'g')}${num('water', 'Água', 'ml')}</div></div>
  <div class="pn"><div class="pn-h"><h3>Calcular a partir do corpo</h3></div><div class="form-grid">${num('h', 'Altura', 'cm')}${num('age', 'Idade', 'anos')}${sel('sex', 'Sexo', [['M', 'Masculino'], ['F', 'Feminino']])}${sel('act', 'Atividade', ACT)}${sel('goal', 'Objetivo', GOALS)}</div>
    ${sg ? `<p style="margin:14px 0 8px">Com ${U.nf(sg.w, 1)} kg: <b class="mono">${U.nf(sg.kcal, 0)} kcal</b> · P ${sg.p} g · H ${sg.c} g · G ${sg.f} g</p><button class="btn pri" data-act="dietApply">Usar estas metas</button>` : `<p class="mut" style="margin-top:12px">Preenche altura e idade, e regista o teu peso em Treino → Peso, para calcular.</p>`}</div></div>`; };
V.dieta = sub => UI.head('Dieta', '', `${UI.addBtn('meals', 'Refeição')}`, 'Corpo') + UI.tabs('dieta', [['', 'Hoje'], ['semana', 'Semana'], ['alimentos', 'Alimentos'], ['metas', 'Metas']], sub) + (T[sub] || T.hoje)();

/* ================= ações ================= */
A.dietDay = b => { const d = U.addDays(day(), +b.dataset.d); OS.setUI('dietDay', d > U.today() ? U.today() : d); };
A.dietWater = b => { const o = OS.one('diet'), d = day(); o.waterLog = o.waterLog || {}; o.waterLog[d] = Math.max(0, n(o.waterLog[d]) + +b.dataset.v); Object.keys(o.waterLog).forEach(k => { if (k < U.addDays(U.today(), -120)) delete o.waterLog[k]; }); OS.touch('diet'); };
A.dietDel = (b, e) => { e && e.stopPropagation && e.stopPropagation(); OS.del('meals', b.dataset.id); UI.toast('Apagado'); };
A.dietAgain = b => { const last = OS.all('meals').filter(m => m.food === b.dataset.f).slice(-1)[0]; if (!last) return; const r = OS.add('meals', { date: day(), meal: b.dataset.m, food: last.food, qty: last.qty || 1, kcal: last.kcal, p: last.p, c: last.c, f: last.f }); UI.toast(`${last.food} · ${b.dataset.m}`, 'pos'); return r; };
A.dietApply = () => { const s = Diet.suggest(); if (!s) return; OS.setOne('diet', { kcal: s.kcal, p: s.p, c: s.c, f: s.f }); UI.toast('Metas atualizadas', 'pos'); };
OS.forms = OS.forms || {};
OS.forms.dietQuick = (f, v) => { const food = v('food'); if (!food) return; const blank = v('kcal') === ''; const r = OS.add('meals', { date: day(), meal: f.elements.meal.value, food, qty: U.num(v('qty')) || 1, kcal: blank ? '' : U.num(v('kcal')), p: v('p') === '' ? '' : U.num(v('p')), c: '', f: '' }); Diet.fill(r);
  if (blank && !Diet.food(food)) UI.toast('Registado sem calorias. Edita para acrescentar, e o alimento fica guardado.', 'warn'); else UI.toast('Registado', 'pos'); };
})();

</script>
<script>
/* OCEANUM — Visão Geral: o painel inicial. Período (hoje, semana, mês) e cartões da vida inteira:
   dinheiro, agenda, tarefas, corpo, dieta, estudos e jogo. */
(() => {
'use strict';
const U = OS.U, UI = OS.UI, C = OS.C, V = OS.views, A = OS.act, esc = U.esc;
const Fin = OS.Fin, Cal = OS.Cal;
const safe = (f, d) => { try { return f(); } catch (e) { return d; } };
const greet = () => { const h = new Date().getHours(); return h < 6 ? 'Boa madrugada' : h < 13 ? 'Bom dia' : h < 20 ? 'Boa tarde' : 'Boa noite'; };
const range = () => { const per = OS.ui.dashPer || 'mes', t = U.today(), ym = OS.ui.dashYM || U.ym(t);
  if (per === 'hoje') return { per, a: t, b: t, label: 'Hoje', ym };
  if (per === 'semana') { const w = U.monday(t); return { per, a: w, b: U.addDays(w, 6), label: `${U.fmtDS(w)} – ${U.fmtDS(U.addDays(w, 6))}`, ym }; }
  const a = ym + '-01', b = U.addDays(U.addMonths(ym, 1) + '-01', -1); return { per, a, b, label: U.MES[+ym.slice(5, 7) - 1] + ' ' + ym.slice(0, 4), ym }; };
const card = (title, body, o = {}) => `<div class="dc ${o.cls || ''}" ${o.style ? `style="${o.style}"` : ''}><div class="dc-h"><h3>${title}</h3>${o.act || ''}</div>${body}</div>`;
const more = (href, l = 'Ver tudo') => `<a class="dc-more" href="#${href}">${l} ${UI.ic('right')}</a>`;

V.visao = () => {
  const R = range(), t = U.today(), p = OS.one('profile'), days = U.range(R.a, R.b > t ? (R.a > t ? R.a : t) : R.b);
  const tx = Fin.tx(R.a, R.b), inc = U.sum(tx.filter(x => x.type === 'Receita'), x => x.amount), exp = U.sum(tx.filter(x => x.type === 'Despesa'), x => x.amount), net = inc - exp;
  const cum = []; let acc = 0; days.forEach(d => { const dx = tx.filter(x => x.date === d); acc += U.sum(dx.filter(x => x.type === 'Receita'), x => x.amount) - U.sum(dx.filter(x => x.type === 'Despesa'), x => x.amount); cum.push(U.r2(acc)); });
  const cats = Fin.byCat(R.a, R.b), bank = safe(() => Fin.cashTotal(), 0), liq = safe(() => Fin.liquid(), 0), nw = safe(() => Fin.netWorth(), 0);
  const dIn = days.map(d => U.sum(tx.filter(x => x.date === d && x.type === 'Receita'), x => x.amount)), dOut = days.map(d => U.sum(tx.filter(x => x.date === d && x.type === 'Despesa'), x => x.amount));
  const cards = Fin.accounts().filter(a => a.type === 'Cartão de crédito').map(a => ({ l: a.name, v: U.sum(tx.filter(x => x.type === 'Despesa' && x.account === a.id), x => x.amount) })).filter(x => x.v > 0);
  const agenda = Cal.items(t, U.addDays(t, 2)).filter(x => x.src !== 'routine' && x.src !== 'task').slice(0, 5);
  const tasks = OS.Tasks.open().filter(x => (x.sched && x.sched <= t) || (x.due && x.due <= U.addDays(t, 1)) || x.status === 'Em curso').slice(0, 5), doneP = OS.all('tasks').filter(x => x.doneAt && x.doneAt >= R.a && x.doneAt <= R.b).length;
  const wk = OS.all('workouts').filter(w => w.date >= R.a && w.date <= R.b).length, km = OS.Run.kmIn(R.a, R.b), diet = safe(() => OS.Diet.day(t), { kcal: 0, p: 0 }), dg = OS.one('diet');
  const studyH = U.sum(OS.all('sessions').filter(s => s.date >= R.a && s.date <= R.b), s => s.minutes) / 60, habit = safe(() => OS.Hab.dayScore(t), 0);
  const dom = OS.one('dominus'), lvl = safe(() => OS.Dom.sumLv(), 0), rank = (OS.Dom.RANKS || [])[dom.rank || 0] || '';
  const per = [['hoje', 'Hoje'], ['semana', 'Semana'], ['mes', 'Mês']];
  return `<div class="dash">
  <div class="dash-top"><div><div class="eyebrow">${U.longDate(t)}</div><h1>${greet()}, ${esc(p.short || 'Ryan')}</h1></div>
    <div class="dash-ctl">${R.per === 'mes' ? `<div class="dash-month"><button class="icon-btn" data-act="dashYM" data-d="-1" aria-label="Mês anterior">${UI.ic('left')}</button><b>${R.label}</b><button class="icon-btn" data-act="dashYM" data-d="1" aria-label="Mês seguinte" ${R.ym >= U.ym(t) ? 'disabled' : ''}>${UI.ic('right')}</button></div>` : `<div class="dash-month"><b>${R.label}</b></div>`}
      <div class="dash-seg" role="group">${per.map(([k, l]) => `<button class="${R.per === k ? 'on' : ''}" data-act="dashPer" data-p="${k}">${l}</button>`).join('')}</div></div></div>
  <div class="dash-grid">
    ${card('Saldo do período', `<div class="dc-big ${net < 0 ? 'neg' : ''}">${U.eur(net)}</div><div class="dc-sub">receitas ${U.eur(inc, { dec: 0 })} · despesas ${U.eur(exp, { dec: 0 })}</div>${UI.spark(cum.length > 1 ? cum : [0, 0], '#7FE3F5', 300, 54)}`, { cls: 'hero h-abyss span4' })}
    ${card('Categorias', C.mount({ type: 'donut', data: cats.slice(0, 6), label: 'Gastos por categoria', centerSub: 'gastos', max: 5, empty: 'Sem despesas neste período.' }, 170), { cls: 'span4', act: more('financas', 'Finanças') })}
    ${card('Fluxo de caixa', `<div class="dc-mid ${acc < 0 ? 'neg' : ''}">${U.eur(acc)}</div>${C.mount({ type: 'line', labels: days.map(d => U.fmtDS(d)), series: [{ name: 'Saldo acumulado', data: cum, color: '#38BDF8' }], fmt: U.eurK, min0: false, empty: 'Sem movimentos.' }, 150)}`, { cls: 'span4' })}
    ${card('Saldo bancário total', `<div class="dc-big">${U.eur(bank)}</div><div class="dc-rows"><div><span>Disponível</span><b class="mono">${U.eur(liq, { dec: 0 })}</b></div><div><span>Patrimônio</span><b class="mono">${U.eur(nw, { dec: 0 })}</b></div></div><div class="dc-acts"><button class="btn sm" data-new="transactions" data-defs='{"type":"Receita"}'>${UI.ic('plus')}Receita</button><button class="btn sm" data-new="transactions" data-defs='{"type":"Despesa"}'>${UI.ic('plus')}Despesa</button></div>`, { cls: 'hero h-tide span4', act: more('financas.contas', 'Contas') })}
    ${card('Movimentação diária', C.mount({ type: 'bar', labels: days.map(d => U.fmtDS(d)), series: [{ name: 'Entradas', data: dIn, color: '#2DD4BF' }, { name: 'Saídas', data: dOut, color: '#3B82F6' }], fmt: U.eurK, empty: 'Sem movimentos neste período.' }, 190), { cls: 'span8' })}
    ${card('Agenda', agenda.length ? agenda.map(x => `<div class="dc-li" ${x.edit ? `data-edit="${x.edit}"` : ''}><span class="mono">${x.date === t ? (x.start || 'hoje') : U.fmtDS(x.date)}</span><b>${esc(x.title)}</b></div>`).join('') : '<p class="dc-empty">Agenda livre nos próximos dias.</p>', { cls: 'span4', act: more('calendario', 'Calendário') })}
    ${card('Tarefas', `<div class="dc-kp"><b class="mono">${OS.Tasks.open().length}</b><span>abertas</span><b class="mono">${doneP}</b><span>feitas no período</span></div>${tasks.map(x => `<div class="dc-li" data-edit="tasks:${x.id}"><input type="checkbox" class="cbx round" data-act="taskToggle" data-id="${x.id}" aria-label="Concluir ${esc(x.title)}"><b>${esc(x.title)}</b></div>`).join('') || '<p class="dc-empty">Nada para hoje.</p>'}`, { cls: 'span4', act: more('tarefas') })}
    ${card('Corpo', `<div class="dc-tiles"><a href="#treino"><b class="mono">${wk}</b><span>treinos</span></a><a href="#corrida"><b class="mono">${U.nf(km, 1)}</b><span>km</span></a><a href="#dieta"><b class="mono">${U.nf(diet.kcal, 0)}</b><span>kcal hoje</span></a><a href="#dieta"><b class="mono">${U.nf(diet.p, 0)}<small>/${U.num(dg.p) || '—'}</small></b><span>proteína</span></a></div>`, { cls: 'hero h-reef span4', act: more('treino', 'Treino') })}
    ${card('Estudos', `<div class="dc-big">${U.nf(studyH, 1)} h</div><div class="dc-sub">de estudo no período</div>`, { cls: 'span4', act: more('universidade') })}
    ${card('Hábitos de hoje', `<div class="dc-big">${Math.round(habit * 100)}%</div><div class="dc-bar"><i style="width:${Math.round(habit * 100)}%"></i></div><div class="dc-sub">inegociáveis cumpridos</div>`, { cls: 'span4', act: more('habitos') })}
    ${card('Dominus', `<div class="dc-big">Nível ${lvl}</div><div class="dc-sub">${esc(rank)}${dom.started ? '' : ' · ainda não começaste'}</div>`, { cls: 'hero h-deep span4', act: more('dominus', 'Jogar') })}
    ${cards.length ? card('Gastos por cartão', cards.map(c => `<div class="dc-li"><b>${esc(c.l)}</b><span class="mono">${U.eur(c.v)}</span></div>`).join(''), { cls: 'span4' }) : ''}
  </div></div>`;
};

/* ================= GASTO RÁPIDO: o "widget" do telemóvel ================= */
const topCats = () => { const c = {}; OS.all('transactions').filter(t => t.type === 'Despesa').slice(-200).forEach(t => { if (t.cat) c[t.cat] = (c[t.cat] || 0) + 1; }); const all = Object.keys(OS.one('fin').cats.Despesa || {}); return [...new Set(Object.entries(c).sort((a, b) => b[1] - a[1]).map(x => x[0]).concat(all))].slice(0, 10); };
const qs = () => OS.ui.qg || {};
V.gasto = sub => { const pre = U.num(String(sub || '').replace(',', '.')) || '', q = qs(), cats = topCats(), accs = Fin.accounts(), acc = q.acc || (OS.all('transactions').filter(t => t.type === 'Despesa').slice(-1)[0] || {}).account || (accs[0] || {}).id;
  const today = U.today(), spent = U.sum(Fin.tx(today, today, { type: 'Despesa' }), t => t.amount), last = OS.all('transactions').filter(t => t.type === 'Despesa').slice(-3).reverse(), start = U.ls.get('os2startGasto', false);
  return `<div class="qg"><div class="qg-h"><span class="eyebrow">Gasto rápido</span><span class="mut">hoje: ${U.eur(spent)}</span></div>
  <form class="qg-f" data-form="qgSave" autocomplete="off">
    <label class="qg-amt"><span>€</span><input name="amount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0,00" aria-label="Valor" value="${pre}" required autofocus></label>
    <input class="field qg-desc" name="desc" placeholder="O que compraste? (opcional)" list="qg_dl" aria-label="Descrição"><datalist id="qg_dl">${[...new Set(OS.all('transactions').map(t => t.desc).filter(Boolean))].slice(-40).map(d => `<option value="${esc(d)}">`).join('')}</datalist>
    <div class="qg-l">Categoria</div><div class="qg-chips">${cats.map((c, i) => `<label><input type="radio" name="cat" value="${esc(c)}" ${(q.cat ? q.cat === c : i === 0) ? 'checked' : ''}><span>${esc(c)}</span></label>`).join('')}</div>
    <div class="qg-l">Pago com</div><div class="qg-chips">${accs.map(a => `<label><input type="radio" name="acc" value="${a.id}" ${a.id === acc ? 'checked' : ''}><span>${esc(a.name)}</span></label>`).join('') || '<a class="btn sm" href="#financas.contas">Criar conta primeiro</a>'}</div>

    ${nextIdx.map(n => `<form class="dli" data-form="dLegacy" data-p="${lp}" data-n="${n}" style="align-items:flex-start"><span class="mono gold" style="width:34px;padding-top:3px">${n}</span><div class="t"><b>${esc(LEG[lp][n - 1])}</b><textarea class="field" name="proof" rows="2" style="margin-top:6px;width:100%;background:#0E0C09;border-color:var(--ln2);color:var(--dt)" placeholder="Prova: o que aconteceu, quando, onde está o registo." aria-label="Prova do marco ${n}"></textarea></div><button class="dbtn sm gold">Reclamar</button></form>`).join('')}
    <details style="margin-top:10px"><summary class="dm" style="cursor:pointer">Ver os 100 marcos de ${P[lp].n}</summary><div style="columns:2 260px;gap:24px;margin-top:10px">${LEG[lp].map((m, i) => `<div style="break-inside:avoid;padding:3px 0;font-size:15px;${done.includes(i + 1) ? 'color:var(--g2)' : 'color:var(--dm)'}"><span class="mono" style="font-size:11px">${i + 1}</span> ${done.includes(i + 1) ? '✓ ' : ''}${esc(m)}${s.proofs[lp + ':' + (i + 1)] ? `<div style="font-size:13px;font-style:italic">${esc(s.proofs[lp + ':' + (i + 1)])}</div>` : ''}</div>`).join('')}</div></details></div>
  <div class="dp"><h3>${ic('gift')}Recompensas reais<button class="dbtn sm" data-new="rewards">Nova recompensa</button></h3><div class="sub">Tu defines o prémio (um jantar, um livro, umas sapatilhas) e a condição no jogo. Quando a cumprires, podes resgatá-lo.</div>${rewards.length ? rewards.map(r => { const v = val(r), ok = r.cond === 'gold' ? v >= U.num(r.value) : v >= U.num(r.value), red = s.redeemed[r.id]; return `<div class="dli"><div class="t"><b>${esc(r.title)}</b><small>${esc(r.desc || '')} · ${{ rank: 'posto', level: 'nível do Soberano', bosses: 'chefes derrotados', ops: 'operações concluídas', legacy: 'marcos de legado', gold: 'custa Ouro' }[r.cond]} ${r.cond === 'rank' ? RANKS[U.num(r.value)] || r.value : r.value}${r.cond !== 'gold' ? ` · atual ${r.cond === 'rank' ? RANKS[v] : v}` : ''}</small></div>${red ? `<span class="tag done">resgatada ${U.fmtDS(red)}</span>` : `<button class="dbtn sm ${ok ? 'gold' : ''}" data-act="dRedeem" data-id="${r.id}" ${ok ? '' : 'disabled'}>${r.cond === 'gold' ? r.value + ' Ouro' : 'Resgatar'}</button>`}<button class="icon-btn" data-edit="rewards:${r.id}" aria-label="Editar">${ic('edit')}</button></div>`; }).join('') : '<div class="dm">Cria a primeira recompensa.</div>'}</div>
  <div class="dp"><h3>${ic('star')}Conquistas<span class="dm" style="font-family:var(--mono);font-size:12px">${Object.keys(s.ach).length}/${ACH.length}</span></h3><div class="ach">${ACH.map(([id, n, d, tier]) => `<div class="achc ${s.ach[id] ? 'on' : 'off'}"><span class="tag">${TIER[tier]}</span><b>${n}</b><small>${d}</small>${s.ach[id] ? `<small class="gold mono" style="font-size:11px">${U.fmtD(s.ach[id])}</small>` : ''}</div>`).join('')}</div></div>
  <div class="dp"><h3>${ic('book')}Leis do Dominus</h3><div style="font-size:16px;display:flex;flex-direction:column;gap:6px"><div>1 · O sistema não aceita auto-engano. Pontos sem prova não existem: só o que registas no Oceanum paga tributo.</div><div>2 · Consistência supera intensidade. Os tributos têm tetos diários; os dias perfeitos dão Determinação extra.</div><div>3 · Estagnação prolongada tem consequência: 7 dias sem um pilar na vida real, um território desse pilar revolta-se.</div><div>4 · Burnout é proibido. O jogo é de longo prazo: dias por recolher só contam até 7 dias atrás.</div><div>5 · Cada posto exige uma versão mais disciplinada. Os mais altos pedem marcos reais do teu Codex.</div></div></div>`; };

/* ================= AÇÕES ================= */
const R2 = () => { save(); OS.request(); };
A.dStart = () => { const s = S(); s.started = today(); D.ensureWorld(); s.seen = { int: today(), for: today(), cor: today(), inf: today() }; D.log('Assumiste o trono de uma ilha no nevoeiro.', 'gold'); R2(); setTimeout(() => D.ceremony({ t: 'Náufrago', s: 'Uma ilha. Uma capital. Nevoeiro.', x: 'Recolhe o primeiro tributo quando registares algo real.' }), 80); };
A.dTribute = () => { const p = D.collect(); if (!p) return; const parts = Object.entries(p.g).filter(([, v]) => v).map(([k, v]) => `${v > 0 ? '+' : ''}${v} ${RES[k][0]}`); const xps = PK.filter(k => p.xp[k]).map(k => `+${p.xp[k]} XP ${P[k].n}`);
  UI.modal(`<div class="dom" style="margin:0;padding:18px;min-height:0;border-radius:14px"><div class="cz" style="font-size:11px;letter-spacing:.2em;color:var(--g)">TRIBUTO RECOLHIDO</div><h2 style="margin:4px 0 12px;color:var(--g2)">${parts.join(' · ') || 'Sem recursos novos'}</h2><div class="dm" style="font-size:15px">${xps.join(' · ')}${p.en ? ` · +${p.en} Determinação` : ''}</div><div style="margin-top:12px;display:flex;flex-direction:column;gap:4px">${p.days.map(d => `<div style="font-size:15px"><span class="mono dm" style="font-size:12px">${U.fmtDS(d.d)}</span> · ${esc(d.why.join(', ') || 'regeneração')}</div>`).join('')}</div>${S().ev.pending ? '<p class="gold" style="margin:12px 0 0">Um evento aguarda a tua decisão no Império.</p>' : ''}<div style="margin-top:14px;text-align:right"><button class="dbtn gold" data-mclose>Continuar</button></div></div>`);
  document.querySelectorAll('#modal [data-mclose]').forEach(b => b.onclick = UI.closeModal); OS.request(); };
A.dTile = b => OS.setUI('domTile', b.dataset.k);
A.dConquer = b => D.battleStart(b.dataset.k);
A.dQuell = b => { const s = S(), t = s.tiles[b.dataset.k]; if (!t) return; if (!s.sk.inf4 && !D.pay({ energy: 1, prest: 5 })) { UI.toast('Precisas de 1 Determinação e 5 Prestígio', 'warn'); return; } delete t.rev; D.log(`Revolta reprimida em ${TM[b.dataset.k].name}.`, 'gold'); R2(); };
A.dEvent = b => { D.resolve(+b.dataset.i); OS.request(); };
A.dClaimD = b => { const s = S(), m = DT.find(x => x.id === b.dataset.id); if (!m || s.dm.claimed.includes(m.id)) return; const [c, t] = m.f(today()); if (c < t) return; s.dm.claimed.push(m.id); s.dmDone = (s.dmDone || 0) + 1; D.sp(10); const r = D.decree() && D.decree().id === 'austeridade' && m.r.ouro ? Object.assign({}, m.r, { ouro: m.r.ouro * 2 }) : m.r; D.give(r, 'Missão: ' + m.t); R2(); };
A.dClaimW = b => { const s = S(), m = WT.find(x => x.id === b.dataset.id); if (!m || s.wm.claimed.includes(m.id)) return; const w = U.monday(today()); const [c, t] = m.f(w); if (c < t) return; s.wm.claimed.push(m.id); D.give(REW(m.p), 'Missão semanal'); D.sp(30); if (s.wm.claimed.length >= 4 && !s.wm.bonus) { s.wm.bonus = true; D.give({ pa: 1 + (s.sk.int4 ? 1 : 0) }, 'Semana completa'); } R2(); };
A.dPM = b => { const s = S(), pm = PM.find(x => x[0] === b.dataset.id); const c = s.pm[pm[0]] || 0; if (!pm[2][c] || !pm[2][c][1](s)) return; s.pm[pm[0]] = c + 1; D.give(PMR[c], pm[1] + ' · etapa ' + (c + 1)); R2(); };
A.dDecree = b => { const s = S(); s.decree = { month: U.ym(today()), id: b.dataset.id, claimed: false }; D.log(`Decreto de ${U.fmtYML(U.ym(today()))}: ${DECREES[b.dataset.id].n}.`, 'gold'); R2(); };
A.dClaimS = () => { const s = S(), d = D.decree(); if (!d || s.decree.claimed) return; const [, f, tg] = d.mis; if (f() < tg) return; s.decree.claimed = true; D.give({ ouro: 250, pa: 2, secret: 60 }, 'Missão estratégica'); D.sp(80); R2(); };
A.dEpic = b => { const s = S(), g = OS.get('goals', b.dataset.id); if (!g || s.epic[g.id] || OS.Goal.info(g).p < 1) return; s.epic[g.id] = today(); D.sp(120); D.give({ ouro: 300, pa: 2, legado: 1, secret: 80, relic: 'random' }, 'Missão épica: ' + g.title); D.pendingCeremony = { t: 'Missão épica', s: g.title, x: '+300 Ouro · +2 Ascensão · +1 Legado · relíquia' }; R2(); };
A.dSummon = b => { const o = D.suggest()[+b.dataset.i]; if (o) D.summon(o); OS.request(); };
A.dAttack = b => { const dmg = D.attack(b.dataset.id, !!b.dataset.h); if (dmg) { const el = document.getElementById('bs_' + b.dataset.id); if (el) { el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit'); el.insertAdjacentHTML('beforeend', `<span class="dmg">−${dmg}</span>`); } setTimeout(() => { D.bossTick(); OS.request(); }, 650); } else if (dmg === 0 && S().bosses.find(x => x.id === b.dataset.id && (x.game || 0) >= Math.round(x.max * .4))) UI.toast('O jogo já fez o que podia: o resto do dano vem da vida real', 'warn'); };
A.dCheck = b => { const x = S().bosses.find(z => z.id === b.dataset.id); if (!x || (x.checks || []).includes(today())) return; x.checks = (x.checks || []).concat(today()); x.log = [`${U.fmtDS(today())} · progresso real registado: ${Math.round(x.max * .12)} de dano`].concat(x.log || []); D.bossTick(); R2(); };
A.dOpStart = b => { const n = +b.dataset.n; UI.ask(n === 40 ? 'Entrar na Caverna 40?' : `Iniciar operação de ${n} dias?`, 'Oito diretivas por dia. Menos de 75% num dia custa uma vida. Dias não registados contam como perdidos.', 'Iniciar', () => { D.opStart(n, n === 40 ? 'caverna' : 'elite'); OS.request(); }, 'pri'); };
A.dAbort = () => UI.ask('Abandonar a operação?', 'Conta como derrota: perdes 30% do Ouro e esperas 7 dias.', 'Abandonar', () => { const o = D.op(); if (o) { o.lives = 0; D.opTick(); R2(); } });
A.dBuild = b => { const s = S(), id = b.dataset.id, nx = (s.b[id] || 0) + 1, c = D.bCost(id, nx); if (!D.bReq(id, nx).every(r => r[1]) || !D.pay(c)) return; s.b[id] = nx; D.dayC().build++; D.log(`${BL[id][1]} ${nx > 1 ? 'melhorada para o nível ' + nx : 'construída'}.`, 'gold'); UI.toast(BL[id][1] + ' nível ' + nx, 'pos'); R2(); };
A.dSkill = b => { const s = S(); const c = +b.dataset.c; if ((s.res.pa || 0) < c) return; s.res.pa -= c; s.sk[b.dataset.id] = today(); const n = PK.flatMap(p => SK[p]).find(x => x[0] === b.dataset.id); D.log(`Talento aprendido: ${n[1]}.`, 'gold'); R2(); };
A.dEquip = b => { const s = S(), id = b.dataset.id; if (s.eq.includes(id)) s.eq = s.eq.filter(x => x !== id); else if (s.eq.length < D.slots()) s.eq.push(id); R2(); };
A.dBuy = b => { const s = S(), p = +b.dataset.p; if (s.res.ouro < p) return; s.res.ouro -= p; D.grantRelic(b.dataset.id); R2(); };
A.dRation = () => { const s = S(); if (s.res.ouro < 40 || D.dayC().ration) return; s.res.ouro -= 40; D.dayC().ration = 1; s.energy = Math.min(D.eMax(), s.energy + 2); R2(); };
A.dMap = () => { const s = S(); if (s.res.ouro < 60) return; s.res.ouro -= 60; D.reveal(4); D.log('Mapa comprado: 4 territórios revelados.', 'gold'); R2(); };
A.dAscend = () => { const s = S(); if (!D.canAscend()) return; s.rank++; D.log(`Ascensão: ${RANKS[s.rank]}.`, 'gold'); save(); D.ceremony({ t: RANKS[s.rank], s: 'Ascensão', x: UNLOCKS[s.rank] }); OS.request(); };
A.dLeg = b => OS.setUI('domLeg', b.dataset.p);
A.dRedeem = b => { const s = S(), r = OS.get('rewards', b.dataset.id); if (!r || s.redeemed[r.id]) return; if (r.cond === 'gold') { if (s.res.ouro < U.num(r.value)) return; s.res.ouro -= U.num(r.value); } s.redeemed[r.id] = today(); D.log(`Recompensa real resgatada: ${r.title}.`, 'gold'); save(); D.ceremony({ t: 'Recompensa', s: r.title, x: 'Ganhaste-a. Aproveita sem culpa.' }); OS.request(); };
OS.forms = OS.forms || {};
OS.forms.dCustom = (f, v) => { const n = v('n'), d = f.elements.d.value; if (!n || !d) return; D.summon({ kind: 'custom', ref: U.uid(), name: n, due: d, max: 300, pillar: f.elements.p.value }); };
OS.forms.dTrade = f => { const s = S(), a = f.elements.a.value, b = f.elements.b.value, rate = (s.b.porto || 0) >= 2 ? 2 : 3; if (a === b) return; if ((s.res[a] || 0) < rate * 10) { UI.toast('Recursos insuficientes', 'warn'); return; } s.res[a] -= rate * 10; s.res[b] = (s.res[b] || 0) + 10; save(); };
OS.forms.dLegacy = (f, v) => { const s = S(), p = f.dataset.p, n = +f.dataset.n, proof = v('proof'); if (proof.length < 12) { UI.toast('Escreve a prova (pelo menos uma frase). Pontos sem prova não existem.', 'warn'); return; } s.legacy[p] = (s.legacy[p] || []).concat(n); s.proofs[p + ':' + n] = proof; D.sp(100); D.give({ legado: 1 + (s.sk.inf5 ? 1 : 0), pa: 1, ouro: 100, secret: 60 }, `Marco de legado ${P[p].n} ${n}`); save(); D.ceremony({ t: 'Marco de legado', s: LEG[p][n - 1], x: '+1 Legado · +1 Ascensão · +100 Ouro' }); };
document.addEventListener('change', e => { const el = e.target.closest('[data-opk]'); if (!el) return; const o = D.op(); if (!o) return; o.log = o.log || {}; o.log[today()] = Object.assign({}, o.log[today()] || {}, { [el.dataset.opk]: el.checked }); R2(); });
D.ceremony = c => { const el = document.createElement('div'); el.className = 'ceremony'; el.innerHTML = `<div class="in"><div class="ring">${sigil(c.t, c.bad ? '#E07A6C' : '#E8D3A8', 90)}</div><h1 style="${c.bad ? 'color:#E07A6C' : ''}">${esc(c.t)}</h1><p style="font-style:italic">${esc(c.s || '')}</p><p class="dm" style="color:#9A8F7A">${esc(c.x || '')}</p><button class="dbtn gold">Continuar</button></div>`; document.body.appendChild(el); el.querySelector('button').onclick = () => el.remove(); el.addEventListener('click', e => { if (e.target === el) el.remove(); }); setTimeout(() => el.querySelector('button').focus(), 50); };
Object.assign(D, { P, PK, RES, BL, DT, WT, RIV, RANKS, has, LORE, SECRET, T, TABS, RL, LEG, sigil, legacyCount });
})();

</script>
<script>
/* OCEANUM · DOMINUS · PERSONAGEM
   Sem monstros, sem combate. O jogo é só a tua ficha: atributos, nível, classe e título.
   Tudo sobe apenas com o que fazes na vida real (registado no Oceanum) e com os marcos que provas. */
(() => {
'use strict';
const U = OS.U, UI = OS.UI, esc = U.esc, A = OS.act, V = OS.views, D = OS.Dom;
const S = () => OS.one('dominus'), save = () => OS.touch('dominus'), today = () => U.today();
const PK = D.PK, P = D.P, RANKS = D.RANKS, LEG = D.LEG;
const ic = (n, c = '') => UI.ic(n, c);
const safe = (f, d = 0) => { try { return f(); } catch (e) { return d; } };
const COL = { int: '#6F8FC4', for: '#C9A25E', cor: '#C0584A', inf: '#9A78C4' };

/* ================= ATRIBUTOS (vêm do histórico real, nunca se compram) ================= */
const sc = (raw, cap) => Math.round(99 * Math.sqrt(Math.min(Math.max(raw, 0), cap) / cap));
const stats = () => {
  const all = k => safe(() => OS.all(k), []);
  const studyH = U.sum(all('sessions'), s => s.minutes) / 60;
  const reviews = all('reviews').reduce((a, r) => a + [r.r1At, r.r2At, r.r3At].filter(Boolean).length, 0);
  const notes = all('notes').length;
  const wk = all('workouts').length, km = U.sum(all('runs'), r => U.num(r.km));
  const streak = safe(() => OS.Hab.perfectStreak()), s = S(); s.bestStreak = Math.max(s.bestStreak || 0, streak);
  const txs = all('transactions');
  const saved = U.sum(txs.filter(t => t.type === 'Transferência' && OS.Fin.isInvestAcc(t.toAccount) && !OS.Fin.isInvestAcc(t.account)), t => t.amount) + U.sum(all('invtx').filter(t => t.type === 'Compra'), t => U.num(t.qty) * U.num(t.price));
  const byDay = {}; txs.forEach(t => { const x = byDay[t.date] || (byDay[t.date] = { n: 0, sup: 0 }); x.n++; if (t.type === 'Despesa' && t.ess === 'Supérfluo') x.sup = 1; });
  const prud = U.lastN(60).filter(d => byDay[d] && !byDay[d].sup).length;
  const vis = Array.from({ length: 12 }, (_, i) => U.addMonths(U.ym(today()), -i - 1)).filter(m => safe(() => { const f = OS.Fin.month(m); return f.n && f.net > 0; }, false)).length;
  const contacts = all('contacts').length, apps = all('applications').filter(a => a.status !== 'Por enviar').length;
  const lead = all('mvclients').length + all('tasks').filter(t => t.doneAt && (['Profissional', 'Empresarial'].includes((OS.get('projects', t.project) || {}).type) || ['Carreira', 'Trabalho', 'Mova'].includes(t.area))).length;
  return {
    int: [['Foco', sc(studyH, 1000), `${U.nf(studyH, 0)} h de estudo`], ['Memória', sc(reviews, 1500), `${reviews} revisões`], ['Conhecimento', sc(notes, 500), `${notes} notas`]],
    cor: [['Força', sc(wk, 500), `${wk} treinos`], ['Resistência', sc(km, 2000), `${U.nf(km, 0)} km corridos`], ['Disciplina', sc(s.bestStreak, 365), `melhor sequência: ${s.bestStreak} dias`]],
    for: [['Riqueza', sc(saved, 50000), `${U.eur(saved, { dec: 0 })} poupados/investidos`], ['Prudência', sc(prud, 60), `${prud}/60 dias limpos`], ['Visão', sc(vis, 12), `${vis}/12 meses com superávit`]],
    inf: [['Carisma', sc(contacts, 300), `${contacts} pessoas na rede`], ['Alcance', sc(apps, 100), `${apps} candidaturas`], ['Liderança', sc(lead, 300), `${lead} entregas profissionais`]],
    raw: { studyH, reviews, notes, wk, km, streak: s.bestStreak, saved, prud, vis, contacts, apps, lead } };
};

/* ================= CLASSE (nasce do teu equilíbrio real) ================= */
const PURE = { int: ['Aprendiz', 'Estudioso', 'Sábio', 'Arquimago'], cor: ['Lutador', 'Guerreiro', 'Gladiador', 'Titã'], for: ['Poupador', 'Mercador', 'Banqueiro', 'Rei Midas'], inf: ['Mensageiro', 'Diplomata', 'Líder', 'Imperador'] };
const HYB = { 'cor|int': ['Noviço', 'Monge', 'Asceta', 'Iluminado'], 'for|int': ['Calculista', 'Estratega', 'Visionário', 'Oráculo'], 'inf|int': ['Orador', 'Filósofo', 'Conselheiro', 'Profeta'], 'cor|for': ['Caçador', 'Mercenário', 'Conquistador', 'Senhor da Guerra'], 'cor|inf': ['Escudeiro', 'Cavaleiro', 'Comandante', 'Herói'], 'for|inf': ['Negociante', 'Embaixador', 'Mecenas', 'Príncipe Mercador'] };
const BAL = ['Andarilho', 'Polímata', 'Renascentista', 'Arconte'];
const FAM_TX = { int: 'A mente manda. Estudas mais do que tudo o resto.', cor: 'O corpo manda. Treino e resistência acima de tudo.', for: 'O dinheiro manda. Registas, poupas e investes.', inf: 'As pessoas mandam. Rede, candidaturas, liderança.', bal: 'Nenhum pilar domina: estás a crescer em tudo por igual.' };
const TIER_AT = [4, 14, 34, 64], ROM = ['I', 'II', 'III', 'IV'];
const klass = () => {
  const L = D.sumLv(), lv = PK.map(p => [p, D.lv(p)]).sort((a, b) => b[1] - a[1]);
  if (L < TIER_AT[0]) return { id: 'aspirante', n: 'Aspirante', fam: null, names: null, tier: -1, tx: 'Ainda sem classe. Os primeiros níveis revelam quem és.', col: '#C9A25E' };
  const tier = TIER_AT.filter(t => L >= t).length - 1;
  let fam, names, col, tx;
  if (lv[0][1] - lv[3][1] <= 2 && L >= 8) { fam = 'bal'; names = BAL; col = '#E8D3A8'; tx = FAM_TX.bal; }
  else if (lv[0][1] - lv[1][1] <= 1 && lv[1][1] - lv[2][1] >= 2) { fam = [lv[0][0], lv[1][0]].sort().join('|'); names = HYB[fam]; col = `color-mix(in srgb,${COL[lv[0][0]]} 50%,${COL[lv[1][0]]})`; tx = `Dois pilares à frente, lado a lado: ${P[lv[0][0]].n} e ${P[lv[1][0]].n}.`; }
  else { fam = lv[0][0]; names = PURE[fam]; col = COL[fam]; tx = FAM_TX[fam]; }
  return { id: fam + ':' + tier, n: names[tier], fam, names, tier, tx, col };
};

/* ================= TÍTULOS (só vida real) ================= */
const legN = () => D.legacyCount(), achN = () => Object.keys(S().cach || {}).length, minLv = () => Math.min(...PK.map(D.lv));
D.reqs = r => { const L = D.sumLv(), s = S(), best = s.bestStreak || 0;
  return ({ 1: [['Nível total 4', L >= 4]],
    2: [['Nível total 10', L >= 10], ['1 marco do Codex provado', legN() >= 1]],
    3: [['Nível total 18', L >= 18], ['Todos os pilares no nível 2', minLv() >= 2], ['3 conquistas', achN() >= 3], ['5 favos na colmeia', favN() >= 5]],
    4: [['Nível total 28', L >= 28], ['3 marcos do Codex', legN() >= 3], ['7 dias perfeitos seguidos (alguma vez)', best >= 7]],
    5: [['Nível total 40', L >= 40], ['Todos os pilares no nível 6', minLv() >= 6], ['6 marcos do Codex', legN() >= 6], ['15 favos na colmeia', favN() >= 15]],
    6: [['Nível total 55', L >= 55], ['10 marcos do Codex', legN() >= 10], ['10 conquistas', achN() >= 10]],
    7: [['Nível total 75', L >= 75], ['35 favos na colmeia', favN() >= 35], ['Todos os pilares no nível 12', minLv() >= 12], ['16 marcos do Codex', legN() >= 16], ['30 dias perfeitos seguidos', best >= 30]],

  PK.forEach(p => { const l = D.lv(p); while (l > s.cLv[p]) { s.cLv[p]++; const L2 = D.sumLv(), fav = autoHex(p), o = offer(L2 % 5 === 0 ? 2 : 1, `${P[p].n} nível ${s.cLv[p]}`);
    clog(`${P[p].n} subiu para o nível ${s.cLv[p]}.${fav ? ' Favo: ' + fav + '.' : ' +1 Mel.'}`, p);
    queue.push({ k: 'Subiste de nível', t: `${P[p].n} ${s.cLv[p]}`, s: LVMSG[(s.cLv[p] + p.length) % LVMSG.length], col: COL[p], rw: [fav ? `Favo conquistado: ${fav}` : '+1 Mel', `Nível total ${L2}`], choice: o && o.id }); } });
  const k = klass(); if (s.cls !== k.id) { if (s.cls) { const o = offer(2, 'Nova classe'); clog(`Classe: ${k.n}${k.tier >= 0 ? ' ' + ROM[k.tier] : ''}.`, 'gold'); queue.push({ k: 'Nova classe', t: k.n + ' ' + ROM[Math.max(0, k.tier)], s: k.tx, col: k.col, rw: [], choice: o && o.id }); } s.cls = k.id; }
  if (JSON.stringify([s.xp, s.cach, s.cLv, s.cls, s.bestStreak, s.hive, s.chDone, s.rwv2]) !== before) save();
  flush();
};

/* ================= CELEBRAÇÃO ================= */
let showing = false;
const flush = () => { if (showing || !queue.length) return; showing = true; setTimeout(() => celebrate(queue.shift()), 120); };
const confetti = (cv, col) => { const x = cv.getContext('2d'), W = cv.width = innerWidth, H = cv.height = innerHeight, cs = ['#E8D3A8', '#C9A25E', col || '#fff', '#fff', '#6F8FC4', '#C0584A', '#9A78C4'];
  const ps = Array.from({ length: 160 }, () => ({ x: W / 2, y: H * .42, vx: (Math.random() - .5) * 16, vy: -Math.random() * 15 - 4, r: Math.random() * 6 + 3, a: Math.random() * 6, va: (Math.random() - .5) * .3, c: cs[Math.floor(Math.random() * cs.length)] }));
  let t = 0; const step = () => { if (!cv.isConnected || t++ > 260) return; x.clearRect(0, 0, W, H); ps.forEach(p => { p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.globalAlpha = Math.max(0, 1 - t / 260); x.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); x.restore(); }); requestAnimationFrame(step); }; step(); };
const celebrate = c => { const el = document.createElement('div'); el.className = 'ceremony ch-cel'; el.style.setProperty('--kc', c.col || '#E8D3A8');
  const o = c.choice && rw().pend.find(x => x.id === c.choice);
  const body = () => `<canvas></canvas><div class="in"><div class="cz ch-cel-k">${esc(c.k || '')}</div><div class="ring">${D.sigil(c.t, '#E8D3A8', 90)}</div><div class="ch-cel-p cz">Parabéns</div><h1>${esc(c.t)}</h1><p style="font-style:italic">${esc(c.s || '')}</p>${(c.rw || []).length ? `<div class="ch-cel-rw">${c.rw.map(r => `<span>${esc(r)}</span>`).join('')}</div>` : ''}
    ${o ? `<div class="ch-cel-ch"><div class="cz">Recompensa ${TIERN[o.tier].toLowerCase()} · escolhe uma</div><div class="ch-opts">${o.opts.map(pid => optCard(o, pid)).join('')}</div><button class="ch-later" data-later>Escolher depois</button></div>` : `<button class="dbtn gold" data-close>${queue.length ? 'Continuar' : 'Obrigado'}</button>`}</div>`;
  el.innerHTML = body(); document.body.appendChild(el); try { if (!matchMedia('(prefers-reduced-motion: reduce)').matches) confetti(el.querySelector('canvas'), c.col); } catch (e) { } try { navigator.vibrate && navigator.vibrate([40, 60, 80]); } catch (e) { }
  const close = () => { el.remove(); showing = false; OS.request(); flush(); };
  el.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) { if (e.target === el && !o) close(); return; } e.stopPropagation(); e.preventDefault();
    if (b.dataset.act === 'rwChoose') { choose(b.dataset.o, b.dataset.p); const it = rw().pool.find(x => x.id === b.dataset.p); UI.toast(`Boa escolha: ${it ? it.t : ''}. Está em Recompensas.`, 'pos'); close(); }
    else if (b.dataset.act === 'rwNo') { reroll(b.dataset.o, b.dataset.p); const oo = rw().pend.find(x => x.id === c.choice); el.querySelector('.ch-opts').innerHTML = oo ? oo.opts.map(pid => optCard(oo, pid)).join('') : ''; }
    else if ('later' in b.dataset || 'close' in b.dataset) close(); }, true);
  setTimeout(() => { const f = el.querySelector('.ch-optb,[data-close]'); f && f.focus(); }, 50); };
D.ceremony = c => { queue.push({ k: c.s, t: c.t, s: c.x, rw: c.rw || [], col: c.col }); flush(); };
D.celebrate = c => { queue.push(c); flush(); };

const TABS = [['', 'Personagem'], ['desafios', 'Desafios'], ['colmeia', 'Colmeia'], ['recompensas', 'Recompensas'], ['titulos', 'Títulos'], ['conquistas', 'Conquistas'], ['cronica', 'Crónica']];

T.personagem = st => { const s = S(), k = klass(), L = D.sumLv(), name = (OS.one('profile').short || 'Ryan'), r = s.rank, nx = r < 8 ? D.reqs(r + 1) : [], done = nx.filter(x => x[1]).length, fx = hiveFx();

      <div class="ch-meta"><span><b class="mono">${L}</b> nível</span><span><b class="mono">${power}</b> poder</span><a href="#dominus.colmeia"><b class="mono">${favN()}</b> favos</a><a href="#dominus.colmeia"><b class="mono gold">${hive().mel}</b> mel</a>${pend ? `<a href="#dominus.recompensas"><b class="mono gold">${pend}</b> recompensa${pend > 1 ? 's' : ''} por escolher</a>` : ''}</div></div>

    <div class="ch-sub">${st[p].map(([n, v, raw], i) => `<div><span>${n}</span><b class="mono">${v + fx.st[p][i]}${fx.st[p][i] ? `<sup>+${fx.st[p][i]}</sup>` : ''}</b><small>${esc(raw)}</small></div>`).join('')}</div></div>`; }).join('')}</section>
  <section class="ch-cls"><div><div class="cz">Classe</div><p>${esc(k.tx)}</p><small class="dm">A classe muda sozinha conforme o pilar (ou pilares) que mais sobes. Evolui de grau com o nível total: ${TIER_AT.join(' · ')}.</small></div>
    ${k.names ? `<div class="ch-path">${k.names.map((n, i) => `<span class="${i < k.tier ? 'done' : i === k.tier ? 'cur' : ''}"><small>${ROM[i]}</small>${esc(n)}</span>`).join('')}</div>` : ''}</section>`; };

  const hist = U.lastN(7).slice().reverse().slice(1).map(d => { const n = Object.keys(s.chDone || {}).filter(k => k.startsWith('d:' + d + ':') && !k.endsWith(':all')).length; return `<div class="ch-hd"><span class="mono dm">${U.fmtDS(d)}</span><span>${'●'.repeat(n)}${'○'.repeat(Math.max(0, 3 - n))}</span></div>`; }).join('');

T.colmeia = () => { const hv = hive(), o = hv.own, sel = HX[OS.ui.hexSel] || null, R = 26, W = SQ3 * R * (2 * HR + 1) + 16, H = R * (3 * HR + 2) + 16;
  const pts = (x, y, r) => Array.from({ length: 6 }, (_, i) => { const a = Math.PI / 180 * (60 * i - 30); return (x + r * Math.cos(a)).toFixed(1) + ',' + (y + r * Math.sin(a)).toFixed(1); }).join(' ');
  const glyph = (h, x, y, c) => h.t === 'key' ? `<path d="M${x - 7} ${y + 4}l2-8 5 5 0-7 0 7 5-5 2 8z" fill="${c}"/>` : h.t === 'not' ? `<path d="M${x} ${y - 6}l6 6-6 6-6-6z" fill="${c}"/>` : h.t === 'med' ? `<circle cx="${x}" cy="${y}" r="4.5" fill="none" stroke="${c}" stroke-width="1.6"/>` : `<circle cx="${x}" cy="${y}" r="2.4" fill="${c}"/>`;
  const svg = HEXES.map(h => { const x = h.x * R + W / 2, y = h.y * R + H / 2, own = !!o[h.k], can = canTake(h), c = h.ring ? COL[h.p] : '#E8D3A8', aff = h.ring && hv.mel >= COST[h.t];

  <section class="ch-hv"><svg viewBox="0 0 ${W.toFixed(0)} ${H.toFixed(0)}" class="hive" role="group" aria-label="Colmeia de atributos">${svg}<text x="${W / 2}" y="14" text-anchor="middle" class="hvl" style="fill:${COL.int}">INTELECTO</text><text x="${W / 2}" y="${H - 4}" text-anchor="middle" class="hvl" style="fill:${COL.cor}">CORPO</text><text x="${W - 4}" y="${H / 2 - R * 1.9}" text-anchor="end" class="hvl" style="fill:${COL.for}">FORTUNA</text><text x="4" y="${H / 2 - R * 1.9}" class="hvl" style="fill:${COL.inf}">INFLUÊNCIA</text></svg>
    <div class="ch-hvp">${sel ? `<div class="cz" style="color:${sel.ring ? COL[sel.p] : 'var(--g)'}">${sel.ring ? P[sel.p].n + ' · ' + { sml: 'favo', med: 'favo raro', not: 'favo notável', key: 'favo-mestre' }[sel.t] : 'centro'}</div><h2>${esc(hexName(sel))}</h2><p>${esc(hexFx(sel))}</p>

      <div class="ch-hvfx">${PK.map(p => `<div style="--pc:${COL[p]}"><span>${P[p].n}</span><b class="mono">+${fx.xp[p]}% XP</b><small class="dm">${SUBN[p].map((n, i) => fx.st[p][i] ? `${n} +${fx.st[p][i]}` : '').filter(Boolean).join(' · ') || '—'}</small></div>`).join('')}</div></div></section>`; };

V.dominus = sub => { const s = S();
  if (!s.started) return `<div class="dom ch"><section class="ch-start"><div class="cz" style="color:var(--g);letter-spacing:.3em;font-size:12px">OCEANUM · O JOGO</div><h1>DOMINUS</h1>

<script>
/* OCEANUM — Caixa de entrada de gastos (atalho do iPhone).

(() => {
'use strict';

const IB = OS.Inbox = {};
const cfg = () => OS.one('inbox');
const SEEN = 'os2inboxSeen';
const genKey = () => Array.from(crypto.getRandomValues(new Uint8Array(18)), b => 'abcdefghijkmnpqrstuvwxyz23456789'[b % 32]).join('');

IB.script = key => `// Oceanum · caixa de entrada de gastos. Não partilhes este código: a chave abaixo é a tua.
const KEY = '${key}';
function doGet(e) {
  const p = e.parameter || {};

  const sh = SpreadsheetApp.getActiveSpreadsheet().getSheets()[0];
  if (sh.getLastRow() === 0) sh.appendRow(['id', 'data', 'valor', 'descricao', 'categoria', 'importado']);

  }
  const v = Number(String(p.v || '').replace(/[^0-9,.-]/g, '').replace(',', '.'));
  if (!(v > 0)) return out({ ok: false, msg: 'Valor inválido' });
  sh.appendRow([Utilities.getUuid(), new Date().toISOString(), v, p.d || '', p.c || '', '']);
  return ContentService.createTextOutput('✓ ' + v.toFixed(2).replace('.', ',') + ' € · ' + (p.d || 'gasto') + ' registado no Oceanum');
}
function out(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }
`;

/* ---- adivinhar categoria e conta ---- */
const KW = [[/uber|bolt|taxi|táxi|metro|comboio|autocarro|gasolina|combust|portagem|estaciona|cp |carris/i, ['Transporte', 'Carro']], [/caf[eé]|restaurante|almo[cç]o|jantar|lanche|mercado|continente|pingo|lidl|aldi|mercadona|supermercado|padaria|pizza|burger|mcdonald|kfc|glovo|uber ?eats|bolt ?food|a[cç]a[ií]/i, ['Alimentação', 'Restauração', 'Supermercado']],
  [/netflix|spotify|youtube|apple|icloud|disney|hbo|prime|chatgpt|claude|subscri/i, ['Subscrições']], [/farm[aá]cia|m[eé]dico|consulta|hospital|dentista|gin[aá]sio|whey|creatina|suplement/i, ['Saúde']], [/renda|luz|[aá]gua|internet|vodafone|meo|nos |edp|casa|ikea/i, ['Casa']], [/roupa|zara|primark|sapat|t[eé]nis|nike|adidas|corte|barbe/i, ['Pessoal']], [/cinema|bar|festa|jogo|steam|playstation|concerto|bilhete/i, ['Lazer']], [/livro|curso|propina|faculdade|universidade/i, ['Educação', 'Pessoal']]];
const guess = (d, c) => { const cats = Object.keys(OS.one('fin').cats.Despesa || {}), has = x => cats.find(k => k.toLowerCase() === String(x || '').trim().toLowerCase());
  if (has(c)) return { cat: has(c) };
  const prev = OS.all('transactions').filter(t => t.type === 'Despesa' && t.desc && d && t.desc.trim().toLowerCase() === d.trim().toLowerCase()).slice(-1)[0];
  if (prev) return { cat: prev.cat, account: prev.account };
  for (const [re, opts] of KW) if (re.test(' ' + d + ' ')) { const k = opts.map(has).find(Boolean); if (k) return { cat: k }; }
  return { cat: has('Outros') || cats[0] || '' }; };
const defAcc = () => { const q = OS.ui.qg || {}, accs = OS.Fin.accounts(); return (q.acc && accs.some(a => a.id === q.acc) && q.acc) || (accs.find(a => a.type === 'Conta à ordem') || accs[0] || {}).id; };

let busy = false;
IB.pull = async (manual) => { const c = cfg(); if (!c.url || !c.key || busy) { if (manual) UI.toast('Configura primeiro o endereço do script', 'warn'); return; } busy = true;
  try { const r = await fetch(c.url + (c.url.includes('?') ? '&' : '?') + 'op=pull&k=' + encodeURIComponent(c.key)), j = await r.json();
    if (!j.ok) { if (manual) UI.toast(j.msg || 'O script recusou o pedido', 'neg'); return; }
    const seen = new Set(U.ls.get(SEEN, [])), got = [];
    (j.items || []).forEach(it => { if (seen.has(it.id)) { got.push(it.id); return; } const v = U.num(it.v); if (!(v > 0)) { got.push(it.id); return; }
      const g = guess(it.d || '', it.c), d = it.t ? U.iso(new Date(it.t)) : U.today();
      const rec = OS.add('transactions', { type: 'Despesa', amount: v, date: d, desc: it.d || '', cat: g.cat, account: g.account || defAcc(), method: 'Débito', ess: 'Essencial', tags: ['atalho'] }, { silent: true });
      try { OS.S.transactions.after && OS.S.transactions.after(rec, true); } catch (e) { }

    U.ls.set(SEEN, [...seen].slice(-500));
    if (got.length) fetch(c.url + (c.url.includes('?') ? '&' : '?') + 'op=ack&k=' + encodeURIComponent(c.key) + '&ids=' + encodeURIComponent(got.join(','))).catch(() => { });
    c.last = new Date().toISOString(); OS.touch('inbox');
    if (manual) UI.toast(got.length ? `${got.length} gasto(s) importado(s)` : 'Ligação OK. Nada novo.', 'pos');
  } catch (e) { if (manual) UI.toast('Não consegui ligar ao script. Confirma o endereço e se está publicado para "Qualquer pessoa".', 'neg'); }
  finally { busy = false; } };

/* ---- painel nas Definições ---- */
const panel = () => { const c = cfg(), link = c.url && c.key ? `${c.url}${c.url.includes('?') ? '&' : '?'}k=${c.key}` : '';
