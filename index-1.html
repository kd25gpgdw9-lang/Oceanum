<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Oceanum</title>
<meta name="description" content="Oceanum — o sistema operativo da tua vida: finanças, estudos, treino, dieta, metas e o jogo Dominus.">
<meta name="theme-color" content="#04101F">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Oceanum">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Cinzel:wght@600;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* OCEANUM — sistema visual do Life OS. Escuro por escolha: um ecrã de controlo que se usa todos os dias. */
:root{
  color-scheme:dark;
  --bg:#070B10; --bg2:#0A0F16; --pn:#0D141D; --pn2:#111A25; --pn3:#16212E;
  --line:rgba(150,180,210,.09); --line2:rgba(150,180,210,.16); --line3:rgba(150,180,210,.26);
  --tx:#E4EBF2; --tx2:#A7B4C2; --mut:#6D7D8F; --muted:#6D7D8F;
  --accent:#5CC8E6; --accent2:#8FDDF2; --accentBg:rgba(92,200,230,.10); --ink:#04131B;
  --pos:#3FCF8E; --posBg:rgba(63,207,142,.11); --warn:#F2B544; --warnBg:rgba(242,181,68,.11); --neg:#F26D6D; --negBg:rgba(242,109,109,.11); --vio:#9A8CF5; --vioBg:rgba(154,140,245,.12);
  --c1:#5CC8E6; --c2:#9A8CF5; --c3:#4F7CF7; --c4:#E0896A; --c5:#3FCF8E; --c6:#B5E48C; --c7:#F28CB1; --c8:#F2B544; --c9:#8FA9C9; --c10:#C9A0DC;
  --sans:'Geist','Inter var',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'Geist Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:10px; --r2:14px; --side:236px;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--tx);height:100%}
body{margin:0;font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;letter-spacing:-.003em}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mut{color:var(--mut)} .tx2{color:var(--tx2)} .pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)} .acc{color:var(--accent)}
.ic{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.row{display:flex;align-items:center;flex-wrap:wrap}.gap4{gap:4px}.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}.end{justify-content:flex-end}.between{justify-content:space-between}.col{display:flex;flex-direction:column}.grow{flex:1;min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
[hidden]{display:none!important}

/* ============ SHELL ============ */
#app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
#side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--bg2);border-right:1px solid var(--line);padding:18px 10px 28px;display:flex;flex-direction:column;gap:2px;scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 14px}
.brand-mark{width:26px;height:26px;border-radius:7px;background:radial-gradient(circle at 50% 0,#8FDDF2,#1B6E8C 70%,#0B3346);display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.brand-mark .ic{width:16px;height:16px;color:#E8F9FF}
.brand b{font-weight:650;letter-spacing:.18em;font-size:13px}
.brand small{display:block;color:var(--mut);font-size:11px;letter-spacing:0;font-weight:400}
.nav-g{margin-top:12px}
.nav-g h6{margin:0 0 3px;padding:0 10px;font:600 10.5px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.nav-g a{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:7px;color:var(--tx2);font-size:13.5px;position:relative}
.nav-g a:hover{background:rgba(255,255,255,.035);color:var(--tx)}
.nav-g a.on{background:var(--pn2);color:var(--tx)}
.nav-g a.on::before{content:"";position:absolute;left:-10px;top:7px;bottom:7px;width:2px;border-radius:2px;background:var(--accent)}
.nav-g a .ic{width:16px;height:16px;opacity:.8}
.nav-g a .cnt{margin-left:auto;font:500 11px var(--mono);color:var(--mut)}
.nav-g a .cnt.neg{color:var(--neg)}
.nav-dom{margin-top:14px;padding:10px;border-radius:10px;background:linear-gradient(135deg,#1A1408,#0E0B06);border:1px solid rgba(201,162,94,.25);display:flex;align-items:center;gap:10px;color:#E8D3A8}
.nav-dom .ic{color:#C9A25E}
.nav-dom b{font-family:'Cinzel',Georgia,serif;letter-spacing:.14em;font-size:13px}
.nav-dom small{display:block;color:#9C8660;font-size:11px}
.nav-dom.on{box-shadow:0 0 0 1px #C9A25E}
.side-foot{margin-top:auto;padding:14px 10px 0;display:flex;align-items:center;gap:8px;color:var(--mut);font-size:12px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--mut)}
.sync-dot.ok{background:var(--pos)}.sync-dot.busy{background:var(--warn)}.sync-dot.err{background:var(--neg)}
main{min-width:0;display:flex;flex-direction:column}
#top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 28px;background:rgba(7,11,16,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.crumb{color:var(--mut);font-size:13px;display:flex;align-items:center;gap:6px;min-width:0}
.crumb b{color:var(--tx);font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-btn{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:240px;padding:7px 10px;border-radius:8px;border:1px solid var(--line2);background:var(--pn);color:var(--mut);cursor:pointer;font-size:13px}
.search-btn:hover{border-color:var(--line3);color:var(--tx2)}
.search-btn kbd{margin-left:auto;font:11px var(--mono);border:1px solid var(--line2);border-radius:4px;padding:0 5px}
#view{padding:26px 28px 120px;max-width:1280px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:26px}
#tabbar{display:none}

/* ============ PAGE HEAD ============ */
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.phead h1{margin:2px 0 0;font-size:26px;line-height:1.15;font-weight:620;letter-spacing:-.025em;text-wrap:balance}
.phead p{margin:5px 0 0;color:var(--tx2);max-width:70ch}
.phead-a{display:flex;gap:8px;flex-wrap:wrap}
.eyebrow{font:600 11px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.eyebrow.acc{color:var(--accent)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;margin-top:-10px}
.tabs::-webkit-scrollbar{display:none}
.tabs a{padding:9px 12px;color:var(--mut);font-size:13.5px;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a:hover{color:var(--tx2)}
.tabs a.on{color:var(--tx);border-bottom-color:var(--accent)}
.sech{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sech h2{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.sech p{margin:2px 0 0;color:var(--mut);font-size:13px}
section.s{min-width:0}

/* ============ LAYOUT ============ */
.g{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
.g-side{grid-template-columns:minmax(0,1fr) minmax(0,1.65fr)}
.pn{background:var(--pn);border:1px solid var(--line);border-radius:var(--r2);padding:18px;min-width:0}
.pn.flush{padding:0}
.pn.tint{background:linear-gradient(180deg,var(--pn2),var(--pn))}
.pn-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.pn-h h3{margin:0;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.pn-h h3 .ic{color:var(--mut)}
.pn-h a.more{color:var(--mut);font-size:12.5px;display:flex;align-items:center;gap:2px}
.pn-h a.more:hover{color:var(--accent)}
.divider{height:1px;background:var(--line);margin:14px 0}

/* ============ KPI ============ */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.kpi{background:var(--pn);padding:14px 16px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi[data-go]{cursor:pointer}.kpi[data-go]:hover{background:var(--pn2)}
.kpi-l{font-size:12px;color:var(--mut)}
.kpi-v{font:600 22px/1.15 var(--mono);letter-spacing:-.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-v.pos{color:var(--pos)}.kpi-v.neg{color:var(--neg)}.kpi-v.warn{color:var(--warn)}.kpi-v.acc{color:var(--accent)}
.kpi-s{font-size:12px;color:var(--tx2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.big-num{font:600 34px/1.05 var(--mono);letter-spacing:-.05em}
.trend{display:inline-flex;align-items:center;gap:1px;font:500 11.5px var(--mono)}
.trend .ic{width:12px;height:12px}
.trend.pos{color:var(--pos)}.trend.neg{color:var(--neg)}.trend.flat{color:var(--mut)}

/* ============ BADGES / DOTS / BARS ============ */
.bdg{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:5px;font-size:11.5px;font-weight:550;background:rgba(255,255,255,.055);color:var(--tx2);white-space:nowrap;line-height:1.5}
.bdg.pos{background:var(--posBg);color:var(--pos)}.bdg.warn{background:var(--warnBg);color:var(--warn)}.bdg.neg{background:var(--negBg);color:var(--neg)}.bdg.acc{background:var(--accentBg);color:var(--accent)}.bdg.vio{background:var(--vioBg);color:var(--vio)}
.bdg.out{background:none;box-shadow:inset 0 0 0 1px var(--line2)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mut);flex:none}
.dot.pos{background:var(--pos)}.dot.warn{background:var(--warn)}.dot.neg{background:var(--neg)}.dot.acc{background:var(--accent)}
.pbar{position:relative;height:6px;border-radius:9px;background:rgba(255,255,255,.06);overflow:visible;min-width:40px}
.pbar i{display:block;height:100%;border-radius:9px;background:var(--accent);max-width:100%}
.pbar.pos i{background:var(--pos)}.pbar.warn i{background:var(--warn)}.pbar.neg i{background:var(--neg)}.pbar.vio i{background:var(--vio)}
.pbar b{position:absolute;top:-3px;width:2px;height:12px;border-radius:2px;background:var(--tx2);transform:translateX(-1px)}
.pbar.thin{height:4px}

/* ============ BUTTONS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 12px;border-radius:8px;border:1px solid var(--line2);background:var(--pn2);color:var(--tx);font-size:13px;font-weight:520;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--line3);background:var(--pn3)}
.btn .ic{width:15px;height:15px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.btn.pri:hover{background:var(--accent2);border-color:var(--accent2)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--tx2)}
.btn.ghost:hover{background:rgba(255,255,255,.05);color:var(--tx)}
.btn.danger{background:var(--neg);border-color:var(--neg);color:#1A0606}
.btn.danger.ghost{background:transparent;border-color:transparent;color:var(--neg)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn.xs{padding:2px 7px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.more{align-self:flex-start;margin-top:6px}
.icon-btn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:7px;border:0;background:transparent;color:var(--mut);cursor:pointer}
.icon-btn:hover{background:rgba(255,255,255,.06);color:var(--tx)}
.chip{padding:5px 11px;border-radius:99px;border:1px solid var(--line2);background:transparent;color:var(--tx2);font-size:12.5px;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--line3);color:var(--tx)}
.chip.on{background:var(--accentBg);border-color:rgba(92,200,230,.4);color:var(--accent)}
.seg{display:inline-flex;padding:2px;border-radius:8px;background:var(--pn);border:1px solid var(--line)}
.seg button{border:0;background:transparent;padding:4px 10px;border-radius:6px;color:var(--mut);font-size:12.5px;cursor:pointer}
.seg button.on{background:var(--pn3);color:var(--tx)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{background:var(--pn);border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font-size:13px;min-width:0}
.filters input[type=search]{min-width:180px}

/* ============ TOGGLE ============ */
details.tog{border:1px solid var(--line);border-radius:var(--r2);background:var(--pn)}
details.tog>summary{list-style:none;cursor:pointer;padding:13px 16px;display:flex;align-items:center;gap:10px;font-weight:560;font-size:13.5px}
details.tog>summary::-webkit-details-marker{display:none}
details.tog>summary .ic{color:var(--mut)}
details.tog>summary .chev{margin-left:auto;transition:transform .15s}
details.tog[open]>summary .chev{transform:rotate(180deg)}
.tog-b{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}

/* ============ LISTS ============ */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li.click{cursor:pointer}.li.click:hover .li-t{color:var(--accent)}
.li-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.li-t b{font-weight:520;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-t small{color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-r{display:flex;align-items:center;gap:8px;flex:none}
.li .when{font:12px var(--mono);color:var(--mut);min-width:52px}
.li.done .li-t b{color:var(--mut);text-decoration:line-through}
.cbx{appearance:none;-webkit-appearance:none;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line3);background:transparent;cursor:pointer;flex:none;display:grid;place-content:center;margin:0}
.cbx:hover{border-color:var(--accent)}
.cbx:checked{background:var(--accent);border-color:var(--accent)}
.cbx:checked::after{content:"";width:9px;height:5px;border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(-45deg) translate(1px,-1px)}
.cbx.round{border-radius:50%}
.empty{padding:22px 4px;color:var(--mut);display:flex;flex-direction:column;gap:10px;align-items:flex-start;font-size:13.5px}
.empty p{margin:0;max-width:60ch}

/* ============ TABLE ============ */
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--pn)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:550;font-size:11.5px;color:var(--mut);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--pn)}
.tbl th.sortable{cursor:pointer}.tbl th.sortable:hover{color:var(--tx)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr[data-edit]{cursor:pointer}
.tbl tbody tr:hover td{background:rgba(255,255,255,.02)}
.tbl .r{text-align:right}
.tbl .wrap{white-space:normal;min-width:180px}
.tbl tr.muted td{color:var(--mut)}

/* ============ FORMS ============ */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld label{font-size:12.5px;color:var(--tx2);font-weight:500}
.fld small{color:var(--mut);font-size:11.5px}
.req{color:var(--neg);font-weight:500}
.fld input,.fld select,.fld textarea,.field{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font-size:13.5px;min-width:0}
.fld textarea{resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus,.field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accentBg)}
.inp-wrap{display:flex;align-items:center;background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding-inline:10px}
.inp-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentBg)}
.inp-wrap input{border:0!important;box-shadow:none!important;padding-inline:4px!important;background:transparent!important}
.inp-wrap span{color:var(--mut);font-size:13px}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%)!important;background-position:calc(100% - 13px) 55%,calc(100% - 8px) 55%!important;background-size:5px 5px!important;background-repeat:no-repeat!important;padding-right:26px!important}
select option{background:#0D141D}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipc input{position:absolute;opacity:0;pointer-events:none}
.chipc span{display:inline-block;padding:4px 10px;border-radius:99px;border:1px solid var(--line2);font-size:12.5px;color:var(--tx2);cursor:pointer}
.chipc input:checked+span{background:var(--accentBg);border-color:rgba(92,200,230,.45);color:var(--accent)}
.chipc input:focus-visible+span{outline:2px solid var(--accent)}
.rating{display:flex;gap:4px}
.rating input{position:absolute;opacity:0}
.rating span{display:grid;place-items:center;width:32px;height:30px;border-radius:7px;border:1px solid var(--line2);font:500 12.5px var(--mono);color:var(--tx2);cursor:pointer}
.rating input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.rating input:focus-visible+span{outline:2px solid var(--accent)}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13.5px;color:var(--tx)!important}
.switch input{position:absolute;opacity:0}
.switch span{width:34px;height:20px;border-radius:99px;background:var(--pn3);border:1px solid var(--line2);position:relative;flex:none;transition:background .15s}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--tx2);transition:transform .15s}
.switch input:checked+span{background:var(--accent);border-color:var(--accent)}
.switch input:checked+span::after{transform:translateX(14px);background:var(--ink)}
.switch input:focus-visible+span{outline:2px solid var(--accent)}
.fld-bool{justify-content:flex-end}
.steps-ed{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.step-row{display:flex;gap:8px;align-items:center;width:100%}
.step-row input[type=checkbox]{width:16px;height:16px;flex:none}
.step-row .st-t{flex:1}
.wk-ed{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.ex-block{width:100%;border:1px solid var(--line2);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px}
.ex-block .ex-sel{flex:1;background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:7px 9px}
.set-head,.set-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 30px;gap:6px;align-items:center}
.set-head span{font-size:11px;color:var(--mut)}
.set-row input{background:var(--bg);border:1px solid var(--line2);border-radius:7px;padding:6px 8px;width:100%;font-family:var(--mono);font-size:13px}

/* ============ DRAWER / MODAL / TOAST ============ */
#drawer,#modal{position:fixed;inset:0;z-index:80}
.drw-bg{position:absolute;inset:0;background:rgba(2,5,9,.62);backdrop-filter:blur(2px)}
.drw{position:absolute;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--pn);border-left:1px solid var(--line2);display:flex;flex-direction:column;animation:slide .18s ease-out}
.drw.wide{width:min(760px,100%)}
@keyframes slide{from{transform:translateX(30px);opacity:.6}to{transform:none;opacity:1}}
.form{display:flex;flex-direction:column;height:100%}
.drw-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.drw-h h3{margin:3px 0 0;font-size:17px;font-weight:600}
.drw-b{flex:1;overflow-y:auto;padding:18px 20px 24px;display:flex;flex-direction:column;gap:18px}
.drw-f{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.modal{position:absolute;left:50%;top:18%;transform:translateX(-50%);width:min(460px,calc(100% - 32px));background:var(--pn);border:1px solid var(--line2);border-radius:var(--r2);padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal h3{margin:0;font-size:16px}.modal p{margin:0;color:var(--tx2)}
.modal.cmd{top:12%;width:min(620px,calc(100% - 32px));padding:0;gap:0;overflow:hidden}
.cmd input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:16px 18px;font-size:15px;outline:none}
.cmd-list{max-height:52vh;overflow-y:auto;padding:6px}
.cmd-it{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--tx2)}
.cmd-it small{margin-left:auto;color:var(--mut);font-size:12px}
.cmd-it.on,.cmd-it:hover{background:var(--pn3);color:var(--tx)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:90;background:#E9F6FB;color:#04131B;font-weight:550;font-size:13.5px;padding:10px 16px;border-radius:9px;box-shadow:0 16px 40px rgba(0,0,0,.45);max-width:calc(100vw - 32px);text-align:center}
.toast.neg{background:#FBE3E3;color:#3A0A0A}.toast.warn{background:#FCF0D6;color:#3A2A06}.toast.pos{background:#DDF7EA;color:#06301C}

/* ============ CHARTS ============ */
.chart{width:100%;position:relative}
.chart svg{display:block;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .gl0{stroke:var(--line3);stroke-width:1}
.chart .tgt{stroke:var(--warn);stroke-dasharray:4 4;stroke-width:1.2}
.chart .cl{fill:var(--mut);font:10.5px var(--mono)}
.chart .clv{fill:var(--tx);font-weight:600}
.chart .tgtl{fill:var(--warn)}
.chart-empty{height:100%;display:grid;place-items:center;color:var(--mut);font-size:13px;border:1px dashed var(--line2);border-radius:10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--tx2);margin-top:8px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:2px}
.donut{display:flex;gap:22px;align-items:center;flex-wrap:wrap;height:100%}
.donut .dn-v{fill:var(--tx);font:600 16px var(--mono)}
.dn-leg{flex:1;min-width:180px;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.dn-leg div{display:grid;grid-template-columns:10px 1fr auto 38px;gap:8px;align-items:center}
.dn-leg i{width:9px;height:9px;border-radius:2px}
.dn-leg span{color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dn-leg b{font:500 12px var(--mono)}.dn-leg em{font:12px var(--mono);color:var(--mut);font-style:normal;text-align:right}
.spark{display:block}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(11px,1fr));gap:3px}
.heat i{aspect-ratio:1;border-radius:3px;background:color-mix(in srgb,var(--accent) calc(var(--k)*100%),rgba(255,255,255,.05))}

/* ============ SPECIFIC: DASHBOARD ============ */
.life{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r2);background:var(--pn);overflow:hidden}
.life a{padding:14px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.life a:last-child{border-right:0}
.life a:hover{background:var(--pn2)}
.life .lh{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mut)}
.life .lv{font:600 17px var(--mono);letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.life .ls{font-size:12px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.greet h1{font-size:30px}
.att{display:flex;flex-direction:column}
.att-it{display:grid;grid-template-columns:4px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.att-it:last-child{border-bottom:0}
.att-it>i{align-self:stretch;border-radius:4px;background:var(--mut)}
.att-it>i.urgent{background:var(--neg)}.att-it>i.attention{background:var(--warn)}.att-it>i.ok{background:var(--pos)}
.att-it b{font-weight:530;display:block}
.att-it small{color:var(--mut);font-size:12.5px}
.att-it .area{font-size:11px;color:var(--mut);letter-spacing:.04em;text-transform:uppercase;margin-right:6px}
.cr-col h3{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.cr-card{border:1px solid var(--line);background:var(--pn);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.cr-card.urgent{border-color:rgba(242,109,109,.35);background:linear-gradient(180deg,rgba(242,109,109,.06),var(--pn))}
.cr-card.attention{border-color:rgba(242,181,68,.28)}
.cr-card .t{font-weight:550}
.cr-card small{color:var(--tx2)}
.na{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.na:last-child{border-bottom:0}
.na-score{font:600 15px var(--mono);color:var(--accent);text-align:center;border:1px solid rgba(92,200,230,.3);border-radius:9px;padding:6px 0}
.na.top .na-score{background:var(--accent);color:var(--ink)}
.na-why{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.agenda-it{display:grid;grid-template-columns:52px 3px 1fr;gap:10px;align-items:start;padding:7px 0}
.agenda-it .when{font:12px var(--mono);color:var(--mut);padding-top:1px}
.agenda-it>i{align-self:stretch;border-radius:3px}
.agenda-it b{font-weight:500;display:block}
.agenda-it small{color:var(--mut);font-size:12px}
.agenda-it.done b{color:var(--mut);text-decoration:line-through}
.agenda-day{font-size:11.5px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;margin:12px 0 2px}
.agenda-day:first-child{margin-top:0}

/* ============ TODAY ============ */
.today{max-width:780px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:26px}
.today-clock{font:600 56px/1 var(--mono);letter-spacing:-.06em}
.today-q{color:var(--tx2);font-size:14px;border-left:2px solid var(--accent);padding-left:12px;max-width:60ch}
.mit{display:flex;flex-direction:column;gap:2px}
.mit-it{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--pn);border:1px solid var(--line)}
.mit-it b{font-weight:530;flex:1}
.hab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
.hab{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--pn);cursor:pointer}
.hab.on{border-color:rgba(63,207,142,.3);background:linear-gradient(180deg,rgba(63,207,142,.06),var(--pn))}
.hab .streak{margin-left:auto;font:11.5px var(--mono);color:var(--mut)}
.hab.auto{cursor:default}
.tl{position:relative;display:flex;flex-direction:column}
.tl-it{display:grid;grid-template-columns:48px 14px 1fr;gap:8px;min-height:36px}
.tl-it .h{font:12px var(--mono);color:var(--mut);padding-top:2px;text-align:right}
.tl-it .ax{position:relative}
.tl-it .ax::before{content:"";position:absolute;left:6px;top:0;bottom:0;width:1px;background:var(--line2)}
.tl-it .ax i{position:absolute;left:2px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--pn3);border:2px solid var(--mut)}
.tl-it.now .ax i{border-color:var(--accent);background:var(--accent);box-shadow:0 0 0 4px var(--accentBg)}
.tl-it.past{opacity:.5}
.tl-it .c{padding-bottom:10px}
.tl-it .c b{font-weight:520}
.tl-it .c small{display:block;color:var(--mut);font-size:12px}

/* ============ CALENDAR ============ */
.cal-m{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal-m .wd{padding:8px;font-size:11.5px;color:var(--mut);border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.05em}
.cal-d{min-height:108px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0;cursor:pointer}
.cal-d:hover{background:rgba(255,255,255,.02)}
.cal-d.out{opacity:.35}
.cal-d .n{font:12px var(--mono);color:var(--tx2);margin-bottom:2px}
.cal-d.today .n{color:var(--ink);background:var(--accent);border-radius:5px;padding:0 5px;align-self:flex-start}
.cev{display:flex;align-items:center;gap:5px;font-size:11.5px;padding:1px 4px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx2);min-width:0}
.cev i{width:6px;height:6px;border-radius:50%;flex:none}
.cev.done{text-decoration:line-through;color:var(--mut)}
.cev.plan{opacity:.65;font-style:italic}
.cev.late{color:var(--neg)}
.cev .more{color:var(--mut)}
.cal-w{display:grid;grid-template-columns:48px repeat(7,minmax(110px,1fr));min-width:820px}
.cal-w .hd{padding:8px 6px;font-size:12px;color:var(--tx2);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--pn)}
.cal-w .hd.today{color:var(--accent)}
.cal-w .allday{border-bottom:1px solid var(--line);padding:4px;min-height:28px;display:flex;flex-direction:column;gap:2px;border-left:1px solid var(--line)}
.cal-grid{position:relative;border-left:1px solid var(--line)}
.cal-hr{height:44px;border-bottom:1px solid var(--line);font:10.5px var(--mono);color:var(--mut);padding:2px 6px 0 0;text-align:right}
.cal-blk{position:absolute;left:3px;right:3px;border-radius:6px;padding:3px 6px;font-size:11.5px;overflow:hidden;background:var(--pn3);border-left:3px solid var(--accent);cursor:pointer;line-height:1.3}
.cal-blk small{display:block;color:var(--mut);font-size:10.5px}
.cal-now{position:absolute;left:0;right:0;height:2px;background:var(--neg);z-index:2}
.src-chips{display:flex;gap:6px;flex-wrap:wrap}
.src-chips .chip i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}

/* ============ KANBAN ============ */
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:140px}
.kcol h4{margin:0 2px 2px;font-size:12px;font-weight:600;display:flex;justify-content:space-between;color:var(--tx2)}
.kcard{background:var(--pn);border:1px solid var(--line);border-radius:9px;padding:10px 11px;display:flex;flex-direction:column;gap:6px;cursor:pointer;font-size:13px}
.kcard:hover{border-color:var(--line3)}
.kcard b{font-weight:530}
.kcard .meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center;color:var(--mut);font-size:12px}

/* ============ GOALS / PROJECTS ============ */
.gcard{display:grid;grid-template-columns:1fr 150px;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.gcard:last-child{border-bottom:0}
.gcard b{font-weight:540}
.gcard .gmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px;color:var(--mut);font-size:12.5px}
.gcard .gp{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.gcard .gp .num{font-size:13px}
.ring{--p:0;width:46px;height:46px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),rgba(255,255,255,.07) 0);display:grid;place-items:center;flex:none}
.ring::after{content:attr(data-v);width:36px;height:36px;border-radius:50%;background:var(--pn);display:grid;place-items:center;font:600 11px var(--mono)}
.ring.pos{background:conic-gradient(var(--pos) calc(var(--p)*1%),rgba(255,255,255,.07) 0)}
.ring.warn{background:conic-gradient(var(--warn) calc(var(--p)*1%),rgba(255,255,255,.07) 0)}
.ring.neg{background:conic-gradient(var(--neg) calc(var(--p)*1%),rgba(255,255,255,.07) 0)}
.road{position:relative;overflow-x:auto;border:1px solid var(--line);border-radius:var(--r2);background:var(--pn)}
.road-in{position:relative;min-width:900px}
.road-axis{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0}
.road-axis div{flex:1;padding:8px 10px;font:11px var(--mono);color:var(--mut);border-left:1px solid var(--line)}
.road-lane{display:grid;grid-template-columns:140px 1fr;border-bottom:1px solid var(--line);min-height:52px}
.road-lane .lname{padding:10px 12px;font-size:12.5px;color:var(--tx2);border-right:1px solid var(--line);background:var(--bg2)}
.road-lane .ltrack{position:relative}
.road-it{position:absolute;top:10px;height:30px;border-radius:7px;padding:5px 9px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border:1px solid var(--line2);background:var(--pn3)}
.road-it.ms{width:auto!important;border-radius:99px;background:transparent;border-color:var(--warn);color:var(--warn)}
.road-today{position:absolute;top:0;bottom:0;width:1px;background:var(--neg);z-index:3}
.tree{display:flex;flex-direction:column;gap:6px}
.tree-n{border-left:1px solid var(--line2);padding-left:14px;margin-left:6px;display:flex;flex-direction:column;gap:6px}
.tree-it{display:flex;align-items:center;gap:8px;font-size:13px}
.tree-it .k{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);min-width:64px}

/* ============ BODY MAP ============ */
.bodymap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.3fr);gap:18px;align-items:start}
.bm-fig{display:flex;flex-direction:column;align-items:center;gap:6px}
.bm-fig svg{width:100%;max-width:220px;height:auto}
.bm-fig .cap{font-size:11.5px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.bm-base{fill:#1A2533;stroke:#2A3747;stroke-width:1}
.bm-m{fill:rgba(92,200,230,calc(.08 + var(--k,0)*.75));stroke:rgba(143,221,242,.35);stroke-width:.8;cursor:pointer;transition:fill .15s}
.bm-m:hover{stroke:#E4EBF2;stroke-width:1.4}
.bm-m.sel{stroke:#F2B544;stroke-width:2}
.bm-legend{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--mut)}
.bm-legend i{width:80px;height:6px;border-radius:9px;background:linear-gradient(90deg,rgba(92,200,230,.08),rgba(92,200,230,.83))}

/* ============ FOCUS ============ */
#focus{position:fixed;inset:0;z-index:70;background:radial-gradient(ellipse at 50% -10%,#0E2A3A,#05090E 60%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center}
#focus .f-top{position:absolute;top:18px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:12.5px}
#focus .f-act{font-size:clamp(20px,3vw,28px);font-weight:600;max-width:24ch;letter-spacing:-.02em;text-wrap:balance}
#focus .f-time{font:600 clamp(72px,16vw,150px)/1 var(--mono);letter-spacing:-.07em}
#focus .f-ring{width:min(70vw,340px);height:6px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden}
#focus .f-ring i{display:block;height:100%;background:var(--accent)}
#focus .f-meta{display:flex;gap:26px;flex-wrap:wrap;justify-content:center;color:var(--tx2);font-size:13px}
#focus .f-meta b{display:block;color:var(--tx);font-weight:550;margin-top:2px}
#focus .f-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#dock{position:fixed;right:20px;bottom:20px;z-index:60;display:flex;align-items:center;gap:12px;padding:8px 10px 8px 14px;border-radius:12px;background:#0B1C27;border:1px solid rgba(92,200,230,.35);box-shadow:0 16px 40px rgba(0,0,0,.5);cursor:pointer}
#dock b{font:600 18px var(--mono);letter-spacing:-.04em}
#dock small{display:block;color:var(--mut);font-size:11px;max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ============ SIMULATORS ============ */
.sim{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
.sim-in{display:flex;flex-direction:column;gap:12px}
.sim-out .kpis{margin-bottom:14px}
.note{font-size:12.5px;color:var(--mut);border-left:2px solid var(--line3);padding:2px 0 2px 10px;max-width:80ch}
.note b{color:var(--tx2);font-weight:550}
.est{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--warn);border:1px solid rgba(242,181,68,.3);border-radius:5px;padding:0 6px;font-weight:550;letter-spacing:.02em}

/* ============ MISC ============ */
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--mut)}.kv dd{margin:0;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.bar-row{display:grid;grid-template-columns:minmax(90px,160px) 1fr 90px;gap:12px;align-items:center;padding:6px 0;font-size:13px}
.bar-row .l{color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row .v{text-align:right;font:12.5px var(--mono)}
.q{font-size:14px;color:var(--tx2);font-style:italic}
.lock-card{display:flex;gap:12px;align-items:center;padding:14px;border-radius:12px;border:1px dashed var(--line3);color:var(--tx2)}
.cmp{width:100%;border-collapse:collapse;font-size:13px}
.cmp th,.cmp td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp th{font-weight:550;font-size:11.5px;color:var(--mut)}
.ins{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.ins:last-child{border-bottom:0}
.ins .ic{margin-top:2px}
.qa textarea{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:9px;padding:10px 12px;min-height:74px;resize:vertical}
.qa label{display:block;font-size:13px;color:var(--tx2);margin:0 0 6px;font-weight:520}
.qa textarea:focus{outline:none;border-color:var(--accent)}
.matrix td,.matrix th{text-align:center!important}
.matrix td:first-child,.matrix th:first-child{text-align:left!important}
.matrix input,.matrix select{width:100%;min-width:70px;background:var(--bg);border:1px solid var(--line2);border-radius:6px;padding:5px 7px;font-size:12.5px}
.best{box-shadow:inset 0 0 0 1px rgba(63,207,142,.5);border-radius:6px}
.boot{height:100vh;display:grid;place-items:center;color:var(--mut)}
.boot div{display:flex;flex-direction:column;align-items:center;gap:12px}
.wave-load{width:120px;height:3px;border-radius:9px;background:rgba(255,255,255,.06);overflow:hidden}
.wave-load i{display:block;height:100%;width:40%;background:var(--accent);animation:wl 1.1s ease-in-out infinite}
@keyframes wl{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}

/* ============ RESPONSIVE ============ */
@media (max-width:1180px){.life{grid-template-columns:repeat(3,minmax(0,1fr))}.life a:nth-child(3){border-right:0}.life a:nth-child(-n+3){border-bottom:1px solid var(--line)}.bodymap{grid-template-columns:1fr 1fr}.bodymap>.bm-panel{grid-column:1/-1}}
@media (max-width:980px){
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-main,.g-side{grid-template-columns:1fr}.sim{grid-template-columns:1fr}
}
@media (max-width:860px){
  #app{grid-template-columns:1fr}

}

.brand-mark.oc{background:#0B0B0B;box-shadow:inset 0 0 0 1px rgba(237,230,218,.14)}

<style>

/* Explorar */
.exp{display:flex;flex-direction:column;gap:30px}.exp-h h1{margin:0;font-size:30px;font-weight:500;letter-spacing:-.02em}.exp-h p{margin:6px 0 0;color:var(--mut)}

.exp-t em{position:absolute;top:14px;right:14px;font:500 10.5px var(--mono);font-style:normal;color:var(--mut)}.exp-t em.new{color:var(--accent)}.exp-t:not(.in){opacity:.85}
@media (max-width:860px){#view{padding:16px 16px 120px;gap:26px}#top{padding:10px 14px}}

<style>
/* DOMINUS — o jogo. Identidade própria: obsidiana, ouro velho, carmesim. Só vive dentro de .dom */
body.dom-mode{--dbg:#0A0907}
body.dom-mode,body.dom-mode #top{background:#0A0907}
body.dom-mode #top{border-bottom-color:rgba(201,162,94,.14)}
body.dom-mode #view{max-width:1440px}
.dom{--g:#C9A25E;--g2:#E8D3A8;--g3:#8C7043;--cr:#B5483B;--ob:#0A0907;--p1:#13110D;--p2:#1A1712;--p3:#221E17;--ln:rgba(201,162,94,.16);--ln2:rgba(201,162,94,.3);--dt:#E9E2D2;--dm:#9A8F7A;
  --int:#6F8FC4;--for:#C9A25E;--cor:#C0584A;--inf:#9A78C4;
  color:var(--dt);font-family:'Cormorant Garamond',Georgia,serif;font-size:16px;display:flex;flex-direction:column;gap:18px;margin:-26px -28px 0;padding:22px 28px 40px;min-height:calc(100vh - 60px);
  background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(201,162,94,.09),transparent 60%),radial-gradient(ellipse 60% 40% at 90% 110%,rgba(181,72,59,.07),transparent 60%),#0A0907}
.dom h1,.dom h2,.dom h3,.dom h4,.dom .cz{font-family:'Cinzel',Georgia,serif;letter-spacing:.08em;font-weight:700}
.dom .mono,.dom .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.dom .dm{color:var(--dm)}.dom .gold{color:var(--g)}.dom .crim{color:#E07A6C}
.dom .ic{stroke-width:1.5}

/* HUD */
.hud{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;padding:14px 18px;border:1px solid var(--ln);border-radius:14px;background:linear-gradient(180deg,rgba(26,23,18,.95),rgba(15,13,10,.95));box-shadow:inset 0 1px 0 rgba(232,211,168,.06)}
.hud-id{display:flex;align-items:center;gap:14px}
.sigil{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#3A2E1B,#120F0A 70%);box-shadow:0 0 0 1px var(--g3),0 0 24px rgba(201,162,94,.18)}
.sigil svg{width:34px;height:34px}
.hud-id b{display:block;font-family:'Cinzel',serif;letter-spacing:.14em;font-size:15px;color:var(--g2)}
.hud-id small{font-size:14px;color:var(--dm)}
.res{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.rs{display:flex;align-items:center;gap:7px;padding:5px 10px;border-radius:9px;background:rgba(255,255,255,.025);border:1px solid var(--ln);min-width:0}
.rs .ic{width:15px;height:15px}
.rs b{font:600 14px var(--mono);color:var(--dt)}
.rs small{font-size:12px;color:var(--dm);font-family:'Cinzel',serif;letter-spacing:.06em}
.pips{display:flex;gap:3px}.pips i{width:9px;height:14px;border-radius:2px;background:rgba(255,255,255,.08);transform:skewX(-12deg)}.pips i.on{background:var(--g);box-shadow:0 0 6px rgba(201,162,94,.6)}
.dbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 16px;border-radius:9px;border:1px solid var(--ln2);background:linear-gradient(180deg,#2A2319,#17130E);color:var(--g2);font:700 12.5px 'Cinzel',serif;letter-spacing:.1em;cursor:pointer;text-transform:uppercase;white-space:nowrap}
.dbtn:hover{border-color:var(--g);color:#fff}
.dbtn.gold{background:linear-gradient(180deg,#E3C27E,#B08A45);color:#1A1208;border-color:#E8D3A8}
.dbtn.gold:hover{filter:brightness(1.08);color:#000}
.dbtn.crim{background:linear-gradient(180deg,#8E3128,#5E1F19);border-color:#C0584A;color:#FBE4DF}
.dbtn.sm{padding:5px 10px;font-size:11px}
.dbtn:disabled{opacity:.35;cursor:not-allowed;filter:none}
.dbtn .ic{width:14px;height:14px}
.glow{animation:glow 2.2s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(232,211,168,.0)}50%{box-shadow:0 0 22px 2px rgba(232,211,168,.35)}}
.dtabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--ln)}
.dtabs a{padding:10px 14px;font:700 12px 'Cinzel',serif;letter-spacing:.12em;color:var(--dm);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;text-transform:uppercase}
.dtabs a:hover{color:var(--g2)}.dtabs a.on{color:var(--g2);border-bottom-color:var(--g)}
.dtabs a .n{display:inline-grid;place-items:center;min-width:17px;height:17px;border-radius:9px;background:var(--cr);color:#fff;font:600 10px var(--mono);margin-left:6px;padding:0 4px}

/* painéis */
.dp{border:1px solid var(--ln);border-radius:14px;background:linear-gradient(180deg,rgba(26,23,18,.85),rgba(16,14,11,.85));padding:16px 18px;min-width:0;position:relative}
.dp h3{margin:0 0 12px;font-size:13px;color:var(--g2);display:flex;align-items:center;gap:8px;justify-content:space-between}
.dp h3 .ic{color:var(--g)}
.dp .sub{font-size:15px;color:var(--dm);margin:-6px 0 12px}
.dgrid{display:grid;gap:16px}
.d2{grid-template-columns:repeat(2,minmax(0,1fr))}.d3{grid-template-columns:repeat(3,minmax(0,1fr))}.d4{grid-template-columns:repeat(4,minmax(0,1fr))}
.dmain{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.dbar{height:7px;border-radius:9px;background:rgba(255,255,255,.06);overflow:hidden}
.dbar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--g3),var(--g))}
.dbar.int i{background:var(--int)}.dbar.for i{background:var(--for)}.dbar.cor i{background:var(--cor)}.dbar.inf i{background:var(--inf)}.dbar.crim i{background:linear-gradient(90deg,#6B211A,var(--cr))}
.dli{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--ln)}
.dli:last-child{border-bottom:0}
.dli .t{flex:1;min-width:0}.dli .t b{display:block;font-weight:600;font-size:16.5px;line-height:1.25}.dli .t small{color:var(--dm);font-size:14px}
.rw{display:inline-flex;gap:6px;flex-wrap:wrap;font:12px var(--mono);color:var(--g2)}
.rw span{padding:1px 6px;border-radius:5px;background:rgba(201,162,94,.1)}
.tag{display:inline-block;padding:1px 8px;border-radius:5px;font:700 10.5px 'Cinzel',serif;letter-spacing:.1em;border:1px solid var(--ln2);color:var(--g2);text-transform:uppercase}
.tag.int{color:var(--int);border-color:color-mix(in srgb,var(--int) 50%,transparent)}.tag.for{color:var(--for);border-color:color-mix(in srgb,var(--for) 50%,transparent)}.tag.cor{color:var(--cor);border-color:color-mix(in srgb,var(--cor) 50%,transparent)}.tag.inf{color:var(--inf);border-color:color-mix(in srgb,var(--inf) 50%,transparent)}
.tag.done{background:rgba(201,162,94,.14)}.tag.lock{opacity:.5}
.quote-d{font-style:italic;color:var(--dm);font-size:17px;border-left:2px solid var(--g3);padding-left:12px}

/* MAPA */
.mapwrap{position:relative}
.map svg{width:100%;height:auto;display:block;max-height:640px}
.hx{stroke:rgba(201,162,94,.22);stroke-width:1;transition:filter .15s}
.hx.fog{fill:#0E0C09;stroke:rgba(201,162,94,.07)}
.hx.water{fill:url(#waterP);stroke:rgba(90,130,170,.2)}
.hx.own{stroke:var(--g);stroke-width:1.4}
.hx.can{cursor:pointer;stroke-dasharray:3 3;stroke:rgba(232,211,168,.55)}
.hx.can:hover,.hx.ownc:hover{filter:brightness(1.35)}
.hx.ownc{cursor:pointer}
.hx.sel{stroke:#fff;stroke-width:2.4;stroke-dasharray:none}
.hx.revolt{stroke:#E07A6C;stroke-width:2;stroke-dasharray:4 2}
.hglyph{pointer-events:none;fill:none;stroke:rgba(232,211,168,.75);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.hlabel{pointer-events:none;font:700 9px 'Cinzel',serif;letter-spacing:.14em;fill:rgba(232,211,168,.5)}
.terr{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tcard{border:1px solid var(--ln);border-radius:12px;padding:12px;background:rgba(255,255,255,.015)}
.tcard h4{margin:0;font-size:12px;display:flex;justify-content:space-between;align-items:center}
.tcard .lv{font:600 22px var(--mono);margin:6px 0 4px}
.tcard small{color:var(--dm);font-size:13.5px}
.bldg{display:flex;gap:5px;margin-top:8px}.bldg span{font:10px var(--mono);padding:1px 5px;border-radius:4px;border:1px solid var(--ln);color:var(--dm)}.bldg span.on{color:var(--g2);border-color:var(--ln2)}

/* farol secreto */
.secret{display:flex;gap:16px;align-items:center}
.secret svg{width:90px;height:150px;flex:none}
.lh-part{fill:#1A1712;stroke:rgba(201,162,94,.12);transition:fill 1s}
.lh-part.on{fill:url(#lhG);stroke:rgba(232,211,168,.4)}
.lh-light{fill:rgba(255,236,190,.0)}.lh-light.on{fill:rgba(255,236,190,.55);filter:blur(2px)}
.lore{font-style:italic;color:var(--g2);font-size:16.5px;line-height:1.4}

/* CHEFES */
.boss{display:grid;grid-template-columns:200px 1fr;gap:22px;align-items:center}
.boss-sig{width:200px;height:200px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#2A0F0B,#0A0605 70%);box-shadow:0 0 0 1px rgba(192,88,74,.35),0 0 60px rgba(181,72,59,.25) inset;position:relative}
.boss-sig svg{width:150px;height:150px}
.boss-sig.hit{animation:hit .35s}
@keyframes hit{0%{transform:translate(0)}25%{transform:translate(-6px,2px)}50%{transform:translate(5px,-3px)}75%{transform:translate(-3px,1px)}100%{transform:none}}
.boss-sig .dmg{position:absolute;top:30%;left:50%;transform:translateX(-50%);font:700 30px 'Cinzel',serif;color:#FFD9A0;text-shadow:0 0 12px rgba(255,120,60,.8);animation:rise 1.1s forwards;pointer-events:none}
@keyframes rise{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-60px)}}
.hpbar{position:relative;height:18px;border-radius:5px;background:#1A0C0A;border:1px solid rgba(192,88,74,.45);overflow:hidden}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#5E1F19,#C0584A 70%,#E88A6E);transition:width .5s}
.hpbar b{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.35)}
.hpbar span{position:absolute;inset:0;display:grid;place-items:center;font:600 11px var(--mono);color:#FBE4DF;text-shadow:0 1px 2px #000}
.phases{display:flex;gap:6px;margin-top:8px}.phases span{flex:1;text-align:center;font:700 10px 'Cinzel',serif;letter-spacing:.1em;padding:4px;border-radius:5px;border:1px solid var(--ln);color:var(--dm)}
.phases span.on{border-color:#C0584A;color:#FBE4DF;background:rgba(181,72,59,.18)}.phases span.done{opacity:.4;text-decoration:line-through}
.blog{font-size:14.5px;color:var(--dm);max-height:150px;overflow-y:auto;display:flex;flex-direction:column;gap:3px}

/* ÁRVORE / CONSTRUÇÕES */
.tree-d{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:stretch}
.node{border:1px solid var(--ln);border-radius:12px;padding:10px;background:rgba(255,255,255,.015);display:flex;flex-direction:column;gap:6px;position:relative}
.node.on{border-color:var(--g);background:linear-gradient(180deg,rgba(201,162,94,.12),rgba(201,162,94,.02))}
.node.lock{opacity:.45}
.node b{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.06em;color:var(--g2)}
.node small{font-size:14px;color:var(--dm);line-height:1.3}
.node::after{content:"";position:absolute;right:-11px;top:50%;width:10px;height:1px;background:var(--ln2)}
.node:last-child::after{display:none}

/* OPERAÇÃO */
.op-days{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px}

<script>
/* OCEANUM — núcleo: utilitários, armazenamento, sincronização, rotas, eventos.
   Camadas: core (dados) → data (domínio) → intel (inteligência) → views (interface) → dominus (jogo) → app (arranque). */
(() => {
'use strict';
const OS = window.OS = { version: '2.0' };

/* ================= UTILITÁRIOS ================= */
const U = OS.U = {};
U.$ = (s, r = document) => r.querySelector(s);
U.$$ = (s, r = document) => [...r.querySelectorAll(s)];
U.uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-5);
U.pad = n => String(n).padStart(2, '0');
U.iso = d => d.getFullYear() + '-' + U.pad(d.getMonth() + 1) + '-' + U.pad(d.getDate());
U.today = () => U.iso(new Date());
U.parse = s => { const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
U.addDays = (s, n) => { const d = U.parse(s); d.setDate(d.getDate() + n); return U.iso(d); };
U.diff = (a, b) => Math.round((U.parse(a) - U.parse(b)) / 864e5); // a − b em dias
U.ym = s => String(s).slice(0, 7);
U.dim = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
U.addMonths = (ym, n) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return d.getFullYear() + '-' + U.pad(d.getMonth() + 1); };
U.monday = s => { const d = U.parse(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return U.iso(d); };
U.MES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
U.MESL = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
U.WD = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
U.WDS = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
U.fmtD = s => s ? String(s).slice(8, 10) + '/' + String(s).slice(5, 7) + '/' + String(s).slice(0, 4) : '—';
U.fmtDS = s => s ? +String(s).slice(8, 10) + ' ' + U.MES[+String(s).slice(5, 7) - 1] : '—';
U.fmtYM = ym => ym ? U.MES[+ym.slice(5, 7) - 1] + ' ' + ym.slice(2, 4) : '—';
U.fmtYML = ym => ym ? U.MESL[+ym.slice(5, 7) - 1] + ' ' + ym.slice(0, 4) : '—';
U.longDate = s => { const d = U.parse(s); return U.WD[d.getDay()] + ', ' + d.getDate() + ' de ' + U.MESL[d.getMonth()]; };
U.rel = s => { if (!s) return '—'; const d = U.diff(s, U.today()); if (d === 0) return 'hoje'; if (d === 1) return 'amanhã'; if (d === -1) return 'ontem'; return d > 0 ? 'em ' + d + ' dias' : 'há ' + (-d) + ' dias'; };
U.esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
U.num = v => { const n = typeof v === 'string' ? parseFloat(v.replace(',', '.')) : Number(v); return isFinite(n) ? n : 0; };
U.sum = (a, f = x => x) => a.reduce((s, x) => s + U.num(f(x)), 0);
U.avg = (a, f = x => x) => a.length ? U.sum(a, f) / a.length : 0;
U.r1 = v => Math.round(v * 10) / 10;
U.r2 = v => Math.round(v * 100) / 100;
U.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
U.nf = (v, d = 0) => (Number(v) || 0).toLocaleString('pt-PT', { minimumFractionDigits: d, maximumFractionDigits: d });
U.eur = (v, o = {}) => { const n = Number(v) || 0; const s = (o.sign && n > 0 ? '+' : '') + (n < 0 ? '−' : '') + '€ ' + Math.abs(n).toLocaleString('pt-PT', { minimumFractionDigits: o.dec ?? 2, maximumFractionDigits: o.dec ?? 2 }); return s; };
U.eurK = v => { const a = Math.abs(v); if (a >= 1e6) return (v < 0 ? '−' : '') + '€' + U.r1(a / 1e6) + 'M'; if (a >= 1e4) return (v < 0 ? '−' : '') + '€' + Math.round(a / 1e3) + 'k'; return (v < 0 ? '−' : '') + '€' + Math.round(a); };
U.pct = (v, d = 0) => (isFinite(v) ? (v * 100).toLocaleString('pt-PT', { maximumFractionDigits: d, minimumFractionDigits: d }) : '0') + '%';
U.mmss = sec => { sec = Math.round(sec || 0); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return (h ? h + ':' + U.pad(m) : m) + ':' + U.pad(s); };
U.parseDur = str => { if (str == null || str === '') return 0; if (typeof str === 'number') return str; const p = String(str).trim().split(':').map(Number); if (p.some(isNaN)) return 0; return p.length === 3 ? p[0] * 3600 + p[1] * 60 + p[2] : p.length === 2 ? p[0] * 60 + p[1] : p[0] * 60; };
U.hm = (d = new Date()) => U.pad(d.getHours()) + ':' + U.pad(d.getMinutes());
U.t2m = t => { if (!t) return null; const [h, m] = String(t).split(':').map(Number); return h * 60 + (m || 0); };
U.m2t = m => U.pad(Math.floor(m / 60) % 24) + ':' + U.pad(Math.round(m % 60));
U.hours = min => { const h = Math.floor(min / 60), m = Math.round(min % 60); return h ? h + 'h' + (m ? U.pad(m) : '') : m + 'min'; };
U.groupBy = (a, f) => a.reduce((o, x) => { const k = f(x); (o[k] = o[k] || []).push(x); return o; }, {});
U.sortBy = (a, f, dir = 1) => a.slice().sort((x, y) => { const a1 = f(x), b1 = f(y); return (a1 > b1 ? 1 : a1 < b1 ? -1 : 0) * dir; });
U.hash = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
U.rng = seed => { let a = typeof seed === 'number' ? seed : U.hash(String(seed)); return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; };
U.range = (a, b) => { const r = []; let d = a; while (d <= b) { r.push(d); d = U.addDays(d, 1); } return r; };
U.lastN = n => U.range(U.addDays(U.today(), -(n - 1)), U.today());
U.inRange = (d, a, b) => d && d >= a && d <= b;
U.deb = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
U.trend = (cur, prev) => prev ? (cur - prev) / Math.abs(prev) : (cur ? 1 : 0);
U.clone = o => JSON.parse(JSON.stringify(o));
U.ls = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }, del(k) { try { localStorage.removeItem(k); } catch (e) { } }, keys() { try { return Object.keys(localStorage); } catch (e) { return []; } } };

/* ================= EVENTOS ================= */
const handlers = {};
OS.on = (evt, fn) => { (handlers[evt] = handlers[evt] || []).push(fn); };
OS.emit = (evt, ...a) => { (handlers[evt] || []).forEach(f => { try { f(...a); } catch (e) { console.error(evt, e); } }); };

/* ================= ARMAZENAMENTO =================
   Cada coleção é um array de registos {id, _c, _u, _s, ...}. Persistência em documentos "coleção~shard"
   na base de dados do artifact (coleção "os"), com cópia local. Singletons em "one~chave". */
OS.D = {};
OS.ONE = {};
OS.ONE_DEF = {};
OS.SHARD = {};              // tamanho máximo de shard por coleção
const DEF_SHARD = 250, MAX_BYTES = 220000;
const dirty = new Set();
const pending = {};         // docId -> timer
const lastWrite = {}, applied = {};
let db = null, flushTimer = null;
OS.sync = { status: 'local', msg: 'A iniciar…' };

OS.all = c => OS.D[c] || (OS.D[c] = []);
OS.get = (c, id) => id ? OS.all(c).find(r => r.id === id) : undefined;
OS.find = (c, f) => OS.all(c).filter(f);
function pickShard(c) {
  const cap = OS.SHARD[c] || DEF_SHARD, cnt = {};
  OS.all(c).forEach(r => { cnt[r._s || 0] = (cnt[r._s || 0] || 0) + 1; });
  const keys = Object.keys(cnt).map(Number).sort((a, b) => a - b);
  for (const k of keys) if (cnt[k] < cap) return k;
  return keys.length ? Math.max(...keys) + 1 : 0;
}
OS.add = (c, o, opt = {}) => {
  const now = Date.now();
  const r = Object.assign({}, o, { id: o.id || U.uid(), _c: o._c || now, _u: now });
  r._s = pickShard(c);
  OS.all(c).push(r);
  mark(c + '~' + r._s);
  if (!opt.silent) OS.emit('add:' + c, r), OS.emit('change', c, r);
  OS.request();
  return r;
};
OS.upd = (c, id, patch, opt = {}) => {
  const r = OS.get(c, id); if (!r) return null;
  const before = Object.assign({}, r);
  Object.assign(r, patch, { _u: Date.now() });
  mark(c + '~' + (r._s || 0));
  if (!opt.silent) OS.emit('upd:' + c, r, before), OS.emit('change', c, r);
  OS.request();
  return r;
};
OS.del = (c, id) => {
  const a = OS.all(c), i = a.findIndex(r => r.id === id); if (i < 0) return;
  const [r] = a.splice(i, 1);
  mark(c + '~' + (r._s || 0));
  OS.emit('del:' + c, r); OS.emit('change', c, r);
  OS.request();
};
OS.one = k => OS.ONE[k] || (OS.ONE[k] = U.clone(OS.ONE_DEF[k] || {}));
OS.setOne = (k, patch) => { Object.assign(OS.one(k), patch); OS.touch(k); };
OS.touch = k => { mark('one~' + k); OS.emit('one:' + k); OS.request(); };

function mark(docId) { dirty.add(docId); clearTimeout(flushTimer); flushTimer = setTimeout(flush, 700); setStatus(db ? 'busy' : 'local'); }
function payloadFor(docId) {
  const [c, s] = docId.split('~');
  if (c === 'one') return { data: OS.one(s) };
  return { items: OS.all(c).filter(r => String(r._s || 0) === s) };
}
function flush() {
  // divide shards grandes demais
  [...dirty].forEach(id => {
    const [c, s] = id.split('~'); if (c === 'one') return;
    let items = OS.all(c).filter(r => String(r._s || 0) === s);
    let bytes = JSON.stringify(items).length;
    if (bytes > MAX_BYTES && items.length > 1) {
      const keys = new Set(OS.all(c).map(r => r._s || 0)); let n = Math.max(...keys) + 1;
      const half = items.slice(Math.floor(items.length / 2));
      half.forEach(r => { r._s = n; }); dirty.add(c + '~' + n);
    }
  });
  const ids = [...dirty]; dirty.clear();
  ids.forEach(id => {
    const p = payloadFor(id);
    U.ls.set('os2:' + id, p);
    if (db) write(id, p, 0);
  });
  if (!db) setStatus('local');
}
function write(id, p, tries) {
  const t = Date.now(); lastWrite[id] = t; pending[id] = (pending[id] || 0) + 1;
  db.doc('os/' + id).set(Object.assign({ t }, p)).then(() => {
    applied[id] = t; pending[id]--; if (!Object.values(pending).some(Boolean) && !dirty.size) setStatus('ok');
  }).catch(e => {
    pending[id]--;
    if (e && e.code === 'unavailable' && tries < 2) setTimeout(() => write(id, payloadFor(id), tries + 1), 900 + Math.random() * 900);
    else setStatus('err', e && e.code);
  });
}
function applyDoc(id, x) {
  const [c, s] = id.split('~');
  if (c === 'one') { OS.ONE[s] = x.data || {}; U.ls.set('os2:' + id, { data: OS.ONE[s] }); return; }
  const items = (x.items || []).map(r => Object.assign(r, { _s: +s }));
  OS.D[c] = OS.all(c).filter(r => String(r._s || 0) !== s).concat(items);
  U.ls.set('os2:' + id, { items });
}
function loadLocal() {
  let n = 0;
  U.ls.keys().filter(k => k.startsWith('os2:')).forEach(k => {
    const id = k.slice(4), v = U.ls.get(k); if (!v) return;
    const [c, s] = id.split('~');
    if (c === 'one') OS.ONE[s] = v.data || {};
    else { OS.D[c] = OS.all(c).filter(r => String(r._s || 0) !== s).concat((v.items || []).map(r => Object.assign(r, { _s: +s }))); }
    n++;
  });
  return n;
}
function setStatus(s, code) {
  OS.sync.status = s;
  OS.sync.msg = s === 'ok' ? 'Sincronizado' : s === 'busy' ? 'A guardar…' : s === 'err' ? 'Erro ao guardar' + (code ? ' (' + code + ')' : '') : 'Só neste dispositivo';
  OS.emit('sync', OS.sync);
}
OS.pushAll = () => {
  Object.keys(OS.D).forEach(c => { new Set(OS.all(c).map(r => r._s || 0)).forEach(s => dirty.add(c + '~' + s)); });
  Object.keys(OS.ONE).forEach(k => dirty.add('one~' + k));
  flush();
};
OS.exportAll = () => ({ version: OS.version, exported: new Date().toISOString(), D: OS.D, ONE: OS.ONE });
OS.importAll = obj => {
  if (!obj || !obj.D) throw new Error('formato');
  Object.keys(OS.D).forEach(c => new Set(OS.all(c).map(r => r._s || 0)).forEach(s => dirty.add(c + '~' + s)));
  OS.D = obj.D; OS.ONE = obj.ONE || {};
  OS.pushAll(); OS.request();
};

/* Arranque de dados: local → base de dados (vence) → migração/semente se vazio */
OS.boot = async (onReady) => {
  const hadLocal = loadLocal() > 0;
  let ready = false;
  const finish = async (empty) => {
    if (ready) return; ready = true;
    if (empty && !Object.keys(OS.D).some(c => OS.all(c).length)) {
      await OS.emitAsync('migrate');
      OS.emit('seed');
    }
    OS.emit('ready'); onReady();
  };
  try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { db = null; }
  if (!db) { setStatus('local'); finish(!hadLocal); return; }
  OS.dbRef = db;
  let first = true;
  const timeout = setTimeout(() => { if (first) { first = false; setStatus('err', 'sem resposta'); finish(!hadLocal); } }, 6000);
  db.collection('os').onSnapshot(snap => {
    let changed = false;
    snap.docs.forEach(d => {
      const id = d.id, x = d.data(); if (!x) return;
      if (pending[id] || dirty.has(id)) return;
      if (x.t === lastWrite[id] || x.t <= (applied[id] || 0)) return;
      applied[id] = x.t; applyDoc(id, x); changed = true;
    });
    if (first) {
      first = false; clearTimeout(timeout);
      if (snap.empty) { if (hadLocal) OS.pushAll(); finish(!hadLocal); }
      else { setStatus('ok'); finish(false); }
      return;
    }
    if (changed) { OS.emit('remote'); OS.request(); }
  }, e => setStatus('err', e && e.code));
};

/* ---- Tarefas ---- */
const Tasks = OS.Tasks = {};
Tasks.open = () => OS.all('tasks').filter(t => t.status !== 'Feita');
Tasks.late = t => t.status !== 'Feita' && t.due && t.due < U.today();
Tasks.afterSave = (r, isNew) => {
  if (r.status === 'Feita' && !r.doneAt) {
    OS.upd('tasks', r.id, { doneAt: U.today() }, { silent: true });
    if (r.recur && r.recur !== 'Não') {
      const base = r.due || r.sched || U.today();
      const next = r.recur === 'Diária' ? U.addDays(base, 1) : r.recur === 'Semanal' ? U.addDays(base, 7) : U.addMonths(U.ym(base), 1) + base.slice(7);
      const c = Object.assign({}, r); ['id', '_c', '_u', '_s', 'doneAt'].forEach(k => delete c[k]);
      OS.add('tasks', Object.assign(c, { status: 'Próxima', due: r.due ? next : '', sched: r.sched ? next : '' }), { silent: true });
    }
  }
  if (r.status !== 'Feita' && r.doneAt) OS.upd('tasks', r.id, { doneAt: '' }, { silent: true });
};
Tasks.complete = id => { const t = OS.get('tasks', id); if (!t) return; OS.upd('tasks', id, { status: 'Feita' }); Tasks.afterSave(OS.get('tasks', id)); };
Tasks.quickParse = str => { // "Rever balanço @Universidade !1 amanhã"
  const o = { ctx: [], status: 'Inbox', prio: '3', impact: 3, effort: '30' };
  let s = ' ' + str + ' ';
  s = s.replace(/\s@(\w+)/g, (m, c) => { const hit = L.CTX.find(x => x.slice(1).toLowerCase() === c.toLowerCase()); if (hit) o.ctx.push(hit); return ' '; });
  s = s.replace(/\s!([1-4])/g, (m, p) => { o.prio = p; return ' '; });
  if (/\shoje\s/i.test(s)) { o.sched = U.today(); o.status = 'Próxima'; s = s.replace(/\shoje\s/i, ' '); }
  if (/\samanhã\s/i.test(s)) { o.sched = U.addDays(U.today(), 1); o.status = 'Próxima'; s = s.replace(/\samanhã\s/i, ' '); }
  o.title = s.trim().replace(/\s+/g, ' ');
  if (o.ctx.includes('@Universidade') || o.ctx.includes('@Estudos')) o.area = 'Universidade';
  if (o.ctx.includes('@Mova')) o.area = 'Mova';
  if (o.ctx.includes('@Financeiro')) o.area = 'Finanças';
  if (o.ctx.includes('@Trabalho')) o.area = 'Trabalho';
  return o;
};

/* ---- Hábitos ---- */
const Hab = OS.Hab = {};
Hab.due = (h, d) => { if (!h.active) return false; const wd = U.parse(d).getDay(); if (h.freq === 'Dias úteis') return wd >= 1 && wd <= 5; return true; };
Hab.autoDone = (h, d) => {
  switch (h.auto) {
    case 'study100': return U.sum(OS.all('sessions').filter(s => s.date === d), s => s.minutes) >= 100;
    case 'workout': return OS.all('workouts').some(w => w.date === d) || OS.all('runs').some(r => r.date === d);
    case 'cash': return OS.all('transactions').some(t => t.date === d);
    case 'review': return OS.all('reviews').some(r => [r.r1At, r.r2At, r.r3At].includes(d));
    default: return false;
  }
};
Hab.done = (h, d) => !!(h.log && h.log[d]) || Hab.autoDone(h, d);
Hab.toggle = (id, d) => { const h = OS.get('habits', id); if (!h) return; const log = Object.assign({}, h.log || {}); if (log[d]) delete log[d]; else log[d] = 1; OS.upd('habits', id, { log }); };
Hab.streak = h => { let d = U.today(), s = 0; if (!Hab.done(h, d)) d = U.addDays(d, -1); for (let i = 0; i < 800; i++) { if (!Hab.due(h, d)) { d = U.addDays(d, -1); continue; } if (!Hab.done(h, d)) break; s++; d = U.addDays(d, -1); } return s; };
Hab.rate = (h, days) => { const ds = U.lastN(days).filter(d => Hab.due(h, d) && (!h._c || d >= U.iso(new Date(h._c)))); if (h.freq === 'X por semana') { const wks = Math.max(1, days / 7); const done = U.lastN(days).filter(d => Hab.done(h, d)).length; return Math.min(1, done / (wks * (U.num(h.perWeek) || 1))); } return ds.length ? ds.filter(d => Hab.done(h, d)).length / ds.length : 0; };
Hab.dayScore = d => { const hs = OS.all('habits').filter(h => h.active && Hab.due(h, d) && h.freq !== 'X por semana'); return hs.length ? hs.filter(h => Hab.done(h, d)).length / hs.length : null; };
Hab.perfectStreak = () => { const core = OS.all('habits').filter(h => h.active && h.core); if (!core.length) return 0; let d = U.today(), s = 0; const ok = x => core.filter(h => Hab.due(h, x)).every(h => Hab.done(h, x)); if (!ok(d)) d = U.addDays(d, -1); for (let i = 0; i < 800 && ok(d); i++) { s++; d = U.addDays(d, -1); } return s; };

/* ---- Finanças ---- */
const Fin = OS.Fin = {};
Fin.cats = type => OS.one('fin').cats[type] || {};
Fin.accBal = (a, upTo) => {
  let b = U.num(a.opening);
  OS.all('transactions').forEach(t => { if (upTo && t.date > upTo) return; if (t.date > U.today() && !upTo) return; const v = U.num(t.amount);
    if (t.type === 'Receita' && t.account === a.id) b += v; else if (t.type === 'Despesa' && t.account === a.id) b -= v;
    else if (t.type === 'Transferência') { if (t.account === a.id) b -= v; if (t.toAccount === a.id) b += v; } });
  OS.all('invtx').forEach(t => { if (t.account !== a.id) return; if (upTo && t.date > upTo) return; const gross = ['Compra', 'Venda'].includes(t.type) ? U.num(t.qty) * U.num(t.price) : U.num(t.amount);
    const fx = Inv.fx((OS.get('assets', t.asset) || {}).currency);
    if (t.type === 'Compra') b -= gross * fx + U.num(t.fees); else if (t.type === 'Venda') b += gross * fx - U.num(t.fees); else if (t.type === 'Taxa') b -= U.num(t.amount) + U.num(t.fees); else b += U.num(t.amount) * fx - U.num(t.fees); });
  return b;
};
Fin.accounts = () => OS.all('accounts').filter(a => !a.archived);
Fin.liquid = () => U.sum(Fin.accounts().filter(a => ['Conta à ordem', 'Dinheiro', 'Poupança'].includes(a.type)), a => Fin.accBal(a));
Fin.reserve = () => U.sum(Fin.accounts().filter(a => a.type === 'Reserva'), a => Fin.accBal(a));
Fin.cardDebt = () => -U.sum(Fin.accounts().filter(a => a.type === 'Cartão de crédito'), a => Math.min(0, Fin.accBal(a)));
Fin.debtBal = d => Math.max(0, U.num(d.principal) - U.sum(OS.all('transactions').filter(t => t.debt === d.id && t.date <= U.today()), t => t.amount));
Fin.debtsTotal = () => U.sum(OS.all('debts'), Fin.debtBal);
Fin.cashTotal = () => U.sum(OS.all('accounts'), a => Fin.accBal(a));
Fin.netWorth = () => Fin.cashTotal() + Inv.value() - Fin.debtsTotal();
Fin.tx = (from, to, f = {}) => OS.all('transactions').filter(t => t.date >= from && t.date <= to && (!f.type || t.type === f.type) && (!f.cat || t.cat === f.cat) && (!f.account || t.account === f.account || t.toAccount === f.account) && (!f.method || t.method === f.method) && (!f.tag || (t.tags || []).includes(f.tag)) && (!f.q || ((t.desc || '') + ' ' + (t.note || '') + ' ' + (t.cat || '') + ' ' + (t.sub || '')).toLowerCase().includes(f.q.toLowerCase())));
Fin.isInvestAcc = id => { const a = OS.get('accounts', id); return a && ['Corretora', 'Reserva', 'Poupança'].includes(a.type); };
Fin.month = ym => {
  const from = ym + '-01', to = ym + '-' + U.pad(U.dim(ym)), txs = Fin.tx(from, to);
  const inc = U.sum(txs.filter(t => t.type === 'Receita'), t => t.amount), exp = U.sum(txs.filter(t => t.type === 'Despesa'), t => t.amount);
  const saved = U.sum(txs.filter(t => t.type === 'Transferência' && Fin.isInvestAcc(t.toAccount) && !Fin.isInvestAcc(t.account)), t => t.amount);
  const sup = U.sum(txs.filter(t => t.type === 'Despesa' && t.ess === 'Supérfluo'), t => t.amount);
  return { ym, inc, exp, net: inc - exp, rate: inc ? (inc - exp) / inc : 0, investRate: inc ? saved / inc : 0, saved, sup, n: txs.length, txs };
};
Fin.months = n => Array.from({ length: n }, (_, i) => U.addMonths(U.ym(U.today()), i - n + 1));
Fin.byCat = (from, to, type = 'Despesa', f = {}) => { const o = {}; Fin.tx(from, to, Object.assign({}, f, { type })).forEach(t => { o[t.cat || 'Sem categoria'] = (o[t.cat || 'Sem categoria'] || 0) + U.num(t.amount); }); return Object.entries(o).map(([l, v]) => ({ l, v })).sort((a, b) => b.v - a.v); };
Fin.spentCat = (cat, ym) => U.sum(Fin.tx(ym + '-01', ym + '-31', { type: 'Despesa', cat }), t => t.amount);
Fin.recurDue = (r, ym) => { // data de vencimento no mês (mensal/anual)
  if (!r.active) return null; if (r.freq === 'Anual' && +r.month !== +ym.slice(5, 7)) return null;
  if (r.freq === 'Semanal') return null;
  const d = ym + '-' + U.pad(Math.min(U.dim(ym), U.num(r.day) || 1));
  if (r.start && d < r.start.slice(0, 7) + '-01') return null; if (r.end && d > r.end) return null; return d;
};
Fin.recurPaid = (r, ym) => OS.all('transactions').some(t => t.recurring === r.id && U.ym(t.date) === ym);
Fin.upcoming = (days = 30) => { // compromissos futuros: recorrentes por pagar + parcelas + prestações
  const t0 = U.today(), t1 = U.addDays(t0, days), out = [];
  OS.all('recurring').forEach(r => { [U.ym(t0), U.ym(t1)].filter((v, i, a) => a.indexOf(v) === i).forEach(ym => { const d = Fin.recurDue(r, ym); if (d && d <= t1 && !Fin.recurPaid(r, ym) && (d >= U.addDays(t0, -10))) out.push({ date: d, title: r.name, amount: r.type === 'Receita' ? U.num(r.amount) : -U.num(r.amount), kind: r.kind, rec: r, late: d < t0 }); }); });
  OS.all('transactions').filter(t => t.date > t0 && t.date <= t1).forEach(t => out.push({ date: t.date, title: (t.desc || t.cat) + (t.instN ? ` (${t.instI}/${t.instN})` : ''), amount: t.type === 'Receita' ? U.num(t.amount) : t.type === 'Despesa' ? -U.num(t.amount) : 0, kind: t.instN ? 'Parcela' : 'Agendado', tx: t }));
  OS.all('debts').forEach(d => { if (!U.num(d.dueDay) || !U.num(d.installment) || Fin.debtBal(d) <= 0) return; [U.ym(t0), U.ym(t1)].filter((v, i, a) => a.indexOf(v) === i).forEach(ym => { const dt = ym + '-' + U.pad(Math.min(U.dim(ym), U.num(d.dueDay))); const paid = OS.all('transactions').some(t => t.debt === d.id && U.ym(t.date) === ym); if (!paid && dt >= U.addDays(t0, -10) && dt <= t1) out.push({ date: dt, title: 'Prestação · ' + d.name, amount: -U.num(d.installment), kind: 'Dívida', debt: d, late: dt < t0 }); }); });
  return U.sortBy(out, x => x.date);
};
Fin.payRecurring = (r, ym) => { const d = Fin.recurDue(r, ym) || U.today(); return OS.add('transactions', { type: r.type, amount: U.num(r.amount), date: d > U.today() ? U.today() : d, desc: r.name, account: r.account || (Fin.accounts()[0] || {}).id, cat: r.cat, sub: r.sub, method: r.method, ess: r.ess, recurring: r.id, tags: [] }); };
Fin.afterTx = (r, isNew) => {
  if (isNew && r.type === 'Despesa' && U.num(r.inst) > 1 && !r.instG) {
    const n = Math.round(U.num(r.inst)), per = U.r2(U.num(r.amount) / n), g = U.uid();
    OS.upd('transactions', r.id, { amount: per, instG: g, instI: 1, instN: n, inst: '' }, { silent: true });
    for (let i = 2; i <= n; i++) { const ym = U.addMonths(U.ym(r.date), i - 1); const d = ym + '-' + U.pad(Math.min(U.dim(ym), +r.date.slice(8, 10))); const c = Object.assign({}, r); ['id', '_c', '_u', '_s'].forEach(k => delete c[k]); OS.add('transactions', Object.assign(c, { amount: per, date: d, instG: g, instI: i, instN: n, inst: '' }), { silent: true }); }
    OS.UI.toast(`${n} parcelas de ${U.eur(per)} criadas`, 'pos');
  }
  if (isNew && r.type === 'Despesa' && r.ess === 'Supérfluo') OS.UI.toast('Supérfluo registado. Regra: o mesmo valor vai para a poupança.', 'warn');
  const b = OS.all('budgets').find(x => x.cat === r.cat);
  if (b && r.type === 'Despesa') { const sp = Fin.spentCat(r.cat, U.ym(r.date)); if (sp > U.num(b.limit)) setTimeout(() => OS.UI.toast(`Orçamento de ${r.cat} ultrapassado: ${U.eur(sp)} de ${U.eur(b.limit)}`, 'neg'), 900); }
};
Fin.avgMonthly = (months = 3, field = 'exp') => { const ms = Fin.months(months + 1).slice(0, -1); const vals = ms.map(m => Fin.month(m)[field]).filter((v, i) => Fin.month(ms[i]).n > 0); return vals.length ? U.avg(vals) : null; };
Fin.fixedMonthly = () => U.sum(OS.all('recurring').filter(r => r.active && r.type === 'Despesa'), r => r.freq === 'Anual' ? U.num(r.amount) / 12 : r.freq === 'Semanal' ? U.num(r.amount) * 52 / 12 : U.num(r.amount));
Fin.recurIncome = () => U.sum(OS.all('recurring').filter(r => r.active && r.type === 'Receita'), r => r.freq === 'Anual' ? U.num(r.amount) / 12 : r.freq === 'Semanal' ? U.num(r.amount) * 52 / 12 : U.num(r.amount));
Fin.hourly = () => { const p = OS.one('profile'); if (U.num(p.hourly)) return U.num(p.hourly); const sh = OS.all('shifts').filter(s => U.num(s.rate)); return sh.length ? U.avg(sh, s => s.rate) : 0; };
Fin.snapshot = () => { // guarda um retrato mensal do patrimônio (um por mês, atualizado no máximo 1×/dia)
  const ym = U.ym(U.today()), cur = OS.all('snapshots').find(s => s.ym === ym);
  const v = { ym, date: U.today(), nw: U.r2(Fin.netWorth()), cash: U.r2(Fin.cashTotal()), inv: U.r2(Inv.value()), invested: U.r2(Inv.cost()), debt: U.r2(Fin.debtsTotal()) };
  if (!OS.all('accounts').length && !OS.all('assets').length) return;

};
Fin.nwSeries = () => U.sortBy(OS.all('snapshots'), s => s.ym);

/* ---- Investimentos ---- */
const Inv = OS.Inv = {};
Inv.fx = cur => { if (!cur || cur === 'EUR') return 1; const v = U.num((OS.one('profile').fx || {})[cur]); return v || 1; };
Inv.fxMissing = () => [...new Set(OS.all('assets').map(a => a.currency).filter(c => c && c !== 'EUR' && !U.num((OS.one('profile').fx || {})[c])))];
Inv.pos = a => {
  let qty = 0, cost = 0, realized = 0, divs = 0, fees = 0, bought = 0;

};
Inv.value = () => U.sum(OS.all('assets'), a => Inv.pos(a).value);
