Inv.divs = (from, to) => U.sum(OS.all('invtx').filter(t => (t.type === 'Dividendo' || t.type === 'Juros') && (!from || t.date >= from) && (!to || t.date <= to)), t => U.num(t.amount) * Inv.fx((OS.get('assets', t.asset) || {}).currency));
Inv.byKey = key => { const o = {}; OS.all('assets').forEach(a => { const v = Inv.pos(a).value; if (v > 0) o[a[key] || 'Sem dados'] = (o[a[key] || 'Sem dados'] || 0) + v; }); return Object.entries(o).map(([l, v]) => ({ l, v })).sort((a, b) => b.v - a.v); };
Inv.contribByMonth = n => Fin.months(n).map(ym => U.sum(OS.all('invtx').filter(t => U.ym(t.date) === ym && t.type === 'Compra'), t => U.num(t.qty) * U.num(t.price) * Inv.fx((OS.get('assets', t.asset) || {}).currency)) - U.sum(OS.all('invtx').filter(t => U.ym(t.date) === ym && t.type === 'Venda'), t => U.num(t.qty) * U.num(t.price) * Inv.fx((OS.get('assets', t.asset) || {}).currency)));
/* Fornecedores de cotações. Só "manual" funciona neste ambiente: a página não pode chamar APIs externas.
   Para automatizar: adicionar um conector MCP de dados de mercado no claude.ai e registar aqui um fornecedor. */
Inv.providers = { manual: { name: 'Manual', available: true, note: 'Atualizas o preço em Cotações. A data mostra se está desatualizado.' },
  mcp: { name: 'Conector de mercado (MCP)', available: false, note: 'Precisa de um conector de dados de mercado ligado ao claude.ai (não existe nenhum nesta conta).' },
  api: { name: 'API direta (ex.: Alpha Vantage, Twelve Data)', available: false, note: 'Bloqueado aqui: a página só pode comunicar com a própria base de dados. Exige um serviço intermédio com chave de API.' } };

/* ---- Universidade ---- */
const St = OS.St = {};
St.current = () => OS.all('subjects').filter(s => s.status === 'Em curso');
St.contrib = a => a.grade === '' || a.grade == null ? 0 : U.num(a.grade) * U.num(a.weight) / 100;
St.stats = s => {
  const ses = OS.all('sessions').filter(x => x.subject === s.id), mins = U.sum(ses, x => x.minutes);
  const graded = OS.all('assessments').filter(a => a.subject === s.id && a.grade !== '' && a.grade != null);
  const w = U.sum(graded, a => a.weight), acc = U.sum(graded, St.contrib), avg = w ? U.r1(acc * 100 / w) : 0;
  const tgt = U.num(s.target) || 15, wk = U.monday(U.today());
  const minWk = U.sum(ses.filter(x => x.date >= wk), x => x.minutes);
  const sit = !avg ? ['Sem notas', ''] : avg >= tgt ? ['Acima do alvo', 'pos'] : avg >= 10 ? ['Abaixo do alvo', 'warn'] : ['Risco de reprovar', 'neg'];
  const topics = OS.all('topics').filter(t => t.subject === s.id), dom = topics.filter(t => ['Revisto', 'Dominado'].includes(t.status)).length;
  const next = U.sortBy(OS.all('assessments').filter(a => a.subject === s.id && a.date >= U.today() && a.prep !== 'Feito'), a => a.date)[0];
  return { mins, hours: U.r1(mins / 60), avg, w, tgt, sit, minWk, hWk: U.r1(minWk / 60), targetWk: U.num(s.hoursWeek), topics: topics.length, topicsDone: dom, next, errors: OS.all('errors').filter(e => e.subject === s.id && !e.redone).length, last: U.sortBy(ses, x => x.date).pop() };
};
St.gpa = () => { const sub = OS.all('subjects').filter(s => U.num(s.final) > 0); if (sub.length) return U.r1(U.sum(sub, s => U.num(s.final) * (U.num(s.ects) || 6)) / U.sum(sub, s => U.num(s.ects) || 6)); const cur = St.current().map(s => St.stats(s)).filter(x => x.avg); return cur.length ? U.r1(U.avg(cur, x => x.avg)) : 0; };
St.ectsDone = () => U.sum(OS.all('subjects').filter(s => s.status === 'Aprovada'), s => s.ects);
St.revNext = r => { if (!r.studied) return ''; if (!r.r1) return U.addDays(r.studied, 1); if (!r.r2) return U.addDays(r.studied, 7); if (!r.r3) return U.addDays(r.studied, 30); return ''; };
St.revState = r => { if (r.r1 && r.r2 && r.r3) return ['Ciclo completo', 'pos']; const n = St.revNext(r); if (!n) return ['—', '']; return n < U.today() ? ['Atrasada', 'neg'] : n === U.today() ? ['Hoje', 'warn'] : ['Em dia', '']; };
St.revDue = () => OS.all('reviews').filter(r => { const n = St.revNext(r); return n && n <= U.today(); });
St.revDone = id => { const r = OS.get('reviews', id); if (!r) return; const p = !r.r1 ? { r1: true, r1At: U.today() } : !r.r2 ? { r2: true, r2At: U.today() } : { r3: true, r3At: U.today() }; OS.upd('reviews', id, p); };
St.topicAfter = t => { if (['Estudado', 'Revisto', 'Dominado'].includes(t.status)) { if (!t.studiedAt) OS.upd('topics', t.id, { studiedAt: U.today() }, { silent: true }); if (!OS.all('reviews').some(r => r.topicId === t.id)) { OS.add('reviews', { topic: t.title, subject: t.subject, studied: t.studiedAt || U.today(), topicId: t.id, mastery: 'Fraco' }, { silent: true }); OS.UI.toast('Revisões R1/R2/R3 agendadas', 'pos'); } } };
St.assessAlert = a => { if (!a.date || a.prep === 'Feito') return null; const d = U.diff(a.date, U.today()); return d < 0 ? ['Passou', ''] : d <= 7 ? ['Zona vermelha', 'neg'] : d <= 14 ? ['Modo exame', 'warn'] : ['Em preparação', '']; };
/* O que estudar hoje: revisões vencidas → provas próximas → disciplinas atrasadas no alvo semanal → conteúdos por estudar */
St.today = () => {
  const out = [], t = U.today();
  St.revDue().forEach(r => out.push({ score: 100 + U.diff(t, St.revNext(r)) * 5, kind: 'Revisão', title: r.topic, subject: r.subject, why: St.revNext(r) < t ? 'Revisão atrasada ' + U.diff(t, St.revNext(r)) + ' dia(s)' : 'Revisão ' + (!r.r1 ? 'R1' : !r.r2 ? 'R2' : 'R3') + ' vence hoje', act: `data-act="revDone" data-id="${r.id}"`, actL: 'Marcar feita', mins: 20 }));
  OS.all('assessments').filter(a => a.date >= t && a.prep !== 'Feito' && a.prep !== 'Pronto').forEach(a => { const d = U.diff(a.date, t); if (d > 21) return; const w = U.num(a.weight) || 20; out.push({ score: 90 - d * 3 + w / 2 + (a.prep === 'Não comecei' ? 15 : 0), kind: a.type, title: 'Preparar: ' + a.title, subject: a.subject, why: `Faltam ${d} dias · peso ${w}% · ${a.prep}` + (d <= 14 ? ' · modo exame: exercícios e exames antigos' : ''), mins: d <= 7 ? 100 : 50 }); });
  St.current().forEach(s => { const x = St.stats(s); if (!x.targetWk) return; const wd = (new Date().getDay() + 6) % 7 + 1; const expected = x.targetWk * 60 * wd / 7; if (x.minWk < expected - 30) out.push({ score: 50 + (expected - x.minWk) / 10, kind: 'Ritmo', title: s.name, subject: s.id, why: `${x.hWk} h de ${x.targetWk} h esta semana (esperado ${U.r1(expected / 60)} h até hoje)`, mins: Math.min(100, Math.round(expected - x.minWk)) }); });

  return out.sort((a, b) => b.score - a.score);
};
St.weekMins = (from = U.monday(U.today())) => U.sum(OS.all('sessions').filter(s => s.date >= from && s.date <= U.addDays(from, 6)), s => s.minutes);
St.targetWeek = () => U.sum(St.current(), s => s.hoursWeek);

/* ---- Treino ---- */
const Fit = OS.Fit = {};
Fit.sets = w => (w.items || []).reduce((a, it) => a + (it.sets || []).filter(s => U.num(s.reps)).length, 0);

Fit.e1rm = (kg, reps) => reps > 0 && kg > 0 ? kg * (1 + Math.min(reps, 12) / 30) : 0;
Fit.muscleSets = (from, to) => { const o = {}; L.MUSCLES.forEach(m => o[m] = 0); OS.all('workouts').filter(w => w.date >= from && w.date <= to).forEach(w => (w.items || []).forEach(it => { const ex = OS.get('exercises', it.ex); if (!ex) return; const n = (it.sets || []).filter(s => U.num(s.reps)).length; o[ex.muscle] = (o[ex.muscle] || 0) + n; (ex.secondary || []).forEach(m => o[m] = (o[m] || 0) + n * .5); })); return o; };
Fit.muscleVolume = (m, from, to) => { let v = 0; OS.all('workouts').filter(w => w.date >= from && w.date <= to).forEach(w => (w.items || []).forEach(it => { const ex = OS.get('exercises', it.ex); if (ex && ex.muscle === m) v += (it.sets || []).reduce((b, s) => b + U.num(s.kg) * U.num(s.reps), 0); })); return v; };
Fit.exHistory = exId => { const out = []; U.sortBy(OS.all('workouts'), w => w.date).forEach(w => (w.items || []).forEach(it => { if (it.ex !== exId) return; const sets = (it.sets || []).filter(s => U.num(s.reps)); if (!sets.length) return; const best = Math.max(...sets.map(s => Fit.e1rm(U.num(s.kg), U.num(s.reps)))); const top = Math.max(...sets.map(s => U.num(s.kg))); out.push({ date: w.date, e1rm: U.r1(best), top, vol: U.sum(sets, s => U.num(s.kg) * U.num(s.reps)), sets: sets.length }); })); return out; };
Fit.prs = () => { const out = []; OS.all('exercises').forEach(ex => { const h = Fit.exHistory(ex.id); if (!h.length) return; let best = 0; h.forEach(x => { if (x.top > best) { if (best > 0) out.push({ date: x.date, ex, kg: x.top }); best = x.top; } }); }); return U.sortBy(out, x => x.date, -1); };

  const setRow = s => `<div class="set-row"><input type="number" step="any" inputmode="decimal" placeholder="kg" value="${s.kg ?? ''}" data-s="kg"><input type="number" inputmode="numeric" placeholder="reps" value="${s.reps ?? ''}" data-s="reps"><input type="number" step="0.5" placeholder="RPE" value="${s.rpe ?? ''}" data-s="rpe"><input type="number" placeholder="desc. s" value="${s.rest ?? ''}" data-s="rest"><button type="button" class="icon-btn" data-set-del aria-label="Remover série">${OS.UI.ic('x')}</button></div>`;
  const block = it => `<div class="ex-block"><div class="row gap8"><select class="ex-sel">${opt(it.ex)}</select><button type="button" class="icon-btn" data-ex-del aria-label="Remover exercício">${OS.UI.ic('trash')}</button></div><div class="set-head"><span>kg</span><span>reps</span><span>RPE</span><span>descanso</span><span></span></div><div class="sets">${(it.sets && it.sets.length ? it.sets : [{}]).map(setRow).join('')}</div><button type="button" class="btn ghost sm" data-set-add>${OS.UI.ic('plus')}Série</button></div>`;

Fit.readEditor = form => [...form.querySelectorAll('.ex-block')].map(b => ({ ex: b.querySelector('.ex-sel').value, sets: [...b.querySelectorAll('.set-row')].map(r => { const o = {}; r.querySelectorAll('[data-s]').forEach(i => { if (i.value !== '') o[i.dataset.s] = U.num(i.value); }); return o; }).filter(s => s.reps || s.kg) })).filter(it => it.ex);
document.addEventListener('click', e => {

/* ---- Corrida ---- */
const Run = OS.Run = {};
Run.pace = r => U.num(r.km) ? U.parseDur(r.time) / U.num(r.km) : 0; // s/km
Run.paceStr = s => s ? U.mmss(s) + ' /km' : '—';

Run.kmIn = (from, to) => U.sum(OS.all('runs').filter(r => r.date >= from && r.date <= to), r => r.km);
Run.best = dist => { const c = OS.all('runs').filter(r => U.num(r.km) >= dist * .98 && U.parseDur(r.time)); if (!c.length) return null; const b = c.reduce((a, r) => Run.pace(r) < Run.pace(a) ? r : a); return { run: b, est: Run.pace(b) * dist, exact: Math.abs(U.num(b.km) - dist) < .2 }; };
Run.longest = () => OS.all('runs').reduce((a, r) => !a || U.num(r.km) > U.num(a.km) ? r : a, null);
Run.weeks = n => Array.from({ length: n }, (_, i) => U.addDays(U.monday(U.today()), -7 * (n - 1 - i)));

/* ---- Trabalho, carreira, capital ---- */
const Car = OS.Car = {};
Car.shiftHours = s => { const a = U.t2m(s.start), b = U.t2m(s.end); if (a == null || b == null) return 0; let m = b - a; if (m < 0) m += 1440; return Math.max(0, (m - U.num(s.breakMin)) / 60); };
Car.shiftPay = s => Car.shiftHours(s) * (U.num(s.rate) || U.num(OS.one('profile').hourly));
Car.capital = (asOf = U.today()) => {
  const before = r => { const d = r.date || r.start || r.last || (r._c ? U.iso(new Date(r._c)) : ''); return !d || d <= asOf; };
  const skills = OS.all('skills').filter(before), certs = OS.all('learn').filter(l => l.kind === 'Certificação' && l.status === 'Concluído' && (!l.end || l.end <= asOf));
  const learnDone = OS.all('learn').filter(l => l.status === 'Concluído' && l.kind !== 'Certificação' && (!l.end || l.end <= asOf));
  const exps = OS.all('experiences').filter(e => !e.start || e.start <= asOf);
  const months = U.sum(exps.filter(e => e.kind === 'Emprego' || e.kind === 'Voluntariado'), e => { const a = e.start || asOf, b = e.end && e.end < asOf ? e.end : asOf; return Math.max(0, U.diff(b, a) / 30.4); });
  const contacts = OS.all('contacts').filter(before), active = contacts.filter(c => c.last && U.diff(asOf, c.last) <= 90 && c.last <= asOf);
  const apps = OS.all('applications').filter(a => a.date && a.date <= asOf), interviews = apps.filter(a => ['Entrevista', 'Proposta', 'Aceite'].includes(a.status));
  const projects = OS.all('projects').filter(p => p.status === 'Concluído' && ['Profissional', 'Empresarial', 'Aprendizagem'].includes(p.type));
  const events = exps.filter(e => ['Evento', 'Palestra', 'Competição'].includes(e.kind));
  const learnH = U.sum(OS.all('sessions').filter(s => s.skill && s.date <= asOf), s => s.minutes) / 60;
  const dims = { 'Competências': Math.min(1, U.sum(skills, s => U.num(s.level)) / 40), 'Certificações': Math.min(1, certs.length / 6), 'Experiência': Math.min(1, months / 36), 'Rede': Math.min(1, (contacts.length + active.length * 2) / 90), 'Projetos & eventos': Math.min(1, (projects.length * 2 + events.length) / 12), 'Aprendizagem': Math.min(1, (learnH / 150) + learnDone.length / 20), 'Mercado': Math.min(1, (apps.length + interviews.length * 3) / 30) };

  return { dims, score, skills: skills.length, certs: certs.length, months: U.r1(months), contacts: contacts.length, active: active.length, apps: apps.length, interviews: interviews.length, projects: projects.length, events: events.length, learnH: U.r1(learnH) };
};

/* ---- Mova ---- */
const Mv = OS.Mv = {};

Mv.month = ym => { const sales = OS.all('mvsales').filter(s => U.ym(s.date) === ym && s.status !== 'Cancelado'), exps = OS.all('mvexp').filter(e => U.ym(e.date) === ym);
  const rev = U.sum(sales, Mv.rev), cogs = U.sum(sales, Mv.cost), opex = U.sum(exps, e => e.amount), gross = rev - cogs, profit = gross - opex;
  const mk = OS.all('mvmkt').filter(m => U.ym(m.date) === ym), mkCost = U.sum(mk, m => m.cost) + U.sum(exps.filter(e => e.cat === 'Marketing'), e => e.amount);
  const newClients = OS.all('mvclients').filter(c => c.since && U.ym(c.since) === ym && ['Ativo', 'Inativo'].includes(c.status)).length;
  return { ym, rev, cogs, opex, gross, profit, margin: rev ? profit / rev : 0, grossMargin: rev ? gross / rev : 0, n: sales.length, ticket: sales.length ? rev / sales.length : 0, mkCost, cac: newClients ? mkCost / newClients : null, newClients, pending: U.sum(OS.all('mvsales').filter(s => s.status === 'Pendente'), Mv.rev) };
};
Mv.total = () => U.sum(OS.all('mvsales').filter(s => s.status !== 'Cancelado'), Mv.rev);

/* ---- Metas ---- */
const Goal = OS.Goal = {};
Goal.lower = g => g.metric === 'run5k';
Goal.value = g => {
  const since = g.start || '0000';
  switch (g.metric) {
    case 'account': { const a = OS.get('accounts', g.account); return a ? Fin.accBal(a) : 0; }

  const t = old.t || {};

<script>

(() => {
'use strict';
const U = OS.U, Fin = OS.Fin, St = OS.St, Goal = OS.Goal, Proj = OS.Proj, Run = OS.Run, Hab = OS.Hab, Mv = OS.Mv;
const I = OS.Intel = {};

/* ================= CONTROL ROOM ================= */
I.alerts = () => {
  const t = U.today(), out = [], wd = new Date().getDay(), hour = new Date().getHours();
  const A = (lvl, area, title, detail, href, act) => out.push({ lvl, area, title, detail, href, act });
  // Finanças: contas a pagar
  Fin.upcoming(10).forEach(x => {
    if (x.amount >= 0) return; const d = U.diff(x.date, t);
    const act = x.rec ? { l: 'Registar pagamento', a: `data-act="payRec" data-id="${x.rec.id}"` } : x.debt ? { l: 'Registar prestação', a: `data-act="payDebt" data-id="${x.debt.id}"` } : null;
    if (x.late) A('urgent', 'Finanças', `${x.title} em atraso`, `${U.eur(-x.amount)} · venceu a ${U.fmtDS(x.date)}`, '#financas.recorrentes', act);
    else if (d <= 3 && x.kind !== 'Parcela' && x.kind !== 'Agendado') A('urgent', 'Finanças', `${x.title} vence ${U.rel(x.date)}`, U.eur(-x.amount) + ' · ' + x.kind, '#financas.recorrentes', act);
    else if (d <= 7 && x.kind !== 'Parcela' && x.kind !== 'Agendado') A('attention', 'Finanças', `${x.title} vence ${U.rel(x.date)}`, U.eur(-x.amount), '#financas.recorrentes', act);
  });
  Fin.accounts().forEach(a => { const b = Fin.accBal(a); if (a.type === 'Cartão de crédito') { if (U.num(a.limit) && -b > U.num(a.limit) * .8) A('attention', 'Finanças', `Cartão ${a.name} perto do limite`, `${U.eur(-b)} de ${U.eur(a.limit)}`, '#financas.contas'); } else if (b < 0) A('urgent', 'Finanças', `Saldo negativo em ${a.name}`, U.eur(b), '#financas.contas'); });
  const need14 = -U.sum(Fin.upcoming(14).filter(x => x.amount < 0 && !x.tx), x => x.amount), liq = Fin.liquid();
  if (OS.all('accounts').length && need14 > 0 && liq < need14) A('urgent', 'Finanças', 'Saldo disponível não cobre os compromissos', `Disponível ${U.eur(liq)} · a pagar em 14 dias ${U.eur(need14)}`, '#financas');
  const ym = U.ym(t);
  OS.all('budgets').forEach(b => { const sp = Fin.spentCat(b.cat, ym), lim = U.num(b.limit); if (!lim) return; const day = +t.slice(8), dim = U.dim(ym);
    if (sp > lim) A('urgent', 'Finanças', `Orçamento de ${b.cat} ultrapassado`, `${U.eur(sp)} de ${U.eur(lim)} (+${U.eur(sp - lim)})`, '#financas.orcamento');
    else if (sp > lim * .85) A('attention', 'Finanças', `Orçamento de ${b.cat} quase esgotado`, `${U.eur(sp)} de ${U.eur(lim)} · faltam ${dim - day} dias`, '#financas.orcamento');
    else if (day >= 7 && sp / day * dim > lim * 1.1) A('attention', 'Finanças', `${b.cat}: ritmo acima do orçamento`, `Ao ritmo atual (estimativa) fechas o mês em ${U.eur(sp / day * dim)}`, '#financas.orcamento'); });
  I.finAnoms().slice(0, 3).forEach(x => A('attention', 'Finanças', x.title, x.detail, '#financas.inteligencia'));
  OS.all('wishlist').filter(w => w.status === 'Em espera' && Date.now() >= I.wishUntil(w)).forEach(w => A('attention', 'Finanças', `Decidir compra: ${w.product}`, `Espera cumprida · ${U.eur(w.price)}`, '#compras'));
  const mo = Fin.month(ym); if (+t.slice(8) >= 20 && mo.n && mo.net < 0) A('attention', 'Finanças', 'Mês em défice', `Receitas ${U.eur(mo.inc)} · despesas ${U.eur(mo.exp)}`, '#financas');
  // Tarefas
  const late = OS.Tasks.open().filter(OS.Tasks.late);
  const lateHigh = late.filter(x => +x.prio <= 2), lateLow = late.filter(x => +x.prio > 2);
  lateHigh.slice(0, 4).forEach(x => A('urgent', 'Tarefas', x.title, `Atrasada ${U.diff(t, x.due)} dia(s) · prioridade ${OS.L.PRIO.find(p => p[0] === x.prio)[1].toLowerCase()}`, '', { l: 'Concluir', a: `data-act="taskDone" data-id="${x.id}"` }));
  if (lateLow.length) A('attention', 'Tarefas', `${lateLow.length} tarefa(s) atrasada(s) de prioridade média/baixa`, lateLow.slice(0, 3).map(x => x.title).join(' · '), '#tarefas');
  OS.Tasks.open().filter(x => x.due === t).forEach(x => A('attention', 'Tarefas', x.title, 'Prazo hoje', '', { l: 'Concluir', a: `data-act="taskDone" data-id="${x.id}"` }));

  OS.all('assessments').filter(a => a.date >= t && !['Feito', 'Pronto'].includes(a.prep)).forEach(a => { const d = U.diff(a.date, t), s = OS.get('subjects', a.subject);
    if (d <= 7) A('urgent', 'Universidade', `${a.type}: ${a.title}`, `${s ? s.name + ' · ' : ''}${U.rel(a.date)} · preparação: ${a.prep}`, '#universidade.avaliacoes');
    else if (d <= 14) A('attention', 'Universidade', `${a.type}: ${a.title}`, `${U.rel(a.date)} · entra em modo exame (só exercícios e exames antigos)`, '#universidade.avaliacoes'); });
  const rev = St.revDue(), revLate = rev.filter(r => St.revNext(r) < t);
  if (revLate.length) A(revLate.length > 3 ? 'urgent' : 'attention', 'Universidade', `${revLate.length} revisão(ões) espaçada(s) atrasada(s)`, 'Revisões atrasadas antes de matéria nova', '#universidade.revisoes');
  if (wd >= 4 || wd === 0) St.current().forEach(s => { const x = St.stats(s); if (x.targetWk && x.hWk < x.targetWk * .5) A('attention', 'Universidade', `${s.name}: ${x.hWk} h de ${x.targetWk} h esta semana`, 'Abaixo de metade do alvo semanal', '#universidade'); });
  St.current().forEach(s => { const x = St.stats(s); if (x.avg && x.avg < 10) A('urgent', 'Universidade', `Risco de reprovar a ${s.name}`, `Média atual ${x.avg} com ${x.w}% avaliado`, '#universidade.disciplinas'); });
  // Metas e projetos
  OS.all('goals').filter(g => g.status === 'Ativa').forEach(g => { const i = Goal.info(g); if (i.late) A('urgent', 'Metas', g.title, `Prazo passou a ${U.fmtDS(g.due)} · ${Math.round(i.p * 100)}% feito`, '#metas'); else if (i.behind) A('attention', 'Metas', g.title, `${Math.round(i.p * 100)}% feito, esperado ${Math.round(i.exp * 100)}% por esta altura`, '#metas'); });
  OS.all('projects').forEach(p => { const i = Proj.info(p); if (i.late) A('urgent', 'Projetos', p.name, `Prazo passou a ${U.fmtDS(p.due)} · ${Math.round(i.prog * 100)}%`, '#projetos'); else if (i.stalled) A('attention', 'Projetos', `${p.name} está parado`, `Sem atividade há ${i.idle} dias`, '#projetos'); });
  // Corpo
  const lastW = [...OS.all('workouts'), ...OS.all('runs')].map(x => x.date).sort().pop();
  if (lastW && U.diff(t, lastW) >= 4) A('attention', 'Treino', `${U.diff(t, lastW)} dias sem treinar`, 'Último registo a ' + U.fmtDS(lastW), '#treino');
  const wk = U.monday(t), km = Run.kmIn(wk, t), planKm = U.sum(OS.all('runplan').filter(r => r.active), r => r.km) || U.num(OS.one('profile').runKmTarget);
  if (wd >= 5 && planKm && OS.all('runs').length && km < planKm * .5) A('attention', 'Corrida', `${U.r1(km)} km esta semana`, `Plano: ${planKm} km`, '#corrida');
  // Carreira
  OS.all('opps').filter(o => o.deadline && !['Aceite', 'Recusada', 'Perdida', 'Submetida', 'Em avaliação'].includes(o.status)).forEach(o => { const d = U.diff(o.deadline, t); if (d < 0) return; if (d <= 7) A('urgent', 'Oportunidades', o.name, `Prazo ${U.rel(o.deadline)}${o.next ? ' · próxima ação: ' + o.next : ''}`, '#oportunidades'); else if (d <= 21) A('attention', 'Oportunidades', o.name, `Prazo ${U.rel(o.deadline)}`, '#oportunidades'); });
  OS.all('applications').filter(a => a.interview && a.interview >= t && U.diff(a.interview, t) <= 3).forEach(a => A('urgent', 'Carreira', `Entrevista: ${a.company}`, U.rel(a.interview), '#carreira'));
  const fu = OS.all('contacts').filter(c => c.next && c.next <= t); if (fu.length) A('attention', 'Carreira', `${fu.length} follow-up(s) de networking`, fu.slice(0, 3).map(c => c.name).join(' · '), '#carreira.rede');
  // Mova
  OS.all('mvsales').filter(s => s.status === 'Pendente' && s.dueDate && s.dueDate < t).forEach(s => A('urgent', 'Mova', 'Pagamento de cliente em atraso', `${(OS.get('mvclients', s.client) || {}).name || 'Cliente'} · ${U.eur(Mv.rev(s))}`, '#mova.vendas'));
  const mv = OS.one('mova'); if (U.num(mv.revenueTarget)) { const m = Mv.month(ym), day = +t.slice(8), exp = U.num(mv.revenueTarget) * day / U.dim(ym); if (day >= 10 && m.rev < exp * .7) A('attention', 'Mova', 'Receita do mês abaixo do ritmo da meta', `${U.eur(m.rev)} · esperado ${U.eur(exp)} até hoje`, '#mova'); }
  OS.all('mvclients').filter(c => c.next && c.next <= t && !['Perdido', 'Inativo'].includes(c.status)).forEach(c => A('attention', 'Mova', `Contactar ${c.name}`, c.status, '#mova.clientes'));
  // Agenda
  OS.Cal.items(t, U.addDays(t, 1)).filter(x => x.imp && !x.done && x.src !== 'exam').forEach(x => A('attention', 'Agenda', x.title, (x.date === t ? 'Hoje' : 'Amanhã') + (x.start ? ' às ' + x.start : ''), '#calendario'));
  // Revisões
  if ((wd === 0 && hour >= 16) || wd === 1) { const key = wd === 0 ? U.monday(t) : U.monday(U.addDays(t, -1)); if (!OS.all('reviews_w').some(r => r.key === key)) A('attention', 'Revisão', 'Revisão semanal por fazer', '20 minutos: o que funcionou, onde menti a mim mesmo, prioridades', '#revisao'); }
  if (+t.slice(8) <= 5) { const pm = U.addMonths(ym, -1); if (!OS.all('reviews_m').some(r => r.key === pm) && OS.all('transactions').some(x => U.ym(x.date) === pm)) A('attention', 'Revisão', `Revisão de ${U.fmtYML(pm)} por fazer`, 'Auditoria mensal', '#revisao.mensal'); }
  // Hábitos: nunca falhar dois dias seguidos
  const core = OS.all('habits').filter(h => h.active && h.core), y = U.addDays(t, -1);
  const missedY = core.filter(h => Hab.due(h, y) && !Hab.done(h, y) && (!h._c || U.iso(new Date(h._c)) <= y));
  if (missedY.length) A(hour >= 18 ? 'urgent' : 'attention', 'Hábitos', 'Falhaste inegociáveis ontem: hoje não podes falhar', missedY.map(h => h.name).join(' · '), '#habitos');
  return out;
};
I.controlled = (alerts) => {
  const areas = new Set(alerts.map(a => a.area)), out = [], t = U.today();
  const C = (area, text) => { if (!areas.has(area)) out.push({ area, text }); };
  if (OS.all('accounts').length) C('Finanças', `Sem contas em atraso · saldo disponível ${U.eur(Fin.liquid())}`);
  C('Tarefas', `${OS.Tasks.open().length} tarefas abertas, nenhuma atrasada`);
  if (St.current().length) C('Universidade', `Nenhuma avaliação nos próximos 14 dias sem preparação · ${St.revDue().length} revisões para hoje`);
  const ga = OS.all('goals').filter(g => g.status === 'Ativa'); if (ga.length) C('Metas', `${ga.length} metas ativas no ritmo`);
  const pa = OS.all('projects').filter(p => p.status === 'Em andamento'); if (pa.length) C('Projetos', `${pa.length} projetos em andamento, nenhum parado`);
  if (OS.all('workouts').length || OS.all('runs').length) C('Treino', 'Treino em dia');
  if (OS.all('opps').length || OS.all('applications').length) C('Oportunidades', 'Nenhum prazo nos próximos 21 dias');
  if (OS.all('mvsales').length) C('Mova', 'Sem pagamentos em atraso');
  if (OS.all('habits').some(h => h.core)) C('Hábitos', `Sequência de dias perfeitos: ${Hab.perfectStreak()}`);
  return out;
};

/* ================= NEXT ACTION ================= */
I.next = (o = {}) => {
  const t = U.today(), ctx = o.ctx || '', mins = U.num(o.mins) || 0, energy = o.energy || '', out = [];
  const effOk = e => !mins || e <= mins;
  const ctxOk = cs => !ctx || !cs || !cs.length || cs.includes(ctx);
  OS.Tasks.open().forEach(x => {
    if (x.status === 'Aguardando') return;
    if (!ctxOk(x.ctx)) return;
    const eff = U.num(x.effort) || 30; if (!effOk(eff)) return;
    let s = 0; const why = [];
    if (x.due) { const d = U.diff(x.due, t); if (d < 0) { s += 40 + Math.min(20, -d * 3); why.push(`atrasada ${-d}d`); } else if (d === 0) { s += 35; why.push('prazo hoje'); } else if (d === 1) { s += 28; why.push('prazo amanhã'); } else if (d <= 3) { s += 22; why.push(`prazo em ${d}d`); } else if (d <= 7) { s += 14; why.push(`prazo em ${d}d`); } else s += 5; }
    if (x.sched && x.sched <= t) { s += 15; why.push('planeada para hoje'); }
    const pr = { 1: 30, 2: 20, 3: 10, 4: 0 }[x.prio] ?? 10; s += pr; if (+x.prio <= 2) why.push('prioridade ' + (x.prio === '1' ? 'crítica' : 'alta'));
    const imp = U.num(x.impact) || 3; s += (imp - 1) * 6; if (imp >= 4) why.push('alto impacto');
    const g = OS.get('goals', x.goal); if (g && g.status === 'Ativa') { s += 8 + (U.num(g.importance) || 3) * 2; why.push('meta: ' + g.title); }
    const p = OS.get('projects', x.project); if (p && p.status === 'Em andamento') { s += 5; if (!g) why.push('projeto: ' + p.name); }
    if (eff <= 15) { s += 6; why.push('vitória rápida'); }
    if (x.status === 'Em curso') { s += 10; why.push('já começada'); }
    if (energy === 'Baixa' && x.energy === 'Alta') s -= 15; if (energy === 'Alta' && x.energy === 'Alta') s += 5;
    out.push({ kind: 'Tarefa', title: x.title, score: s, why, eff, area: x.area || '', ctx: x.ctx, act: `data-act="taskDone" data-id="${x.id}"`, actL: 'Concluir', focus: `data-act="focusStart" data-task="${x.id}"`, edit: 'tasks:' + x.id });
  });
  Fin.upcoming(3).filter(x => x.amount < 0 && (x.rec || x.debt)).forEach(x => { if (!ctxOk(['@Financeiro', '@Computador'])) return; if (!effOk(5)) return; out.push({ kind: 'Pagamento', title: `Pagar ${x.title}`, score: x.late ? 80 : 60, why: [x.late ? 'em atraso' : 'vence ' + U.rel(x.date), U.eur(-x.amount)], eff: 5, area: 'Finanças', act: x.rec ? `data-act="payRec" data-id="${x.rec.id}"` : `data-act="payDebt" data-id="${x.debt.id}"`, actL: 'Registar' }); });
  if (ctxOk(['@Estudos', '@Universidade'])) St.today().slice(0, 4).forEach(x => { if (!effOk(Math.min(x.mins || 50, 50))) return; const s = OS.get('subjects', x.subject); out.push({ kind: 'Estudo', title: x.title + (s && x.kind !== 'Ritmo' ? ' · ' + s.name : ''), score: Math.min(75, x.score * .55 + 12), why: [x.why], eff: Math.min(x.mins || 50, 50), area: 'Universidade', act: x.act || '', actL: x.actL || '', focus: `data-act="focusStart" data-subject="${x.subject || ''}" data-label="${U.esc(x.title)}"` }); });
  const wd = String(new Date().getDay()), split = OS.one('fit').split[wd];
  if (ctxOk(['@Rua']) && effOk(45)) {
    if (split && !['Corrida', 'Descanso'].includes(split) && !OS.all('workouts').some(w => w.date === t)) out.push({ kind: 'Treino', title: 'Treino de hoje: ' + split, score: 42, why: ['planeado para hoje', 'meta ' + (OS.one('profile').trainTarget || 4) + '×/semana'], eff: 60, area: 'Treino', act: `data-new="workouts"`, actL: 'Registar' });
    OS.all('runplan').filter(r => r.active && String(r.wday) === wd).forEach(r => { if (!OS.all('runs').some(x => x.date === t)) out.push({ kind: 'Corrida', title: `${r.type}${U.num(r.km) ? ' ' + r.km + ' km' : U.num(r.mins) ? ' ' + r.mins + ' min' : ''}`, score: 38, why: ['plano de corrida', r.desc].filter(Boolean), eff: U.num(r.mins) || Math.round(U.num(r.km) * 6) || 30, area: 'Corrida', act: `data-new="runs"`, actL: 'Registar' }); });
  }
  OS.all('habits').filter(h => h.active && h.core && Hab.due(h, t) && !Hab.done(h, t) && !h.auto).forEach(h => { if (effOk(10)) out.push({ kind: 'Hábito', title: h.name, score: 30 + (new Date().getHours() >= 18 ? 15 : 0), why: ['inegociável', 'sequência ' + Hab.streak(h) + 'd'], eff: 10, area: 'Hábitos', act: `data-act="habit" data-id="${h.id}" data-d="${t}"`, actL: 'Feito' }); });
  if (ctxOk(['@Computador'])) OS.all('opps').filter(o2 => o2.deadline && o2.next && U.diff(o2.deadline, t) >= 0 && U.diff(o2.deadline, t) <= 14 && !['Aceite', 'Recusada', 'Perdida', 'Submetida', 'Em avaliação'].includes(o2.status)).forEach(o2 => { if (effOk(30)) out.push({ kind: 'Oportunidade', title: o2.next + ' · ' + o2.name, score: 55 - U.diff(o2.deadline, t) * 2, why: ['prazo ' + U.rel(o2.deadline)], eff: 30, area: 'Carreira', edit: 'opps:' + o2.id }); });
  OS.all('contacts').filter(c => c.next && c.next <= t).forEach(c => { if (effOk(10)) out.push({ kind: 'Networking', title: 'Follow-up com ' + c.name, score: 28, why: [c.org || c.role || 'rede'].filter(Boolean), eff: 10, area: 'Carreira', act: `data-act="contactDone" data-id="${c.id}"`, actL: 'Contactado' }); });
  OS.all('wishlist').filter(w => w.status === 'Em espera' && Date.now() >= I.wishUntil(w)).forEach(w => { if (effOk(5)) out.push({ kind: 'Decisão', title: 'Decidir compra: ' + w.product, score: 22, why: ['espera cumprida', U.eur(w.price)], eff: 5, area: 'Finanças', href: '#compras' }); });
  if (new Date().getDay() === 0 && !OS.all('reviews_w').some(r => r.key === U.monday(t)) && effOk(20)) out.push({ kind: 'Revisão', title: 'Revisão semanal', score: 50, why: ['domingo', '20 minutos'], eff: 20, area: 'Direção', href: '#revisao' });
  return out.sort((a, b) => b.score - a.score);
};

/* ================= COMPRAS ================= */
I.wishWait = price => { const p = U.num(price); return p <= 50 ? { label: '24 horas', h: 24 } : p <= 200 ? { label: '3 dias úteis', bd: 3 } : p <= 1000 ? { label: '7 dias', h: 168 } : { label: '14 dias', h: 336 }; };
I.wishUntil = w => { const r = I.wishWait(w.price), c = w.created || Date.now(); if (r.h) return c + r.h * 36e5; const d = new Date(c); let n = 0; while (n < r.bd) { d.setDate(d.getDate() + 1); const g = d.getDay(); if (g && g !== 6) n++; } return d.getTime(); };
I.wishImpact = w => {
  const price = U.num(w.price), inc = Fin.avgMonthly(3, 'inc'), exp = Fin.avgMonthly(3, 'exp'), hourly = Fin.hourly();
  const free = inc != null && exp != null ? inc - exp : null;
  const fv = (r, y) => price * Math.pow(1 + r, y);
  const g = OS.all('goals').filter(x => x.status === 'Ativa' && ['account', 'networth', 'invested'].includes(x.metric)).sort((a, b) => (U.num(b.importance) || 0) - (U.num(a.importance) || 0))[0];
  const budget = OS.all('budgets').find(b => b.cat === w.cat), bLeft = budget ? U.num(budget.limit) - Fin.spentCat(w.cat, U.ym(U.today())) : null;
  return { hours: hourly ? price / hourly : null, freeShare: free && free > 0 ? price / free : null, free, fv5: fv(.06, 5), fv10: fv(.06, 10), goal: g, goalDelayDays: g && free && free > 0 ? Math.round(price / free * 30) : null, budget, bLeft, liquidShare: Fin.liquid() > 0 ? price / Fin.liquid() : null };
};
I.wishStats = () => {

I.insights = () => {

      const blocks = timed.map(x => { const s = Math.max(H0 * 60, U.t2m(x.start)), e = Math.min(H1 * 60, U.t2m(x.end) || s + 45); return `<div class="cal-blk" ${x.edit ? `data-edit="${x.edit}"` : ''} style="top:${(s - H0 * 60) / 60 * HH}px;height:${Math.max(22, (e - s) / 60 * HH - 2)}px;border-left-color:${OS.srcColor(x.src)};${x.planned ? 'opacity:.6' : ''}" title="${esc(x.title)}">${esc(x.title)}<small>${x.start}${x.end ? '–' + x.end : ''}${x.sub ? ' · ' + esc(x.sub) : ''}</small></div>`; }).join('');
      const nowL = d === U.today() ? (() => { const n = new Date(); const m = n.getHours() * 60 + n.getMinutes(); return m >= H0 * 60 ? `<div class="cal-now" style="top:${(m - H0 * 60) / 60 * HH}px"></div>` : ''; })() : '';
      return { d, all, html: `<div class="cal-grid" data-act="calSlot" data-d="${d}">${Array.from({ length: H1 - H0 }, () => '<div class="cal-hr"></div>').join('')}${blocks}${nowL}</div>` }; });

      <div>${Array.from({ length: H1 - H0 }, (_, i) => `<div class="cal-hr">${U.pad(H0 + i)}:00</div>`).join('')}</div>${cols.map(c => c.html).join('')}</div></div>`;

/* Integração Google Calendar (via conector MCP do claude.ai, só leitura) */
let gcalUnsub = null;
OS.gcalStart = async () => {
  if (gcalUnsub) return; let mcp = null;
  try { mcp = window.claude && window.claude.use ? await window.claude.use('mcp') : null; } catch (e) { }
  if (!mcp) { OS.gcalState = 'Integração indisponível nesta vista (só funciona dentro do claude.ai).'; OS.request(); return; }
  const from = new Date(); from.setDate(from.getDate() - 14); const to = new Date(); to.setDate(to.getDate() + 60);
  gcalUnsub = mcp.watchTool('Google Calendar', 'list_events', { startTime: from.toISOString(), endTime: to.toISOString(), pageSize: 250, orderBy: 'startTime', timeZone: 'Europe/Lisbon' }, ev => {
    if (ev.type === 'error') { const c = ev.error && ev.error.code;
      OS.gcalState = c === 'server_not_connected' ? 'O Google Calendar não está ligado. Adiciona-o em claude.ai → Settings → Connectors.' : c === 'needs_reauth' ? 'Autorização expirada. Religa o Google Calendar em claude.ai → Settings → Connectors.' : c === 'not_in_manifest' ? 'Não autorizaste o Google Calendar para esta página.' : c === 'not_granted' || c === 'capability_disabled' ? 'Integração indisponível nesta vista.' : 'Não foi possível ler a agenda agora (' + (c || 'erro') + '). Os dados anteriores mantêm-se.';
      if (['server_not_connected', 'needs_reauth', 'not_in_manifest', 'blocked_by_policy'].includes(c)) Cal.gcal = [];
      OS.request(); return; }
    const evs = (ev.result && ev.result.payload && ev.result.payload.events) || [];
    Cal.gcal = evs.filter(x => x.status !== 'cancelled').map(x => { const s = x.start || {}, e = x.end || {}; const sd = s.dateTime ? new Date(s.dateTime) : null, ed = e.dateTime ? new Date(e.dateTime) : null;
      return { date: sd ? U.iso(sd) : String(s.date || '').slice(0, 10), start: sd ? U.hm(sd) : '', end: ed ? U.hm(ed) : '', title: x.summary || '(sem título)', sub: x.location || '', link: x.htmlLink }; }).filter(x => x.date);
    const st = ev.result && ev.result.cache && ev.result.cache.storedAt;
    OS.gcalState = `${Cal.gcal.length} eventos entre ${U.fmtDS(U.iso(from))} e ${U.fmtDS(U.iso(to))}` + (st ? ' · atualizado às ' + U.hm(new Date(st)) : '');
    OS.request();
  }, { refetchInterval: 15 * 60 * 1000 });
};
A.gcalOn = () => { OS.setOne('integ', { gcal: true }); OS.gcalStart(); };
A.gcalOff = () => { OS.setOne('integ', { gcal: false }); if (gcalUnsub) { gcalUnsub(); gcalUnsub = null; } Cal.gcal = []; OS.gcalState = ''; };

/* ================= MODO FOCO ================= */
const FK = 'os2focus';
let FS = U.ls.get(FK, null);
OS.focusState = () => FS;
A.focusStart = b => {
  const task = b.dataset.task ? OS.get('tasks', b.dataset.task) : null, subject = b.dataset.subject || (task && task.subject) || '';
  const label = task ? task.title : b.dataset.label || (subject ? 'Estudo: ' + subjN(subject) : 'Bloco de foco');
  const html = `<div class="drw-h"><div><div class="eyebrow">Modo foco</div><h3>${esc(label)}</h3></div><button type="button" class="icon-btn" data-close aria-label="Fechar">${UI.ic('x')}</button></div><div class="drw-b">
    <div class="fld"><label>Duração</label>${UI.seg('fdur', [['25', '25'], ['50', '50'], ['90', '90'], ['10', 'Só 10']], OS.ui.fdur || '50')}<small>Protocolo: 50 de foco, 10 de pausa. "Só 10 minutos" para vencer a preguiça.</small></div>
    <div class="fld"><label for="fsubj">Registar como estudo de</label><select id="fsubj"><option value="">Não registar como estudo</option>${St.current().map(s => `<option value="${s.id}"${s.id === subject ? ' selected' : ''}>${esc(s.name)}</option>`).join('')}${OS.all('skills').map(s => `<option value="sk:${s.id}">Competência · ${esc(s.name)}</option>`).join('')}</select></div>
    <label class="switch"><input type="checkbox" id="fphone" checked><span></span>Telemóvel noutra divisão</label>
    <div class="note">Antes: abre só o material da sessão e escreve "No fim desta sessão eu vou conseguir…". Distrações vão para um papel.</div></div>
    <div class="drw-f"><span></span><button class="btn pri" data-act="focusGo" data-task="${task ? task.id : ''}" data-label="${esc(label)}">${UI.ic('play')}Começar</button></div>`;
  UI.drawer(html);
};
A.focusGo = b => { const sel = U.$('#fsubj').value; const dur = +(OS.ui.fdur || 50); FS = { label: b.dataset.label, task: b.dataset.task || '', subject: sel.startsWith('sk:') ? '' : sel, skill: sel.startsWith('sk:') ? sel.slice(3) : '', phone: U.$('#fphone').checked, dur, start: Date.now(), end: Date.now() + dur * 6e4, phase: 'focus', min: false }; U.ls.set(FK, FS); UI.closeDrawer(); try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => { }); } catch (e) { } renderFocus(); };
function focusLog(mins) {
  if (mins < 5 || !(FS.subject || FS.skill)) return false;
  OS.add('sessions', { date: U.today(), subject: FS.subject, skill: FS.skill, minutes: mins, type: 'Estudo profundo', phone: FS.phone, focus: 4, learned: FS.task ? 'Foco: ' + FS.label : '' });
  return true;
}
function beep() { try { const a = new (window.AudioContext || window.webkitAudioContext)(); [0, .3, .6].forEach(t => { const o = a.createOscillator(), g = a.createGain(); o.frequency.value = 740; o.connect(g); g.connect(a.destination); g.gain.setValueAtTime(.15, a.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + t + .25); o.start(a.currentTime + t); o.stop(a.currentTime + t + .26); }); } catch (e) { } }
A.focusEnd = b => { if (!FS) return; const early = b && b.dataset.early; if (FS.phase === 'focus') { const mins = Math.round(Math.min(FS.dur * 6e4, Date.now() - FS.start) / 6e4); const logged = focusLog(mins); UI.toast(logged ? `${mins} min registados como sessão de estudo` : mins + ' min de foco', 'pos'); if (FS.task) { const tk = FS.task; setTimeout(() => UI.ask('Concluíste a tarefa?', esc(FS && FS.label || (OS.get('tasks', tk) || {}).title || ''), 'Sim, concluir', () => OS.Tasks.complete(tk), 'pri'), 200); } if (!early) { beep(); FS = Object.assign({}, FS, { phase: 'break', start: Date.now(), end: Date.now() + 10 * 6e4, task: '' }); U.ls.set(FK, FS); renderFocus(); return; } } FS = null; U.ls.del(FK); renderFocus(); };
A.focusCancel = () => { FS = null; U.ls.del(FK); renderFocus(); UI.toast('Sessão descartada'); };
A.focusMin = () => { if (!FS) return; FS.min = true; U.ls.set(FK, FS); renderFocus(); };
A.focusMax = () => { if (!FS) return; FS.min = false; U.ls.set(FK, FS); renderFocus(); };
function renderFocus() {
  const el = U.$('#focus'), dock = U.$('#dock');
  if (!FS) { el.hidden = true; dock.hidden = true; el.innerHTML = ''; return; }
  if (FS.min) { el.hidden = true; dock.hidden = false; tickFocus(); return; }
  dock.hidden = true; el.hidden = false;
  const na = I.next().filter(n => n.edit !== 'tasks:' + FS.task)[0];
  const task = OS.get('tasks', FS.task), goal = task && OS.get('goals', task.goal), proj = task && OS.get('projects', task.project);
  const today = U.sum(OS.all('sessions').filter(s => s.date === U.today()), s => s.minutes);
  el.innerHTML = `<div class="f-top"><span>${FS.phase === 'focus' ? 'FOCO' : 'PAUSA'} · ${FS.dur} min${FS.phone ? ' · telemóvel longe' : ''}</span><button class="btn ghost sm" data-act="focusMin">Minimizar</button></div>
    <div class="eyebrow">${FS.phase === 'focus' ? 'Atividade atual' : 'Pausa — levanta-te, água, respira'}</div>
    <div class="f-act">${esc(FS.phase === 'focus' ? FS.label : 'Pausa de 10 minutos')}</div>
    <div class="f-time" data-ftime>--:--</div><div class="f-ring"><i data-fbar style="width:0"></i></div>
    <div class="f-meta"><div>Objetivo relacionado<b>${esc(goal ? goal.title : proj ? proj.name : FS.subject ? subjN(FS.subject) : '—')}</b></div><div>Foco hoje<b data-ftoday>${today} min</b></div><div>A seguir<b>${esc(na ? na.title : '—')}</b></div></div>
    <div class="f-btns">${FS.phase === 'focus' ? `<button class="btn pri" data-act="focusEnd" data-early="1">${UI.ic('stop')}Terminar e registar</button>` : `<button class="btn pri" data-act="focusEnd" data-early="1">Voltar ao trabalho</button>`}<button class="btn ghost" data-act="focusCancel">Descartar</button></div>`;
  tickFocus();
}
function tickFocus() {
  if (!FS) return; const ms = FS.end - Date.now(), tot = FS.end - FS.start, tx = ms > 0 ? U.pad(Math.floor(ms / 6e4)) + ':' + U.pad(Math.floor(ms % 6e4 / 1e3)) : '00:00';
  const t = U.$('[data-ftime]'); if (t) t.textContent = tx; const b = U.$('[data-fbar]'); if (b) b.style.width = Math.min(100, (1 - ms / tot) * 100) + '%';
  const dock = U.$('#dock'); if (FS.min) dock.innerHTML = `<div><b>${tx}</b><small>${FS.phase === 'focus' ? esc(FS.label) : 'Pausa'}</small></div><button class="icon-btn" data-act="focusMax" aria-label="Abrir foco">${UI.ic('focus')}</button>`;
  document.title = tx + ' · ' + (FS.phase === 'focus' ? 'Foco' : 'Pausa');
  if (ms <= 0) { if (FS.phase === 'focus') { A.focusEnd(null); } else { beep(); FS = null; U.ls.del(FK); renderFocus(); UI.toast('Pausa acabou. Volta ao trabalho.'); document.title = 'Oceanum'; } }
}
setInterval(() => { if (FS) tickFocus(); else if (document.title !== 'Oceanum' && !/Oceanum/.test(document.title)) document.title = 'Oceanum'; document.querySelectorAll('[data-clock]').forEach(e => e.textContent = U.hm()); }, 1000);
document.addEventListener('click', e => { if (e.target.closest('#dock') && !e.target.closest('[data-act]')) A.focusMax(); });
OS.on('ready', renderFocus);
})();

};
const FIN = {};
FIN.visao = () => {
  const t = U.today(), ym = U.ym(t), p = OS.one('profile'), m = Fin.month(ym), pm = Fin.month(U.addMonths(ym, -1));
  const months = Fin.months(12), md = months.map(Fin.month);

  `<div class="kpis">${UI.kpi('Em espera', st.waiting, U.eur(U.sum(waiting, w => w.price)))}${UI.kpi('Poupado ao desistir', U.eur(st.saved), st.gaveUp + ' desistência(s)', { tone: 'pos' })}${UI.kpi('Comprado depois da espera', U.eur(st.bought))}${UI.kpi('Taxa de resistência', st.resist == null ? '—' : U.pct(st.resist), 'desistências / decisões')}</div>

};

setInterval(() => { document.querySelectorAll('[data-until]').forEach(el => { const ms = +el.dataset.until - Date.now(); if (ms <= 0) { if (!el.dataset.done) { el.dataset.done = 1; OS.request(); } return; } const d = Math.floor(ms / 864e5), h = Math.floor(ms % 864e5 / 36e5), m = Math.floor(ms % 36e5 / 6e4), s = Math.floor(ms % 6e4 / 1e3); el.textContent = 'faltam ' + (d ? d + 'd ' : '') + U.pad(h) + 'h ' + U.pad(m) + 'm ' + U.pad(s) + 's'; }); }, 1000);

/* ================= SIMULADORES ================= */
const SIMS = [['juros', 'Juros compostos'], ['emprestimo', 'Empréstimo'], ['parcelado', 'Parcelado vs à vista'], ['compra', 'Impacto de uma compra'], ['meta', 'Meta financeira'], ['independencia', 'Independência financeira'], ['taxas', 'Comparar taxas'], ['inflacao', 'Inflação']];
const sv = (k, d) => Object.assign({}, d, OS.ui['sim_' + k] || {});
const inp = (k, f, l, v, unit = '', step = 'any') => `<div class="fld"><label for="s_${k}_${f}">${l}</label><div class="inp-wrap">${unit === '€' ? '<span>€</span>' : ''}<input id="s_${k}_${f}" type="number" step="${step}" inputmode="decimal" value="${v}" data-sim="${k}.${f}" data-fk="sim${k}${f}">${unit && unit !== '€' ? `<span>${unit}</span>` : ''}</div></div>`;
V.simuladores = sub => {

  let inH = '', out = '';
  if (k === 'juros') { const s = sv(k, { p0: Math.round(OS.Inv.value()) || 1000, pmt: 150, r: 6, y: 20, inf: 2.5 });
    const rows = []; let v = +s.p0, c = +s.p0; for (let y = 0; y <= s.y; y++) { rows.push({ y, v, c, real: v / Math.pow(1 + s.inf / 100, y) }); for (let m = 0; m < 12; m++) { v = v * (1 + s.r / 100 / 12) + +s.pmt; c += +s.pmt; } }
    const last = rows[rows.length - 1];
    inH = inp(k, 'p0', 'Valor inicial', s.p0, '€') + inp(k, 'pmt', 'Aporte mensal', s.pmt, '€') + inp(k, 'r', 'Rentabilidade anual', s.r, '%') + inp(k, 'y', 'Anos', s.y, 'anos', 1) + inp(k, 'inf', 'Inflação anual', s.inf, '%');
    out = `<div class="kpis">${UI.kpi('Valor final', U.eur(last.v, { dec: 0 }))}${UI.kpi('Total aportado', U.eur(last.c, { dec: 0 }))}${UI.kpi('Juros ganhos', U.eur(last.v - last.c, { dec: 0 }), '', { tone: 'pos' })}${UI.kpi('Em dinheiro de hoje', U.eur(last.real, { dec: 0 }), 'descontada a inflação')}</div>${C.mount({ type: 'line', labels: rows.map(r => 'a' + r.y), series: [{ name: 'Valor', data: rows.map(r => r.v) }, { name: 'Aportado', data: rows.map(r => r.c), color: 'var(--mut)', dash: 1 }, { name: 'Valor real', data: rows.map(r => r.real), color: 'var(--c8)' }], fmt: U.eurK }, 280)}`; }
  if (k === 'emprestimo') { const s = sv(k, { pv: 10000, r: 7.5, n: 60, sys: 'price' }); const i = s.r / 100 / 12; let bal = +s.pv, tot = 0, totI = 0, first = 0, lastP = 0; const bals = [bal], ints = [], amos = [];
    for (let m = 1; m <= s.n; m++) { let pay, int = bal * i, amo; if (s.sys === 'sac') { amo = s.pv / s.n; pay = amo + int; } else { pay = i ? s.pv * i / (1 - Math.pow(1 + i, -s.n)) : s.pv / s.n; amo = pay - int; } bal = Math.max(0, bal - amo); tot += pay; totI += int; if (m === 1) first = pay; lastP = pay; bals.push(bal); ints.push(int); amos.push(amo); }
    const yrs = Math.ceil(s.n / 12);
    inH = inp(k, 'pv', 'Valor pedido', s.pv, '€') + inp(k, 'r', 'Taxa anual (TAN)', s.r, '%') + inp(k, 'n', 'Prazo', s.n, 'meses', 1) + `<div class="fld"><label>Sistema</label>${UI.seg('sim_emprestimo.sys', [['price', 'Prestação fixa'], ['sac', 'Amortização constante']], s.sys)}</div>`;
    out = `<div class="kpis">${UI.kpi(s.sys === 'sac' ? '1.ª prestação' : 'Prestação', U.eur(first))}${s.sys === 'sac' ? UI.kpi('Última prestação', U.eur(lastP)) : ''}${UI.kpi('Total pago', U.eur(tot, { dec: 0 }))}${UI.kpi('Juros totais', U.eur(totI, { dec: 0 }), U.pct(totI / s.pv) + ' do valor pedido', { tone: 'neg' })}${UI.kpi('Peso no rendimento', Fin.recurIncome() ? U.pct(first / Fin.recurIncome()) : '—', 'da receita recorrente')}</div>${C.mount({ type: 'bar', stacked: true, labels: Array.from({ length: yrs }, (_, y) => 'ano ' + (y + 1)), series: [{ name: 'Amortização', data: Array.from({ length: yrs }, (_, y) => U.sum(amos.slice(y * 12, y * 12 + 12))), color: 'var(--accent)' }, { name: 'Juros', data: Array.from({ length: yrs }, (_, y) => U.sum(ints.slice(y * 12, y * 12 + 12))), color: 'var(--neg)' }], fmt: U.eurK }, 260)}`; }
  if (k === 'parcelado') { const s = sv(k, { cash: 1000, n: 10, inst: 105, r: 3 }); const i = s.r / 100 / 12; const pv = i ? s.inst * (1 - Math.pow(1 + i, -s.n)) / i : s.inst * s.n; const tot = s.inst * s.n;
    let eff = 0; if (tot > s.cash) { let lo = 0, hi = 1; for (let it = 0; it < 60; it++) { const mid = (lo + hi) / 2; const v = s.inst * (1 - Math.pow(1 + mid, -s.n)) / mid; if (v > s.cash) lo = mid; else hi = mid; } eff = Math.pow(1 + (lo + hi) / 2, 12) - 1; }
    inH = inp(k, 'cash', 'Preço à vista', s.cash, '€') + inp(k, 'n', 'Nº de parcelas', s.n, '', 1) + inp(k, 'inst', 'Valor de cada parcela', s.inst, '€') + inp(k, 'r', 'Rendimento do teu dinheiro parado', s.r, '%/ano');
    out = `<div class="kpis">${UI.kpi('Total parcelado', U.eur(tot))}${UI.kpi('Diferença nominal', U.eur(tot - s.cash, { sign: 1 }), '', { tone: tot > s.cash ? 'neg' : 'pos' })}${UI.kpi('Valor presente das parcelas', U.eur(pv), 'descontado a ' + s.r + '%/ano')}${UI.kpi('Juro implícito', tot > s.cash ? U.pct(eff, 1) + '/ano' : 'sem juros')}</div>

  if (k === 'compra') { const s = sv(k, { price: 1200, hourly: U.num(p.hourly) || Fin.hourly() || 6, save: Math.max(0, Math.round(pr.monthlyNet)) || 200, r: 6 });

    const yrs = [0, 1, 3, 5, 10, 20];
    out = `<div class="kpis">${UI.kpi('Horas de trabalho', U.nf(s.price / s.hourly, 1) + ' h', U.nf(s.price / s.hourly / 8, 1) + ' dias de 8 h')}${UI.kpi('Meses de poupança', s.save ? U.nf(s.price / s.save, 1) : '—')}${UI.kpi('Custo de oportunidade 10 anos', U.eur(s.price * Math.pow(1 + s.r / 100, 10), { dec: 0 }), 'se investisses em vez de gastar')}</div>${C.mount({ type: 'bar', labels: yrs.map(y => y + ' anos'), series: [{ name: 'Valor se investido', data: yrs.map(y => s.price * Math.pow(1 + s.r / 100, y)), color: 'var(--c2)' }], fmt: U.eurK }, 240)}<div class="note">Premissa: rentabilidade constante de ${s.r}%/ano, sem novos aportes.</div>`; }
  if (k === 'meta') { const s = sv(k, { target: U.num(p.emergencyTarget) || 1000, cur: Math.round(Fin.reserve()), months: 12, r: 2 }); const i = s.r / 100 / 12, fvCur = s.cur * Math.pow(1 + i, s.months), need = Math.max(0, s.target - fvCur); const pmt = i ? need * i / (Math.pow(1 + i, s.months) - 1) : need / s.months;
    const path = []; let v = +s.cur; for (let m = 0; m <= s.months; m++) { path.push(v); v = v * (1 + i) + pmt; }
    inH = inp(k, 'target', 'Valor da meta', s.target, '€') + inp(k, 'cur', 'Já tenho', s.cur, '€') + inp(k, 'months', 'Prazo', s.months, 'meses', 1) + inp(k, 'r', 'Rentabilidade', s.r, '%/ano');
    out = `<div class="kpis">${UI.kpi('Poupar por mês', U.eur(pmt))}${UI.kpi('Por semana', U.eur(pmt * 12 / 52))}${UI.kpi('Do teu saldo mensal atual', pr.monthlyNet > 0 ? U.pct(pmt / pr.monthlyNet) : '—', pr.monthlyNet > 0 ? 'saldo médio ' + U.eur(pr.monthlyNet) : 'sem saldo positivo registado')}</div>${C.mount({ type: 'line', labels: path.map((_, m) => 'm' + m), series: [{ name: 'Acumulado', data: path }], target: +s.target, targetLabel: 'meta', fmt: U.eurK }, 250)}`; }
  if (k === 'independencia') { const s = sv(k, { exp: Math.round(Fin.avgMonthly(3, 'exp') || 900), inv: Math.round(OS.Inv.value()), pmt: 200, r: 5, wr: 4 }); const fi = s.exp * 12 / (s.wr / 100); const i = s.r / 100 / 12; let v = +s.inv, m = 0; const path = [v]; while (v < fi && m < 12 * 60) { v = v * (1 + i) + +s.pmt; m++; if (m % 12 === 0) path.push(v); }
    inH = inp(k, 'exp', 'Despesas mensais', s.exp, '€') + inp(k, 'inv', 'Património investido', s.inv, '€') + inp(k, 'pmt', 'Aporte mensal', s.pmt, '€') + inp(k, 'r', 'Rentabilidade real', s.r, '%/ano') + inp(k, 'wr', 'Taxa de levantamento', s.wr, '%');
    out = `<div class="kpis">${UI.kpi('Número da independência', U.eur(fi, { dec: 0 }), s.wr + '% de levantamento anual')}${UI.kpi('Tempo até lá', m >= 720 ? '60+ anos' : Math.floor(m / 12) + ' anos ' + (m % 12) + ' m')}${UI.kpi('Já percorrido', U.pct(s.inv / fi, 1))}</div>${C.mount({ type: 'line', labels: path.map((_, y) => 'a' + y), series: [{ name: 'Património', data: path }], target: fi, targetLabel: 'independência', fmt: U.eurK }, 260)}<div class="note">Premissas: rentabilidade real constante (já descontada a inflação), aportes constantes e regra dos ${s.wr}%. É uma ordem de grandeza, não uma previsão.</div>`; }

    inH = inp(k, 'p0', 'Valor inicial', s.p0, '€') + inp(k, 'pmt', 'Aporte mensal', s.pmt, '€') + inp(k, 'y', 'Anos', s.y, 'anos', 1) + inp(k, 'r1', 'Taxa A', s.r1, '%') + inp(k, 'r2', 'Taxa B', s.r2, '%') + inp(k, 'r3', 'Taxa C', s.r3, '%');

  return UI.head('Simuladores', 'Muda as variáveis e vê o resultado. Os valores iniciais vêm dos teus dados quando existem.', '', 'Dinheiro') + UI.tabs('simuladores', SIMS.map(([a, b]) => [a === 'juros' ? '' : a, b]), sub) +
  `<div class="sim"><div class="pn sim-in">${inH}<button class="btn ghost sm" data-act="simReset" data-k="${k}">Repor valores</button></div><div class="pn sim-out">${out}</div></div>`;
};
A.simReset = b => { delete OS.ui['sim_' + b.dataset.k]; OS.setUI('sim_' + b.dataset.k, undefined); };

<script>

UNI.sessoes = () => {

  const skillH = U.sum(S.filter(x => x.skill), x => x.minutes) / 60; if (skillH) bySubj.push({ l: 'Aprendizagem', v: skillH });

  return `<div class="kpis">${UI.kpi('Total acumulado', U.hours(tot), 'minutos totais na caverna: ' + U.nf(tot))}${UI.kpi('Últimos 30 dias', U.hours(U.sum(S.filter(s => s.date >= days[0]), s => s.minutes)))}${UI.kpi('Blocos de 50 min (30d)', U.nf(Math.floor(U.sum(S.filter(s => s.date >= days[0]), s => s.minutes) / 50)))}${UI.kpi('Foco médio', S.length ? U.nf(U.avg(S.filter(s => s.focus), s => s.focus), 1) + '/5' : '—')}${UI.kpi('Telemóvel longe', S.length ? U.pct(S.filter(s => s.phone).length / S.length) : '—', 'das sessões')}</div>

};

  <div class="pn" style="margin-top:16px"><div class="pn-h"><h3>Todos os músculos · 7 dias</h3></div><div class="bm2-rank">${rank.map(([x, v]) => `<button class="${x === m ? 'on' : ''}" data-act="muscle" data-m="${x}"><span>${x}</span><i style="width:${Math.min(100, v / 20 * 100)}%;background:${heatCol(U.clamp(v / 16, .05, 1))}"></i><b class="mono">${U.nf(v, v % 1 ? 1 : 0)}</b></button>`).join('')}</div></div>`;
};
})();

</script>
<script>
/* OCEANUM — Trabalho, Carreira & Networking, Capital Profissional, Opportunity Center, Mova. */
(() => {
'use strict';
const U = OS.U, UI = OS.UI, C = OS.C, V = OS.views, L = OS.L, esc = U.esc, A = OS.act, Car = OS.Car, Mv = OS.Mv;

/* ================= TRABALHO ================= */
V.trabalho = () => {
  const p = OS.one('profile'), S = OS.all('shifts'), t = U.today(), wk = U.monday(t), ym = U.ym(t);
  const weeks = Array.from({ length: 10 }, (_, i) => U.addDays(wk, -7 * (9 - i)));

  const next = U.sortBy(S.filter(s => s.date >= t), s => s.date + s.start).slice(0, 8);
  const tasks = OS.Tasks.open().filter(x => (x.ctx || []).includes('@Trabalho') || x.area === 'Trabalho');
  return UI.head('Trabalho', `${p.employer ? esc(p.employer) + (p.jobRole ? ' · ' + esc(p.jobRole) : '') : 'Define o teu trabalho atual em Definições'}${U.num(p.hourly) ? ' · ' + U.eur(p.hourly) + '/h' : ''}`, `${UI.addBtn('shifts', 'Turno')}${UI.addBtn('tasks', 'Tarefa', { ctx: ['@Trabalho'], area: 'Trabalho', status: 'Próxima' }, '')}`, 'Carreira') +
  `<div class="kpis">${UI.kpi('Horas esta semana', U.nf(hW, 1) + ' h')}${UI.kpi('Horas este mês', U.nf(hM, 1) + ' h')}${UI.kpi('Ganhos estimados (mês)', U.eur(payM), U.num(p.hourly) || S.some(s => U.num(s.rate)) ? 'horas × valor/hora' : 'define o valor/hora', { tone: 'pos' })}${UI.kpi('Próximo turno', next[0] ? U.rel(next[0].date) + ' ' + next[0].start : '—')}</div>
  ${payM ? `<div class="row gap8"><button class="btn sm" data-new="transactions" data-defs='${esc(JSON.stringify({ type: 'Receita', amount: U.r2(payM), cat: 'Salário', sub: 'Salário', desc: 'Salário ' + U.fmtYML(ym) + ' (turnos)' }))}'>${UI.ic('wallet')}Lançar salário do mês em Finanças</button><span class="mut" style="font-size:12.5px">Confirma o valor com o recibo antes de guardar.</span></div>` : ''}
  <div class="g g-main"><div class="pn"><div class="pn-h"><h3>Horas por semana</h3></div>${C.mount({ type: 'bar', labels: weeks.map(w => U.fmtDS(w)), series: [{ name: 'Horas', data: weeks.map(w => U.sum(S.filter(s => s.date >= w && s.date <= U.addDays(w, 6)), Car.shiftHours)), color: 'var(--c4)' }], fmt: v => U.nf(v, 0), empty: 'Regista turnos para ver as horas.' }, 200)}</div>
  <div class="pn"><div class="pn-h"><h3>Próximos turnos</h3></div>${next.length ? next.map(s => `<div class="li" data-edit="shifts:${s.id}" style="cursor:pointer"><span class="when">${U.fmtDS(s.date)}</span><div class="li-t"><b>${s.start}–${s.end}</b><small>${esc([s.place, s.role].filter(Boolean).join(' · '))} · ${U.nf(Car.shiftHours(s), 1)} h</small></div></div>`).join('') : UI.empty('Sem turnos marcados.')}</div></div>
  <section><div class="sech"><h2>Tarefas de trabalho</h2></div><div class="pn" style="padding:4px 16px">${tasks.map(x => OS.taskRow(x)).join('') || UI.empty('Nenhuma.')}</div></section>
  ${UI.table({ key: 'sh', coll: 'shifts', rows: U.sortBy(S, s => s.date, -1), limit: 30, cols: [{ l: 'Data', v: s => `<span class="mono">${U.fmtD(s.date)}</span>`, s: s => s.date }, { l: 'Horário', v: s => s.start + '–' + s.end }, { l: 'Local', v: s => esc(s.place || '') }, { l: 'Horas', cls: 'r', v: s => U.nf(Car.shiftHours(s), 1) }, { l: 'Valor', cls: 'r', v: s => `<span class="mono">${U.eur(Car.shiftPay(s))}</span>` }] })}`;
};

/* ================= CARREIRA ================= */
V.carreira = sub => {
  const head = UI.head('Carreira & Networking', 'Candidaturas, entrevistas, rede de contactos, experiências e metas profissionais.', `${UI.addBtn('applications', 'Candidatura')}${UI.addBtn('contacts', 'Contacto', null, '')}`, 'Carreira') + UI.tabs('carreira', [['', 'Candidaturas'], ['rede', 'Networking'], ['experiencias', 'Experiências'], ['metas', 'Metas profissionais']], sub);
  const t = U.today();
  if (sub === 'rede') {
    const Cn = OS.all('contacts'), act = Cn.filter(c => c.last && U.diff(t, c.last) <= 90), due = Cn.filter(c => c.next && c.next <= t);
    return head + `<div class="kpis">${UI.kpi('Contactos', Cn.length)}${UI.kpi('Ativos (90 dias)', act.length, Cn.length ? U.pct(act.length / Cn.length) : '')}${UI.kpi('Follow-ups pendentes', due.length, '', { tone: due.length ? 'warn' : '' })}${UI.kpi('Relações fortes', Cn.filter(c => U.num(c.strength) >= 4).length, 'força 4–5')}</div>
    ${due.length ? `<div class="pn"><div class="pn-h"><h3>Contactar agora</h3></div>${due.map(c => `<div class="li"><div class="li-t click" data-edit="contacts:${c.id}"><b>${esc(c.name)}</b><small>${esc([c.role, c.org].filter(Boolean).join(' · '))} · último contacto ${c.last ? U.rel(c.last) : '—'}</small></div><button class="btn sm" data-act="contactDone" data-id="${c.id}">Contactado hoje</button></div>`).join('')}</div>` : ''}
    ${UI.table({ key: 'ct', coll: 'contacts', rows: U.sortBy(Cn, c => c.last || '', -1), cols: [{ l: 'Nome', v: c => `<b style="font-weight:520">${esc(c.name)}</b>`, s: c => c.name }, { l: 'Descrição', v: c => esc([c.role, c.org].filter(Boolean).join(' · ')), cls: 'wrap' }, { l: 'Contacto', v: c => esc(c.contact || '') }, { l: 'Força', cls: 'r', v: c => c.strength ? '●'.repeat(c.strength) : '—', s: c => U.num(c.strength) }, { l: 'Último contacto', v: c => c.last ? `<span class="${U.diff(t, c.last) > 90 ? 'warn' : ''}">${U.fmtD(c.last)}</span>` : '—', s: c => c.last || '' }, { l: 'Follow-up', v: c => c.next ? `<span class="${c.next <= t ? 'neg' : ''}">${U.fmtD(c.next)}</span>` : '—', s: c => c.next || '9' }, { l: '', v: c => `<button class="btn xs ghost" data-act="contactDone" data-id="${c.id}">Contactado</button>` }] })}`;
  }
  if (sub === 'experiencias') {
    const E = U.sortBy(OS.all('experiences'), e => e.start || '', -1);
    return head + `<div class="row gap8">${UI.addBtn('experiences', 'Nova experiência')}</div>${E.length ? `<div class="pn">${E.map(e => `<div class="gcard" style="grid-template-columns:1fr auto"><div class="click" data-edit="experiences:${e.id}" style="cursor:pointer"><b>${esc(e.title)}</b><div class="gmeta">${UI.badge(e.kind, 'out')}${e.org ? `<span>${esc(e.org)}</span>` : ''}${(e.skills || []).map(s => UI.badge(s, 'acc')).join('')}</div>${e.desc ? `<div class="tx2" style="font-size:13px;margin-top:6px;white-space:pre-wrap">${esc(e.desc)}</div>` : ''}</div><span class="mono mut" style="font-size:12px">${e.start ? U.fmtYM(U.ym(e.start)) : ''}${e.end ? ' – ' + U.fmtYM(U.ym(e.end)) : e.start ? ' – atual' : ''}</span></div>`).join('')}</div>` : UI.empty('Regista empregos, voluntariado, eventos, palestras e competições. Tudo conta para o capital profissional.')}`;
  }
  if (sub === 'metas') {
    const G = OS.all('goals').filter(g => g.cat === 'Trabalho' || g.cat === 'Empresa');
    return head + `<div class="row gap8">${UI.addBtn('goals', 'Meta profissional', { cat: 'Trabalho' })}</div><div class="pn">${G.map(g => { const i = OS.Goal.info(g); return `<div class="gcard"><div class="click" data-edit="goals:${g.id}" style="cursor:pointer"><b>${esc(g.title)}</b><div class="gmeta">${UI.badge(i.st[0], i.st[1])}${g.due ? `<span>prazo ${U.fmtD(g.due)}</span>` : ''}</div></div><div class="gp">${UI.bar(i.p, '', i.exp)}</div></div>`; }).join('') || UI.empty('Sem metas profissionais.')}</div>
    <section><div class="sech"><h2>Competências e certificações</h2><a class="btn ghost sm" href="#aprendizagem">Aprendizagem ${UI.ic('right')}</a></div><div class="pn">${OS.all('skills').map(s => `<div class="bar-row"><span class="l">${esc(s.name)}</span>${UI.bar((U.num(s.level) || 0) / 5, '', (U.num(s.targetLevel) || 5) / 5)}<span class="v">${s.level || 0}/5 → ${s.targetLevel || 5}</span></div>`).join('') || UI.empty('Sem competências.')}</div></section>`;
  }
  const Ap = OS.all('applications'), sent = Ap.filter(a => a.status !== 'Por enviar'), resp = sent.filter(a => !['Enviada', 'Sem resposta'].includes(a.status)), iv = Ap.filter(a => ['Entrevista', 'Proposta', 'Aceite'].includes(a.status));
  const ST = ['Por enviar', 'Enviada', 'Entrevista', 'Proposta', 'Aceite', 'Recusada', 'Sem resposta'];
  return head + `<div class="kpis">${UI.kpi('Enviadas', sent.length)}${UI.kpi('Taxa de resposta', sent.length ? U.pct(resp.length / sent.length) : '—')}${UI.kpi('Entrevistas', iv.length)}${UI.kpi('Próxima entrevista', (() => { const n = U.sortBy(Ap.filter(a => a.interview && a.interview >= t), a => a.interview)[0]; return n ? U.fmtDS(n.interview) + ' · ' + esc(n.company) : '—'; })())}</div>
  <div class="kan">${ST.map(s => { const it = Ap.filter(a => (a.status || 'Por enviar') === s); return `<div class="kcol"><h4>${s}<span class="mono">${it.length}</span></h4>${it.map(a => `<div class="kcard" data-edit="applications:${a.id}"><b>${esc(a.company)}</b><div class="meta">${a.role ? `<span>${esc(a.role)}</span>` : ''}${a.date ? `<span>${U.fmtDS(a.date)}</span>` : ''}${a.interview ? UI.badge('entrevista ' + U.fmtDS(a.interview), 'warn') : ''}</div>${a.next ? `<span class="tx2" style="font-size:12px">→ ${esc(a.next)}</span>` : ''}</div>`).join('')}</div>`; }).join('')}</div>`;
};
A.contactDone = b => { const c = OS.get('contacts', b.dataset.id); if (!c) return; OS.upd('contacts', c.id, { last: U.today(), next: c.next && c.next <= U.today() ? U.addDays(U.today(), 30) : c.next }); UI.toast('Contacto registado · próximo follow-up em 30 dias', 'pos'); };

/* ================= CAPITAL PROFISSIONAL ================= */
V.capital = () => {
  const c = Car.capital(), t = U.today(), months = Array.from({ length: 12 }, (_, i) => U.addMonths(U.ym(t), i - 11));
  const series = months.map(m => { const end = m === U.ym(t) ? t : m + '-' + U.dim(m); return Car.capital(end).score; });
  const prev = Car.capital(U.addDays(t, -90));
  const dims = Object.entries(c.dims), weakest = U.sortBy(dims, d => d[1]).slice(0, 3);
  const tips = { 'Competências': 'Sobe um nível numa competência: completa a etapa seguinte da trilha em Aprendizagem.', 'Certificações': 'Escolhe uma certificação e cria-a como item "Certificação" com prazo.', 'Experiência': 'Regista a experiência atual (emprego, voluntariado) com data de início.', 'Rede': 'Contacta 2 pessoas esta semana e marca follow-ups.', 'Projetos & eventos': 'Vai a um evento ou palestra este mês e regista-o em Experiências.', 'Aprendizagem': 'Sessões ligadas a competências contam aqui: usa o Modo Foco com a competência.', 'Mercado': 'Envia uma candidatura ou submete uma oportunidade do Opportunity Center.' };
  return UI.head('Capital Profissional', 'Tudo o que aumenta a tua capacidade profissional ao longo do tempo, num só indicador de 0 a 1000. Cada dimensão satura num alvo realista para a tua fase (estudante do 1.º ano).', '', 'Carreira') +
  `<div class="g g-side"><div class="pn"><div class="eyebrow">Capital atual</div><div class="big-num" style="font-size:52px;margin:6px 0">${U.nf(c.score)}</div><div class="row gap8">${UI.trend(c.score, prev.score)}<span class="mut" style="font-size:12.5px">em 90 dias (${U.nf(prev.score)} → ${U.nf(c.score)})</span></div>
    <div class="divider"></div><dl class="kv"><dt>Competências</dt><dd>${c.skills}</dd><dt>Certificações</dt><dd>${c.certs}</dd><dt>Meses de experiência</dt><dd>${U.nf(c.months, 1)}</dd><dt>Contactos (ativos)</dt><dd>${c.contacts} (${c.active})</dd><dt>Candidaturas / entrevistas</dt><dd>${c.apps} / ${c.interviews}</dd><dt>Projetos concluídos</dt><dd>${c.projects}</dd><dt>Eventos e palestras</dt><dd>${c.events}</dd><dt>Horas de aprendizagem</dt><dd>${U.nf(c.learnH, 1)}</dd></dl></div>
  <div class="pn"><div class="pn-h"><h3>Perfil por dimensão</h3><span class="mut" style="font-size:12px">agora vs há 90 dias</span></div>${C.mount({ type: 'radar', axes: dims.map(d => d[0]), series: [{ name: 'Agora', data: dims.map(d => d[1]) }, { name: 'Há 90 dias', data: Object.values(prev.dims), color: 'var(--mut)' }] }, 320)}</div></div>
  <div class="g g-main"><div class="pn"><div class="pn-h"><h3>Evolução · 12 meses</h3></div>${C.mount({ type: 'line', labels: months.map(U.fmtYM), series: [{ name: 'Capital', data: series }], fmt: v => U.nf(v) }, 220)}</div>
  <div class="pn"><div class="pn-h"><h3>Para subir mais depressa</h3></div>${weakest.map(([k, v]) => `<div class="ins">${UI.ic('arrowUp', 'acc')}<div><b style="font-weight:540">${k} · ${U.pct(v)}</b><div class="tx2" style="font-size:13px">${tips[k]}</div></div></div>`).join('')}</div></div>
  <div class="pn">${dims.map(([k, v]) => `<div class="bar-row" style="grid-template-columns:160px 1fr 60px"><span class="l">${k}</span>${UI.bar(v, v >= .66 ? 'pos' : '')}<span class="v">${U.pct(v)}</span></div>`).join('')}</div>`;
};

/* ================= OPORTUNIDADES ================= */
V.oportunidades = () => {
  const O = OS.all('opps'), t = U.today(), f = OS.ui.oppK || '', vis = O.filter(o => !f || o.kind === f);
  const open = O.filter(o => !['Aceite', 'Recusada', 'Perdida'].includes(o.status)), soon = open.filter(o => o.deadline && o.deadline >= t && U.diff(o.deadline, t) <= 14 && !['Submetida', 'Em avaliação'].includes(o.status));
  const ST = ['Identificada', 'A preparar', 'Submetida', 'Em avaliação', 'Aceite', 'Recusada', 'Perdida'];
  const kinds = [...new Set(O.map(o => o.kind).filter(Boolean))];
  return UI.head('Opportunity Center', 'Cursos, certificações, eventos, palestras, programas da UA, estágios, empregos, competições, bolsas e oportunidades de negócio. Cada uma com prazo e próxima ação.', UI.addBtn('opps', 'Nova oportunidade'), 'Carreira') +
  `<div class="kpis">${UI.kpi('Abertas', open.length)}${UI.kpi('Prazo em 14 dias', soon.length, '', { tone: soon.length ? 'warn' : '' })}${UI.kpi('Submetidas', O.filter(o => ['Submetida', 'Em avaliação'].includes(o.status)).length)}${UI.kpi('Aceites', O.filter(o => o.status === 'Aceite').length, '', { tone: 'pos' })}${UI.kpi('Perdidas por prazo', O.filter(o => o.status === 'Perdida').length)}</div>
  ${kinds.length > 1 ? `<div class="row gap8">${UI.chip('Todas', 'oppK', !f, 'data-v=""')}${kinds.map(k => UI.chip(k, 'oppK', f === k, `data-v="${k}"`)).join('')}</div>` : ''}
  ${O.length ? `<div class="kan">${ST.map(s => { const it = U.sortBy(vis.filter(o => (o.status || 'Identificada') === s), o => o.deadline || '9'); return `<div class="kcol"><h4>${s}<span class="mono">${it.length}</span></h4>${it.map(o => { const d = o.deadline ? U.diff(o.deadline, t) : null; return `<div class="kcard" data-edit="opps:${o.id}"><span class="eyebrow">${esc(o.kind || '')}</span><b>${esc(o.name)}</b>${o.inst ? `<span class="mut" style="font-size:12px">${esc(o.inst)}</span>` : ''}<div class="meta">${o.deadline ? UI.badge(d < 0 ? 'prazo passou' : 'prazo ' + U.fmtDS(o.deadline), d != null && d >= 0 && d <= 7 ? 'neg' : d != null && d <= 21 && d >= 0 ? 'warn' : '') : ''}</div>${o.next ? `<span class="tx2" style="font-size:12px">→ ${esc(o.next)}</span>` : ''}${o.link ? `<a class="acc" style="font-size:12px" href="${esc(o.link)}" target="_blank" rel="noopener">abrir link</a>` : ''}</div>`; }).join('')}</div>`; }).join('')}</div>` : UI.empty('Regista a primeira oportunidade: programa de voluntariado da UA, estágio de verão, curso de Excel, bolsa, evento de networking em Aveiro…', UI.addBtn('opps', 'Adicionar oportunidade', null, ''))}`;
};
A.oppK = b => OS.setUI('oppK', b.dataset.v);

/* ================= MOVA ================= */
const MT = [['', 'Visão'], ['vendas', 'Vendas'], ['despesas', 'Despesas'], ['clientes', 'Clientes'], ['produtos', 'Produtos'], ['marketing', 'Marketing'], ['operacoes', 'Operações'], ['perfil', 'Perfil']];
V.mova = sub => {
  const mv = OS.one('mova');
  return UI.head(esc(mv.name || 'Mova'), mv.what ? esc(mv.what) : 'Sistema da empresa: receitas, custos, margens, clientes, produtos, marketing e operações.', `${UI.addBtn('mvsales', 'Venda')}${UI.addBtn('mvexp', 'Despesa', null, '')}`, 'Empresa') + UI.tabs('mova', MT, sub) + (MV[sub || 'visao'] || MV.visao)();

const MV = {};
MV.visao = () => {
